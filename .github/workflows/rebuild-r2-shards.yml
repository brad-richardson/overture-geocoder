name: Rebuild R2 Shards

on:
  # Monthly scheduled rebuild (25th of each month, after typical Overture release)
  schedule:
    - cron: '0 5 25 * *'  # 5 AM UTC, 25th of each month

  workflow_dispatch:
    inputs:
      countries:
        description: 'Comma-separated country codes (empty = all countries)'
        type: string
        required: false
        default: ''
      head_threshold:
        description: 'Population threshold for HEAD shard'
        type: number
        required: false
        default: 100000
      version:
        description: 'Version override (YYYY-MM-DD.N, e.g. 2026-02-25.0). Leave empty for today.'
        type: string
        required: false
        default: ''
      build_type:
        description: 'What to build'
        type: choice
        required: true
        default: 'both'
        options:
          - forward
          - reverse
          - both
      confirm:
        description: 'Type "REBUILD" to confirm (not required for scheduled runs)'
        type: string
        required: false
      build_id_index:
        description: 'Build GERS ID index (parquet shards)'
        type: boolean
        required: false
        default: true
      cleanup_old_versions:
        description: 'Delete versions older than 90 days'
        type: boolean
        required: false
        default: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  rebuild-shards:
    runs-on: ubuntu-24.04-arm
    # Run if: scheduled OR manual with REBUILD confirmation
    if: github.event_name == 'schedule' || github.event.inputs.confirm == 'REBUILD'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install DuckDB CLI
        run: |
          curl -L -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-aarch64.zip
          unzip duckdb.zip
          sudo mv duckdb /usr/local/bin/
          duckdb --version

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: |
          npm install -g wrangler
          echo "Wrangler version: $(wrangler --version)"

      - name: Seed catalog from R2
        run: |
          mkdir -p shards
          if wrangler r2 object get geocoder-shards/catalog.json --remote --pipe > shards/catalog.json 2>/dev/null; then
            echo "Seeded shards/catalog.json from R2"
            cat shards/catalog.json | python3 -c "
          import json, sys
          catalog = json.load(sys.stdin)
          versions = [l['href'].split('/')[1] for l in catalog.get('links', []) if l.get('rel') == 'child']
          print(f'  Existing versions: {versions}')
          "
          else
            echo "No existing catalog in R2 (first deploy)"
          fi

      - name: Download divisions data
        run: ./scripts/download_divisions.sh

      - name: Build forward geocoding shards
        if: github.event.inputs.build_type != 'reverse'
        run: |
          ARGS="--head-threshold ${{ github.event.inputs.head_threshold || '100000' }}"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ARGS="$ARGS --version ${{ github.event.inputs.version }}"
          fi
          if [ -n "${{ github.event.inputs.countries }}" ]; then
            ARGS="$ARGS --countries ${{ github.event.inputs.countries }}"
          fi
          python scripts/build_shards.py $ARGS

      - name: Build reverse geocoding shards
        if: github.event.inputs.build_type != 'forward'
        run: |
          ARGS="--reverse --head-threshold ${{ github.event.inputs.head_threshold || '100000' }}"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ARGS="$ARGS --version ${{ github.event.inputs.version }}"
          fi
          if [ -n "${{ github.event.inputs.countries }}" ]; then
            ARGS="$ARGS --countries ${{ github.event.inputs.countries }}"
          fi
          python scripts/build_shards.py $ARGS

      - name: Get version
        id: version
        run: |
          VERSION=$(ls -1 shards/ | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$' | sort -r | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Built version: $VERSION"

      - name: Upload forward shards to R2
        if: github.event.inputs.build_type != 'reverse'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PROGRESS_DIR=$(mktemp -d)
          ERRORS_DIR=$(mktemp -d)

          # Upload catalog (log output to catch local vs remote)
          echo "Uploading catalog.json..."
          wrangler r2 object put geocoder-shards/catalog.json \
            --file shards/catalog.json --remote
          echo "Uploading ${VERSION}/collection.json..."
          wrangler r2 object put "geocoder-shards/${VERSION}/collection.json" \
            --file "shards/${VERSION}/collection.json" --remote

          # Count total database files
          TOTAL_DB=$(find "shards/${VERSION}/shards" -name "*.db" | wc -l)
          echo "Uploading ${TOTAL_DB} forward shard databases..."

          # Upload function with progress tracking
          upload_file() {
            local file="$1"
            local version="$2"
            local subdir="$3"
            local progress_dir="$4"
            local errors_dir="$5"
            local filename=$(basename "$file")
            local r2_path="${version}/${subdir}/${filename}"

            if output=$(wrangler r2 object put "geocoder-shards/${r2_path}" --file "$file" --remote 2>&1); then
              # Check for accidental local storage
              if echo "$output" | grep -q "Resource location: local"; then
                echo "ERROR: $filename uploaded to LOCAL not REMOTE" > "${errors_dir}/${filename}.log"
              fi
              touch "${progress_dir}/${filename}"
            else
              echo "$output" > "${errors_dir}/${filename}.log"
              touch "${progress_dir}/${filename}"
            fi
          }
          export -f upload_file
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID

          # Upload databases with progress (16 parallel — network-bound)
          find "shards/${VERSION}/shards" -name "*.db" | \
            xargs -P 16 -I {} bash -c "upload_file '{}' '${VERSION}' 'shards' '${PROGRESS_DIR}' '${ERRORS_DIR}'" &

          # Show progress while uploading
          while [ $(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l) -lt "$TOTAL_DB" ]; do
            DONE=$(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l)
            printf "\r  Progress: %d/%d databases" "$DONE" "$TOTAL_DB"
            sleep 1
          done
          wait
          printf "\r  Progress: %d/%d databases ✓\n" "$TOTAL_DB" "$TOTAL_DB"

          # Check for errors
          if [ "$(ls -A $ERRORS_DIR 2>/dev/null)" ]; then
            echo "::error::Some uploads failed:"
            cat "$ERRORS_DIR"/*.log
            exit 1
          fi

          rm -rf "$PROGRESS_DIR" "$ERRORS_DIR"

      - name: Upload reverse shards to R2
        if: github.event.inputs.build_type != 'forward'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PROGRESS_DIR=$(mktemp -d)
          ERRORS_DIR=$(mktemp -d)

          echo "Uploading ${VERSION}/reverse-collection.json..."
          wrangler r2 object put "geocoder-shards/${VERSION}/reverse-collection.json" \
            --file "shards/${VERSION}/reverse-collection.json" --remote

          # Count total database files
          TOTAL_DB=$(find "shards/${VERSION}/reverse" -name "*.db" | wc -l)
          echo "Uploading ${TOTAL_DB} reverse shard databases..."

          upload_file() {
            local file="$1"
            local version="$2"
            local subdir="$3"
            local progress_dir="$4"
            local errors_dir="$5"
            local filename=$(basename "$file")
            local r2_path="${version}/${subdir}/${filename}"

            if output=$(wrangler r2 object put "geocoder-shards/${r2_path}" --file "$file" --remote 2>&1); then
              if echo "$output" | grep -q "Resource location: local"; then
                echo "ERROR: $filename uploaded to LOCAL not REMOTE" > "${errors_dir}/${filename}.log"
              fi
              touch "${progress_dir}/${filename}"
            else
              echo "$output" > "${errors_dir}/${filename}.log"
              touch "${progress_dir}/${filename}"
            fi
          }
          export -f upload_file
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID

          find "shards/${VERSION}/reverse" -name "*.db" | \
            xargs -P 16 -I {} bash -c "upload_file '{}' '${VERSION}' 'reverse' '${PROGRESS_DIR}' '${ERRORS_DIR}'" &

          while [ $(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l) -lt "$TOTAL_DB" ]; do
            DONE=$(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l)
            printf "\r  Progress: %d/%d databases" "$DONE" "$TOTAL_DB"
            sleep 1
          done
          wait
          printf "\r  Progress: %d/%d databases ✓\n" "$TOTAL_DB" "$TOTAL_DB"

          if [ "$(ls -A $ERRORS_DIR 2>/dev/null)" ]; then
            echo "::error::Some uploads failed:"
            cat "$ERRORS_DIR"/*.log
            exit 1
          fi

          rm -rf "$PROGRESS_DIR" "$ERRORS_DIR"

      - name: Verify R2 uploads
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'both' }}"
          FAILED=0

          echo "Verifying R2 uploads for version ${VERSION}..."

          # Verify catalog.json exists
          if [ "$BUILD_TYPE" = "forward" ] || [ "$BUILD_TYPE" = "both" ]; then
            if wrangler r2 object get geocoder-shards/catalog.json --remote --pipe > /dev/null 2>&1; then
              echo "  ✓ catalog.json"
            else
              echo "::error::catalog.json NOT FOUND in R2 after upload"
              FAILED=1
            fi

            if wrangler r2 object get "geocoder-shards/${VERSION}/collection.json" --remote --pipe > /dev/null 2>&1; then
              echo "  ✓ ${VERSION}/collection.json"
            else
              echo "::error::${VERSION}/collection.json NOT FOUND in R2 after upload"
              FAILED=1
            fi

            # Spot-check HEAD shard
            if wrangler r2 object get "geocoder-shards/${VERSION}/shards/HEAD.db" --remote --pipe > /dev/null 2>&1; then
              echo "  ✓ ${VERSION}/shards/HEAD.db"
            else
              echo "::error::${VERSION}/shards/HEAD.db NOT FOUND in R2 after upload"
              FAILED=1
            fi
          fi

          if [ "$BUILD_TYPE" = "reverse" ] || [ "$BUILD_TYPE" = "both" ]; then
            if wrangler r2 object get "geocoder-shards/${VERSION}/reverse-collection.json" --remote --pipe > /dev/null 2>&1; then
              echo "  ✓ ${VERSION}/reverse-collection.json"
            else
              echo "::error::${VERSION}/reverse-collection.json NOT FOUND in R2 after upload"
              FAILED=1
            fi

            # Spot-check reverse HEAD shard
            if wrangler r2 object get "geocoder-shards/${VERSION}/reverse/HEAD.db" --remote --pipe > /dev/null 2>&1; then
              echo "  ✓ ${VERSION}/reverse/HEAD.db"
            else
              echo "::error::${VERSION}/reverse/HEAD.db NOT FOUND in R2 after upload"
              FAILED=1
            fi
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::R2 verification failed - uploads may not have persisted"
            exit 1
          fi
          echo "All R2 verification checks passed."

      - name: Cleanup old versions (90+ days)
        if: github.event_name == 'schedule' || github.event.inputs.cleanup_old_versions == 'true'
        run: |
          echo "Checking for old versions to clean up..."
          CUTOFF=$(date -d '-90 days' +%Y-%m-%d)
          echo "Cutoff date: $CUTOFF"

          # List all version directories in R2 by parsing catalog.json
          CATALOG=$(wrangler r2 object get geocoder-shards/catalog.json --remote 2>/dev/null || echo '{}')
          VERSIONS=$(echo "$CATALOG" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+' | sort -u || true)

          DELETED_COUNT=0
          DELETED_VERSIONS=""
          for VERSION in $VERSIONS; do
            VERSION_DATE="${VERSION%.*}"  # Remove .0 suffix
            if [[ "$VERSION_DATE" < "$CUTOFF" ]]; then
              echo "Deleting old version: $VERSION"
              # List and delete all objects with this version prefix
              # Note: wrangler doesn't have recursive delete, so we list and delete individually
              OBJECTS=$(wrangler r2 object list geocoder-shards --prefix "${VERSION}/" --remote 2>/dev/null | grep -oE '"key": "[^"]+' | sed 's/"key": "//' || true)
              for OBJ in $OBJECTS; do
                wrangler r2 object delete "geocoder-shards/${OBJ}" --remote 2>/dev/null || true
              done
              DELETED_COUNT=$((DELETED_COUNT + 1))
              DELETED_VERSIONS="$DELETED_VERSIONS $VERSION"
            fi
          done

          echo "Deleted $DELETED_COUNT old versions"

          # Re-upload catalog.json with pruned versions removed
          if [ "$DELETED_COUNT" -gt 0 ]; then
            echo "Updating catalog.json to remove pruned versions..."
            echo "$CATALOG" | python3 -c "
          import json, sys
          deleted = set('$DELETED_VERSIONS'.split())
          catalog = json.load(sys.stdin)
          catalog['links'] = [
              l for l in catalog.get('links', [])
              if l.get('rel') != 'child' or l['href'].split('/')[1] not in deleted
          ]
          json.dump(catalog, sys.stdout, indent=2)
          " > /tmp/catalog-pruned.json
            wrangler r2 object put geocoder-shards/catalog.json \
              --file /tmp/catalog-pruned.json --remote
            echo "Updated catalog.json in R2"
          fi

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'both' }}"

          echo "## R2 Shards Rebuild Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Build type:** ${BUILD_TYPE}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$BUILD_TYPE" = "forward" ] || [ "$BUILD_TYPE" = "both" ]; then
            echo "### Forward Geocoding Shards" >> $GITHUB_STEP_SUMMARY
            echo "**Count:** $(ls -1 shards/${VERSION}/shards/*.db 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** $(du -sh shards/${VERSION}/shards/ 2>/dev/null | cut -f1 || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$BUILD_TYPE" = "reverse" ] || [ "$BUILD_TYPE" = "both" ]; then
            echo "### Reverse Geocoding Shards" >> $GITHUB_STEP_SUMMARY
            echo "**Count:** $(ls -1 shards/${VERSION}/reverse/*.db 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** $(du -sh shards/${VERSION}/reverse/ 2>/dev/null | cut -f1 || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          fi

  id-prep:
    runs-on: ubuntu-24.04-arm
    if: |
      (github.event_name == 'schedule' || github.event.inputs.confirm == 'REBUILD') &&
      (github.event_name == 'schedule' || github.event.inputs.build_id_index != 'false')
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Compute version
        id: version
        run: |
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then
            if ! echo "$INPUT" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$'; then
              echo "::error::Invalid version format '$INPUT'. Expected YYYY-MM-DD.N (e.g. 2026-02-25.0)"
              exit 1
            fi
            VERSION="$INPUT"
          else
            VERSION=$(python3 -c "
          from datetime import datetime, timezone
          print(datetime.now(timezone.utc).strftime('%Y-%m-%d') + '.0')
          ")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "ID index version: $VERSION"

  id-stage:
    runs-on: ubuntu-24.04-arm
    needs: id-prep
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            phase: stage-base
            extra_args: ""
          - name: registry-000-3ff
            phase: stage-registry
            extra_args: "--prefix-start 000 --prefix-end 3ff"
          - name: registry-400-7ff
            phase: stage-registry
            extra_args: "--prefix-start 400 --prefix-end 7ff"
          - name: registry-800-bff
            phase: stage-registry
            extra_args: "--prefix-start 800 --prefix-end bff"
          - name: registry-c00-fff
            phase: stage-registry
            extra_args: "--prefix-start c00 --prefix-end fff"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Verify R2 credentials
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2 S3 API credentials not configured"
            exit 1
          fi
          echo "R2 credentials configured"

      - name: "Stage: ${{ matrix.name }}"
        run: |
          python -u scripts/build_id_index.py \
            --phase ${{ matrix.phase }} --prefix-len 3 --workers 8 \
            --version ${{ needs.id-prep.outputs.version }} \
            ${{ matrix.extra_args }}

  id-build:
    runs-on: ubuntu-24.04-arm
    needs: [id-prep, id-stage]
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix_start: "000"
            prefix_end: "3ff"
          - prefix_start: "400"
            prefix_end: "7ff"
          - prefix_start: "800"
            prefix_end: "bff"
          - prefix_start: "c00"
            prefix_end: "fff"
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Monitor resources
        run: |
          echo "=== Initial disk space ==="
          df -h / /tmp
          (while true; do
            echo "--- $(date -u +%H:%M:%S) ---"
            free -m | grep Mem | awk '{printf "Memory: %dMB used / %dMB total (%.0f%%)\n", $3, $2, $3/$2*100}'
            df -h / | tail -1 | awk '{printf "Disk: %s used / %s total (%s)\n", $3, $2, $5}'
            echo "Processes: $(ps aux | wc -l)"
            sleep 30
          done) &

      - name: "Build: ${{ matrix.prefix_start }}-${{ matrix.prefix_end }}"
        run: |
          python -u scripts/build_id_index.py \
            --phase build --prefix-len 3 --workers 8 \
            --version ${{ needs.id-prep.outputs.version }} \
            --prefix-start ${{ matrix.prefix_start }} \
            --prefix-end ${{ matrix.prefix_end }}

  id-post:
    runs-on: ubuntu-24.04-arm
    needs: [id-prep, id-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build ID metadata
        run: |
          python -u scripts/build_id_index.py \
            --phase metadata --prefix-len 3 \
            --version ${{ needs.id-prep.outputs.version }}

      - name: Verify R2 uploads
        run: |
          VERSION="${{ needs.id-prep.outputs.version }}"
          echo "Verifying version: ${VERSION}"

          if wrangler r2 object get "geocoder-shards/${VERSION}/id-collection.json" --remote --pipe > /dev/null 2>&1; then
            echo "  ok: ${VERSION}/id-collection.json"
          else
            echo "::error::${VERSION}/id-collection.json NOT FOUND in R2"
            exit 1
          fi

          for PREFIX in 000 400 800 c00 fff; do
            if wrangler r2 object get "geocoder-shards/${VERSION}/id-index/${PREFIX}.parquet" --remote --pipe > /dev/null 2>&1; then
              echo "  ok: ${VERSION}/id-index/${PREFIX}.parquet"
            else
              echo "  skip: ${VERSION}/id-index/${PREFIX}.parquet (may not exist)"
            fi
          done
          echo "R2 verification passed."

      - name: Summary
        if: always()
        run: |
          VERSION="${{ needs.id-prep.outputs.version }}"
          echo "## ID Index Rebuild" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
