name: Rebuild R2 Shards

on:
  # Monthly scheduled rebuild (25th of each month, after typical Overture release)
  schedule:
    - cron: '0 5 25 * *'  # 5 AM UTC, 25th of each month

  workflow_dispatch:
    inputs:
      countries:
        description: 'Comma-separated country codes (empty = all countries)'
        type: string
        required: false
        default: ''
      head_threshold:
        description: 'Population threshold for HEAD shard'
        type: number
        required: false
        default: 100000
      version:
        description: 'Version override (YYYY-MM-DD.N, e.g. 2026-02-25.0). Leave empty for today.'
        type: string
        required: false
        default: ''
      build_type:
        description: 'What to build'
        type: choice
        required: true
        default: 'both'
        options:
          - forward
          - reverse
          - both
      confirm:
        description: 'Type "REBUILD" to confirm (not required for scheduled runs)'
        type: string
        required: false
      build_id_index:
        description: 'Build GERS ID index (parquet shards)'
        type: boolean
        required: false
        default: true
      cleanup_old_versions:
        description: 'Prune old versions, keeping only the newest 2'
        type: boolean
        required: false
        default: true

# Overlapping runs (scheduled + a manual re-trigger) would compute the same
# {date}.{n} version from the same published catalog, interleave uploads into
# one prefix, and clobber each other's catalog publish. Queue instead.
concurrency:
  group: rebuild-r2-shards
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  # R2 S3-compatibility: only compute checksums when the operation needs them
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  # Compute the build version and Overture release exactly once so every job
  # (forward, reverse, id-index) writes to the same version directory and
  # reads the same release, even if the build crosses UTC midnight.
  prep:
    runs-on: ubuntu-24.04-arm
    # Run if: scheduled OR manual with REBUILD confirmation
    if: github.event_name == 'schedule' || github.event.inputs.confirm == 'REBUILD'
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Discover Overture release
        id: release
        run: |
          RELEASE=$(python3 scripts/stac.py | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+' | head -1)
          if [ -z "$RELEASE" ]; then
            echo "::error::Failed to discover latest Overture release from STAC"
            exit 1
          fi
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "Overture release: $RELEASE"

      - name: Compute version
        id: version
        run: |
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then
            if ! echo "$INPUT" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$'; then
              echo "::error::Invalid version format '$INPUT'. Expected YYYY-MM-DD.N (e.g. 2026-02-25.0)"
              exit 1
            fi
            VERSION="$INPUT"
          else
            # Read the published catalog so a same-day re-run bumps the .N
            # suffix instead of mutating a live, already-published version.
            # A transient fetch failure must abort (not fall back to {}):
            # assuming an empty catalog here reuses a live version number and
            # rebuilds it in place under the worker.
            export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
            ./scripts/r2_catalog_fetch.sh /tmp/catalog.json
            # This deployment is long past first-deploy: an absent catalog
            # here is a misclassified outage, and computing a version from
            # {} reuses a live version number and republishes it as latest
            # (this happened 2026-07-02: a spurious R2 404 made a rebuild
            # compute .0 over a live .2). For a genuine first deploy, pass
            # an explicit version input instead.
            if [ ! -f /tmp/catalog.json ]; then
              echo "::error::catalog.json reported absent from R2 — refusing to auto-number a version. If this is truly a first deploy, dispatch with an explicit version input."
              exit 1
            fi
            VERSION=$(python3 -c "
          import json
          from datetime import datetime, timezone
          date = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          try:
              with open('/tmp/catalog.json') as f:
                  catalog = json.load(f)
          except Exception:
              catalog = {}
          existing = {
              l['href'].split('/')[1]
              for l in catalog.get('links', [])
              if l.get('rel') == 'child' and '/' in l.get('href', '')
          }
          n = 0
          while f'{date}.{n}' in existing:
              n += 1
          print(f'{date}.{n}')
          ")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"

  rebuild-shards:
    runs-on: ubuntu-24.04-arm
    needs: prep
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install DuckDB CLI
        run: |
          # Pinned to the same version as the Python duckdb package below.
          # Do NOT downgrade below 1.5: older duckdb writes id-index parquet
          # the worker's positional/stats-based reader can't use (the reason
          # for the original 1.5.1 pin in 6ada977).
          curl -L -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.1/duckdb_cli-linux-arm64.zip
          unzip duckdb.zip
          sudo mv duckdb /usr/local/bin/
          duckdb --version

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: |
          npm install -g wrangler
          echo "Wrangler version: $(wrangler --version)"

      - name: Seed catalog from R2
        run: |
          # A transient fetch failure must abort (not seed an empty catalog):
          # the seeded file is what build_shards.py extends and the publish
          # step uploads, so starting from empty would drop every existing
          # version reference from the published catalog.
          mkdir -p shards
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          ./scripts/r2_catalog_fetch.sh shards/catalog.json
          if [ -f shards/catalog.json ]; then
            echo "Seeded shards/catalog.json from R2"
            python3 -c "
          import json, sys
          catalog = json.load(sys.stdin)
          versions = [l['href'].split('/')[1] for l in catalog.get('links', []) if l.get('rel') == 'child']
          print(f'  Existing versions: {versions}')
          " < shards/catalog.json
          else
            # Past first-deploy an absent catalog is a misclassified outage;
            # publishing a catalog seeded from empty would drop every live
            # version reference (see the Compute version guard).
            echo "::error::catalog.json reported absent from R2 — refusing to seed an empty catalog past first deploy."
            exit 1
          fi

      - name: Download divisions data
        run: ./scripts/download_divisions.sh "${{ needs.prep.outputs.release }}"

      - name: Build forward geocoding shards
        if: github.event.inputs.build_type != 'reverse'
        run: |
          ARGS="--version ${{ needs.prep.outputs.version }}"
          ARGS="$ARGS --head-threshold ${{ github.event.inputs.head_threshold || '100000' }}"
          if [ -n "${{ github.event.inputs.countries }}" ]; then
            ARGS="$ARGS --countries ${{ github.event.inputs.countries }}"
          fi
          python scripts/build_shards.py $ARGS

      - name: Build reverse geocoding shards
        if: github.event.inputs.build_type != 'forward'
        run: |
          ARGS="--reverse --version ${{ needs.prep.outputs.version }}"
          ARGS="$ARGS --head-threshold ${{ github.event.inputs.head_threshold || '100000' }}"
          if [ -n "${{ github.event.inputs.countries }}" ]; then
            ARGS="$ARGS --countries ${{ github.event.inputs.countries }}"
          fi
          python scripts/build_shards.py $ARGS

      # Upload order is deliberate (atomic publication): shard databases
      # first, then collection.json files, then verification, and only after
      # everything is in place is catalog.json (the sole discovery pointer)
      # uploaded in the final publish step.
      - name: Upload forward shards to R2
        if: github.event.inputs.build_type != 'reverse'
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          PROGRESS_DIR=$(mktemp -d)
          ERRORS_DIR=$(mktemp -d)

          # Count total database files
          TOTAL_DB=$(find "shards/${VERSION}/shards" -name "*.db" | wc -l)
          echo "Uploading ${TOTAL_DB} forward shard databases..."

          # Upload function with retry and progress tracking
          upload_file() {
            local file="$1"
            local version="$2"
            local subdir="$3"
            local progress_dir="$4"
            local errors_dir="$5"
            local filename=$(basename "$file")
            local r2_path="${version}/${subdir}/${filename}"
            local attempt output

            for attempt in 1 2 3; do
              if output=$(wrangler r2 object put "geocoder-shards/${r2_path}" --file "$file" --remote 2>&1); then
                # Check for accidental local storage (retrying won't help)
                if echo "$output" | grep -q "Resource location: local"; then
                  echo "ERROR: $filename uploaded to LOCAL not REMOTE" > "${errors_dir}/${filename}.log"
                else
                  rm -f "${errors_dir}/${filename}.log"
                fi
                touch "${progress_dir}/${filename}"
                return 0
              fi
              echo "$output" > "${errors_dir}/${filename}.log"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done
            touch "${progress_dir}/${filename}"
          }
          export -f upload_file
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID

          # Upload databases with progress (16 parallel — network-bound)
          find "shards/${VERSION}/shards" -name "*.db" | \
            xargs -P 16 -I {} bash -c "upload_file '{}' '${VERSION}' 'shards' '${PROGRESS_DIR}' '${ERRORS_DIR}'" &
          UPLOAD_PID=$!

          # Show progress while the uploader is alive (bounded: exits with
          # the background pid instead of spinning until the job timeout)
          while kill -0 "$UPLOAD_PID" 2>/dev/null; do
            DONE=$(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l)
            printf "\r  Progress: %d/%d databases" "$DONE" "$TOTAL_DB"
            sleep 5
          done
          wait "$UPLOAD_PID" || true
          DONE=$(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l)
          printf "\r  Progress: %d/%d databases\n" "$DONE" "$TOTAL_DB"

          # Check for errors
          if [ "$(ls -A $ERRORS_DIR 2>/dev/null)" ]; then
            echo "::error::Some uploads failed:"
            cat "$ERRORS_DIR"/*.log
            exit 1
          fi
          if [ "$DONE" -lt "$TOTAL_DB" ]; then
            echo "::error::Upload incomplete: ${DONE}/${TOTAL_DB} databases uploaded"
            exit 1
          fi

          # Shards are in place; now upload collection metadata (with retry)
          echo "Uploading ${VERSION}/collection.json..."
          for attempt in 1 2 3; do
            if wrangler r2 object put "geocoder-shards/${VERSION}/collection.json" \
              --file "shards/${VERSION}/collection.json" --remote; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to upload collection.json after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

          rm -rf "$PROGRESS_DIR" "$ERRORS_DIR"

      - name: Upload reverse shards to R2
        if: github.event.inputs.build_type != 'forward'
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          PROGRESS_DIR=$(mktemp -d)
          ERRORS_DIR=$(mktemp -d)

          # Count total database files
          TOTAL_DB=$(find "shards/${VERSION}/reverse" -name "*.db" | wc -l)
          echo "Uploading ${TOTAL_DB} reverse shard databases..."

          upload_file() {
            local file="$1"
            local version="$2"
            local subdir="$3"
            local progress_dir="$4"
            local errors_dir="$5"
            local filename=$(basename "$file")
            local r2_path="${version}/${subdir}/${filename}"
            local attempt output

            for attempt in 1 2 3; do
              if output=$(wrangler r2 object put "geocoder-shards/${r2_path}" --file "$file" --remote 2>&1); then
                if echo "$output" | grep -q "Resource location: local"; then
                  echo "ERROR: $filename uploaded to LOCAL not REMOTE" > "${errors_dir}/${filename}.log"
                else
                  rm -f "${errors_dir}/${filename}.log"
                fi
                touch "${progress_dir}/${filename}"
                return 0
              fi
              echo "$output" > "${errors_dir}/${filename}.log"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done
            touch "${progress_dir}/${filename}"
          }
          export -f upload_file
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID

          find "shards/${VERSION}/reverse" -name "*.db" | \
            xargs -P 16 -I {} bash -c "upload_file '{}' '${VERSION}' 'reverse' '${PROGRESS_DIR}' '${ERRORS_DIR}'" &
          UPLOAD_PID=$!

          while kill -0 "$UPLOAD_PID" 2>/dev/null; do
            DONE=$(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l)
            printf "\r  Progress: %d/%d databases" "$DONE" "$TOTAL_DB"
            sleep 5
          done
          wait "$UPLOAD_PID" || true
          DONE=$(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l)
          printf "\r  Progress: %d/%d databases\n" "$DONE" "$TOTAL_DB"

          if [ "$(ls -A $ERRORS_DIR 2>/dev/null)" ]; then
            echo "::error::Some uploads failed:"
            cat "$ERRORS_DIR"/*.log
            exit 1
          fi
          if [ "$DONE" -lt "$TOTAL_DB" ]; then
            echo "::error::Upload incomplete: ${DONE}/${TOTAL_DB} databases uploaded"
            exit 1
          fi

          # Shards are in place; now upload collection metadata (with retry)
          echo "Uploading ${VERSION}/reverse-collection.json..."
          for attempt in 1 2 3; do
            if wrangler r2 object put "geocoder-shards/${VERSION}/reverse-collection.json" \
              --file "shards/${VERSION}/reverse-collection.json" --remote; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to upload reverse-collection.json after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

          rm -rf "$PROGRESS_DIR" "$ERRORS_DIR"

      - name: Verify R2 uploads
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'both' }}"
          FAILED=0

          echo "Verifying R2 uploads for version ${VERSION}..."

          if [ "$BUILD_TYPE" = "forward" ] || [ "$BUILD_TYPE" = "both" ]; then
            if wrangler r2 object get "geocoder-shards/${VERSION}/collection.json" --remote --pipe > /dev/null 2>&1; then
              echo "  ok: ${VERSION}/collection.json"
            else
              echo "::error::${VERSION}/collection.json NOT FOUND in R2 after upload"
              FAILED=1
            fi

            # Spot-check HEAD shard
            if wrangler r2 object get "geocoder-shards/${VERSION}/shards/HEAD.db" --remote --pipe > /dev/null 2>&1; then
              echo "  ok: ${VERSION}/shards/HEAD.db"
            else
              echo "::error::${VERSION}/shards/HEAD.db NOT FOUND in R2 after upload"
              FAILED=1
            fi
          fi

          if [ "$BUILD_TYPE" = "reverse" ] || [ "$BUILD_TYPE" = "both" ]; then
            if wrangler r2 object get "geocoder-shards/${VERSION}/reverse-collection.json" --remote --pipe > /dev/null 2>&1; then
              echo "  ok: ${VERSION}/reverse-collection.json"
            else
              echo "::error::${VERSION}/reverse-collection.json NOT FOUND in R2 after upload"
              FAILED=1
            fi

            # Spot-check reverse HEAD shard
            if wrangler r2 object get "geocoder-shards/${VERSION}/reverse/HEAD.db" --remote --pipe > /dev/null 2>&1; then
              echo "  ok: ${VERSION}/reverse/HEAD.db"
            else
              echo "::error::${VERSION}/reverse/HEAD.db NOT FOUND in R2 after upload"
              FAILED=1
            fi
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::R2 verification failed - uploads may not have persisted"
            exit 1
          fi
          echo "All R2 verification checks passed."

      # catalog.json is the only discovery pointer: publishing it LAST means
      # a failed run leaves the new version invisible rather than half-live.
      - name: Publish catalog.json
        if: github.event.inputs.build_type != 'reverse'
        run: |
          echo "Publishing catalog.json (final step of atomic publication)..."
          for attempt in 1 2 3; do
            if wrangler r2 object put geocoder-shards/catalog.json \
              --file shards/catalog.json --remote; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to upload catalog.json after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

          # Verify readback
          if wrangler r2 object get geocoder-shards/catalog.json --remote --pipe > /dev/null 2>&1; then
            echo "  ok: catalog.json published"
          else
            echo "::error::catalog.json NOT FOUND in R2 after publish"
            exit 1
          fi

      - name: Prune to newest 2 versions
        if: github.event_name == 'schedule' || github.event.inputs.cleanup_old_versions == 'true'
        run: |
          # Retention policy: keep only the newest KEEP_VERSIONS versions
          # (current + one fallback); everything older is deleted, catalog
          # FIRST so a mid-cleanup crash can never leave dangling links.
          #
          # Known tradeoff (each version is a few $/mo of R2): this step runs
          # while the current version's id-index is still building, so /id
          # falls back to the previous version. If THAT version's id-index is
          # itself broken (the case patch-id-stage exists for), there is no
          # deeper fallback left — patch the prior id-index promptly.
          KEEP_VERSIONS=2
          CURRENT="${{ needs.prep.outputs.version }}"
          echo "Keep newest $KEEP_VERSIONS versions (current build: $CURRENT)"

          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # Abort on transient fetch failure: an empty catalog here would
          # look like "no versions referenced" and prune real versions.
          ./scripts/r2_catalog_fetch.sh /tmp/catalog.json
          [ -f /tmp/catalog.json ] || { echo "No catalog; nothing to prune."; exit 0; }

          # Catalog versions, newest first. -V so 2026-02-25.10 > 2026-02-25.9
          # (lexicographic sort would misorder double-digit .N suffixes).
          VERSIONS=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+' /tmp/catalog.json | sort -u -V -r || true)

          echo "$(echo $VERSIONS | wc -w) version(s) total; keeping newest $KEEP_VERSIONS"

          OLD_VERSIONS=$(echo "$VERSIONS" | tail -n +$((KEEP_VERSIONS + 1)) | tr '\n' ' ')
          if [ -z "${OLD_VERSIONS// /}" ]; then
            echo "Nothing to prune."
            exit 0
          fi
          # Safety: the version built this run is the newest and must never be pruned.
          for V in $OLD_VERSIONS; do
            if [ "$V" = "$CURRENT" ]; then
              echo "::error::refusing to prune the current build version $CURRENT"
              exit 1
            fi
          done
          echo "Pruning:$OLD_VERSIONS"

          # 1) Prune catalog.json FIRST so a mid-cleanup crash can never leave the
          #    catalog pointing at deleted versions. Guarded against over-pruning.
          python3 -c "
          import json
          deleted = set('$OLD_VERSIONS'.split())
          with open('/tmp/catalog.json') as f:
              catalog = json.load(f)
          kept = [
              l for l in catalog.get('links', [])
              if l.get('rel') != 'child' or l['href'].split('/')[1] not in deleted
          ]
          children = [l for l in kept if l.get('rel') == 'child']
          assert len(children) >= $KEEP_VERSIONS, 'refusing to leave %d version(s)' % len(children)
          assert any(l.get('latest') for l in children), 'no latest version would remain'
          catalog['links'] = kept
          with open('/tmp/catalog-pruned.json', 'w') as f:
              json.dump(catalog, f, indent=2)
          "
          aws s3 cp /tmp/catalog-pruned.json "s3://geocoder-shards/catalog.json" \
            --endpoint-url "$ENDPOINT" --region auto --content-type application/json
          echo "catalog.json pruned"

          # 2) Delete the dropped versions' objects (paginated S3 batch deletes).
          DELETED_COUNT=0
          for VERSION in $OLD_VERSIONS; do
            echo "Deleting old version: $VERSION"
            aws s3 rm "s3://geocoder-shards/${VERSION}/" --recursive \
              --endpoint-url "$ENDPOINT" --region auto --only-show-errors
            DELETED_COUNT=$((DELETED_COUNT + 1))
          done
          echo "Pruned $DELETED_COUNT version(s)"

      - name: Sweep stray staging and orphaned prefixes
        if: github.event_name == 'schedule' || github.event.inputs.cleanup_old_versions == 'true'
        run: |
          # Reclaim debris the catalog-based cleanup above cannot see:
          #   * stray <version>/staging/ left behind when a build's own staging
          #     cleanup never ran (the version is kept; only staging/ is removed)
          #   * orphaned <version>/ prefixes never referenced by catalog.json
          #     (e.g. a build that died before publishing), once past the cutoff
          # STRICTLY scoped to exact YYYY-MM-DD.N prefixes, so backups/,
          # smoketest/, catalog.json and any other object are never touched. The
          # version built by THIS run is always skipped: its staging/ is still in
          # use by the parallel id-build job and is removed by id-post.
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          S3() { aws "$@" --endpoint-url "$ENDPOINT" --region auto; }

          # Unrelated to version retention (which keeps the newest 2): this
          # cutoff only guards ORPHANED, never-referenced prefixes. An
          # in-flight build is always recent (and the current build is
          # skipped outright), so an orphan older than this is a
          # dead/abandoned build, safe to remove.
          CUTOFF=$(date -d '-30 days' +%Y-%m-%d)
          CURRENT="${{ needs.prep.outputs.version }}"
          echo "Cutoff: $CUTOFF   current version (always skipped): $CURRENT"

          # Abort on transient fetch failure: an empty catalog here would mark
          # every referenced live version as an orphan and delete it.
          ./scripts/r2_catalog_fetch.sh /tmp/sweep-catalog.json
          [ -f /tmp/sweep-catalog.json ] || { echo "No catalog; skipping sweep."; exit 0; }
          REFERENCED=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+' /tmp/sweep-catalog.json | sort -u || true)

          PREFIXES=$(S3 s3 ls "s3://geocoder-shards/" | awk '/PRE/{print $2}' || true)
          stripped=0
          orphans=0
          for PFX in $PREFIXES; do
            V="${PFX%/}"
            # Guard 1: only ever act on an EXACT date-version prefix.
            if ! echo "$V" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$'; then
              echo "skip (not a version prefix): $PFX"
              continue
            fi
            # Guard 2: never touch the version this run is building.
            if [ "$V" = "$CURRENT" ]; then
              echo "skip (current build): $V"
              continue
            fi
            if echo "$REFERENCED" | grep -qx "$V"; then
              # Referenced version: keep it, strip only a stray staging/.
              if S3 s3 ls "s3://geocoder-shards/$V/staging/" >/dev/null 2>&1; then
                # Guard 3: staging written in the last 2 days may belong to an
                # in-flight patch-id-stage run for this version; leave it.
                RECENT=$(S3 s3 ls "s3://geocoder-shards/$V/staging/" --recursive \
                  | awk -v cutoff="$(date -d '-2 days' +%Y-%m-%d)" '$1 >= cutoff' | head -1)
                if [ -n "$RECENT" ]; then
                  echo "skip staging strip (modified within 2 days, possible in-flight patch): $V/staging/"
                  continue
                fi
                echo "strip stray staging: $V/staging/"
                S3 s3 rm "s3://geocoder-shards/$V/staging/" --recursive --only-show-errors
                S3 s3 ls "s3://geocoder-shards/$V/collection.json" >/dev/null \
                  || { echo "::error::$V/collection.json missing after staging strip"; exit 1; }
                stripped=$((stripped + 1))
              fi
            else
              # Unreferenced prefix = orphan. Only delete once past the cutoff so a
              # concurrent or just-failed build (always recent) is never removed.
              VDATE="${V%.*}"
              if [[ "$VDATE" < "$CUTOFF" ]]; then
                echo "delete orphaned prefix (older than $CUTOFF): $V/"
                S3 s3 rm "s3://geocoder-shards/$V/" --recursive --only-show-errors
                orphans=$((orphans + 1))
              else
                echo "keep recent unreferenced prefix (may be in flight): $V/"
              fi
            fi
          done
          echo "Sweep done: stripped staging from $stripped version(s), deleted $orphans orphaned prefix(es)."

      - name: Summary
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'both' }}"

          echo "## R2 Shards Rebuild Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Overture release:** ${{ needs.prep.outputs.release }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build type:** ${BUILD_TYPE}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$BUILD_TYPE" = "forward" ] || [ "$BUILD_TYPE" = "both" ]; then
            echo "### Forward Geocoding Shards" >> $GITHUB_STEP_SUMMARY
            echo "**Count:** $(ls -1 shards/${VERSION}/shards/*.db 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** $(du -sh shards/${VERSION}/shards/ 2>/dev/null | cut -f1 || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$BUILD_TYPE" = "reverse" ] || [ "$BUILD_TYPE" = "both" ]; then
            echo "### Reverse Geocoding Shards" >> $GITHUB_STEP_SUMMARY
            echo "**Count:** $(ls -1 shards/${VERSION}/reverse/*.db 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** $(du -sh shards/${VERSION}/reverse/ 2>/dev/null | cut -f1 || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          fi

  id-stage:
    runs-on: ubuntu-24.04-arm
    needs: prep
    if: github.event_name == 'schedule' || github.event.inputs.build_id_index != 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            phase: stage-base
            extra_args: ""
          - name: registry-000-3ff
            phase: stage-registry
            extra_args: "--prefix-start 000 --prefix-end 3ff"
          - name: registry-400-7ff
            phase: stage-registry
            extra_args: "--prefix-start 400 --prefix-end 7ff"
          - name: registry-800-bff
            phase: stage-registry
            extra_args: "--prefix-start 800 --prefix-end bff"
          - name: registry-c00-fff
            phase: stage-registry
            extra_args: "--prefix-start c00 --prefix-end fff"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Verify R2 credentials
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2 S3 API credentials not configured"
            exit 1
          fi
          echo "R2 credentials configured"

      - name: "Stage: ${{ matrix.name }}"
        run: |
          python -u scripts/build_id_index.py \
            --phase ${{ matrix.phase }} --prefix-len 3 --workers 8 \
            --version ${{ needs.prep.outputs.version }} \
            --release ${{ needs.prep.outputs.release }} \
            ${{ matrix.extra_args }}

  # One global, deterministic dictionary must be published before the four
  # parallel build ranges assign compact IDs. No range may derive IDs alone.
  id-dictionary:
    runs-on: ubuntu-24.04-arm
    needs: [prep, id-stage]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build global ID locator dictionary
        run: |
          python -u scripts/build_id_index.py \
            --phase dictionaries --prefix-len 3 \
            --version ${{ needs.prep.outputs.version }} \
            --release ${{ needs.prep.outputs.release }}

  id-build:
    runs-on: ubuntu-24.04-arm
    needs: [prep, id-dictionary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix_start: "000"
            prefix_end: "3ff"
          - prefix_start: "400"
            prefix_end: "7ff"
          - prefix_start: "800"
            prefix_end: "bff"
          - prefix_start: "c00"
            prefix_end: "fff"
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Monitor resources
        run: |
          echo "=== Initial disk space ==="
          df -h / /tmp
          (while true; do
            echo "--- $(date -u +%H:%M:%S) ---"
            free -m | grep Mem | awk '{printf "Memory: %dMB used / %dMB total (%.0f%%)\n", $3, $2, $3/$2*100}'
            df -h / | tail -1 | awk '{printf "Disk: %s used / %s total (%s)\n", $3, $2, $5}'
            echo "Processes: $(ps aux | wc -l)"
            sleep 30
          done) &

      - name: "Build: ${{ matrix.prefix_start }}-${{ matrix.prefix_end }}"
        run: |
          python -u scripts/build_id_index.py \
            --phase build --prefix-len 3 --workers 8 \
            --version ${{ needs.prep.outputs.version }} \
            --release ${{ needs.prep.outputs.release }} \
            --prefix-start ${{ matrix.prefix_start }} \
            --prefix-end ${{ matrix.prefix_end }}

  id-post:
    runs-on: ubuntu-24.04-arm
    needs: [prep, id-build]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build ID metadata
        run: |
          python -u scripts/build_id_index.py \
            --phase metadata --prefix-len 3 \
            --version ${{ needs.prep.outputs.version }} \
            --release ${{ needs.prep.outputs.release }}

      - name: Verify R2 uploads
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          echo "Verifying version: ${VERSION}"

          if wrangler r2 object get "geocoder-shards/${VERSION}/id-collection.json" --remote --pipe > /dev/null 2>&1; then
            echo "  ok: ${VERSION}/id-collection.json"
          else
            echo "::error::${VERSION}/id-collection.json NOT FOUND in R2"
            exit 1
          fi

          for PREFIX in 000 400 800 c00 fff; do
            if wrangler r2 object get "geocoder-shards/${VERSION}/id-index/${PREFIX}.parquet" --remote --pipe > /dev/null 2>&1; then
              echo "  ok: ${VERSION}/id-index/${PREFIX}.parquet"
            else
              echo "  skip: ${VERSION}/id-index/${PREFIX}.parquet (may not exist)"
            fi
          done
          echo "R2 verification passed."

      # Staging data is several GB per version and is never read again once
      # the build is verified; delete it via paginated S3 batch deletes.
      - name: Cleanup staging data
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "Deleting ${VERSION}/staging/ from R2..."
          aws s3 rm "s3://geocoder-shards/${VERSION}/staging/" --recursive \
            --endpoint-url "$ENDPOINT" --region auto --only-show-errors
          echo "Staging data deleted."

      - name: Summary
        if: always()
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          echo "## ID Index Rebuild" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Overture release:** ${{ needs.prep.outputs.release }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
