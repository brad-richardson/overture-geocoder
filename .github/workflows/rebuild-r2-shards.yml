name: Rebuild R2 Shards

on:
  # Monthly scheduled rebuild (25th of each month, after typical Overture release)
  schedule:
    - cron: '0 6 25 * *'  # 6 AM UTC, 25th of each month

  workflow_dispatch:
    inputs:
      countries:
        description: 'Comma-separated country codes (empty = all countries)'
        type: string
        required: false
        default: ''
      head_threshold:
        description: 'Population threshold for HEAD shard'
        type: number
        required: false
        default: 100000
      version_suffix:
        description: 'Version suffix (0 = default, 1/2/3 = same-day rebuilds)'
        type: string
        required: false
        default: '0'
      build_type:
        description: 'What to build'
        type: choice
        required: true
        default: 'both'
        options:
          - forward
          - reverse
          - both
      confirm:
        description: 'Type "REBUILD" to confirm (not required for scheduled runs)'
        type: string
        required: false
      cleanup_old_versions:
        description: 'Delete versions older than 90 days'
        type: boolean
        required: false
        default: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  rebuild-shards:
    runs-on: ubuntu-latest
    # Run if: scheduled OR manual with REBUILD confirmation
    if: github.event_name == 'schedule' || github.event.inputs.confirm == 'REBUILD'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install DuckDB CLI
        run: |
          curl -L -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-amd64.zip
          unzip duckdb.zip
          sudo mv duckdb /usr/local/bin/
          duckdb --version

      - name: Install Python dependencies
        run: pip install duckdb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: |
          npm install -g wrangler
          echo "Wrangler version: $(wrangler --version)"

      - name: Download divisions data
        run: ./scripts/download_divisions.sh

      - name: Build forward geocoding shards
        if: github.event.inputs.build_type == 'forward' || github.event.inputs.build_type == 'both'
        run: |
          ARGS="--head-threshold ${{ github.event.inputs.head_threshold || 100000 }}"
          ARGS="$ARGS --version-suffix ${{ github.event.inputs.version_suffix || '0' }}"
          if [ -n "${{ github.event.inputs.countries }}" ]; then
            ARGS="$ARGS --countries ${{ github.event.inputs.countries }}"
          fi
          python scripts/build_shards.py $ARGS

      - name: Build reverse geocoding shards
        if: github.event.inputs.build_type == 'reverse' || github.event.inputs.build_type == 'both'
        run: |
          ARGS="--reverse --head-threshold ${{ github.event.inputs.head_threshold || 100000 }}"
          ARGS="$ARGS --version-suffix ${{ github.event.inputs.version_suffix || '0' }}"
          if [ -n "${{ github.event.inputs.countries }}" ]; then
            ARGS="$ARGS --countries ${{ github.event.inputs.countries }}"
          fi
          python scripts/build_shards.py $ARGS

      - name: Get version
        id: version
        run: |
          VERSION=$(ls -1 shards/ | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$' | sort -r | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Built version: $VERSION"

      - name: Upload forward shards to R2
        if: github.event.inputs.build_type == 'forward' || github.event.inputs.build_type == 'both'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PROGRESS_DIR=$(mktemp -d)
          ERRORS_DIR=$(mktemp -d)

          # Upload catalog (log output to catch local vs remote)
          echo "Uploading catalog.json..."
          wrangler r2 object put geocoder-shards/catalog.json \
            --file shards/catalog.json --remote
          echo "Uploading ${VERSION}/collection.json..."
          wrangler r2 object put "geocoder-shards/${VERSION}/collection.json" \
            --file "shards/${VERSION}/collection.json" --remote

          # Count total database files
          TOTAL_DB=$(find "shards/${VERSION}/shards" -name "*.db" | wc -l)
          echo "Uploading ${TOTAL_DB} forward shard databases..."

          # Upload function with progress tracking
          upload_file() {
            local file="$1"
            local version="$2"
            local subdir="$3"
            local progress_dir="$4"
            local errors_dir="$5"
            local filename=$(basename "$file")
            local r2_path="${version}/${subdir}/${filename}"

            if output=$(wrangler r2 object put "geocoder-shards/${r2_path}" --file "$file" --remote 2>&1); then
              # Check for accidental local storage
              if echo "$output" | grep -q "Resource location: local"; then
                echo "ERROR: $filename uploaded to LOCAL not REMOTE" > "${errors_dir}/${filename}.log"
              fi
              touch "${progress_dir}/${filename}"
            else
              echo "$output" > "${errors_dir}/${filename}.log"
              touch "${progress_dir}/${filename}"
            fi
          }
          export -f upload_file
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID

          # Upload databases with progress
          find "shards/${VERSION}/shards" -name "*.db" | \
            xargs -P 8 -I {} bash -c "upload_file '{}' '${VERSION}' 'shards' '${PROGRESS_DIR}' '${ERRORS_DIR}'" &

          # Show progress while uploading
          while [ $(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l) -lt "$TOTAL_DB" ]; do
            DONE=$(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l)
            printf "\r  Progress: %d/%d databases" "$DONE" "$TOTAL_DB"
            sleep 1
          done
          wait
          printf "\r  Progress: %d/%d databases ✓\n" "$TOTAL_DB" "$TOTAL_DB"

          # Check for errors
          if [ "$(ls -A $ERRORS_DIR 2>/dev/null)" ]; then
            echo "::error::Some uploads failed:"
            cat "$ERRORS_DIR"/*.log
            exit 1
          fi

          rm -rf "$PROGRESS_DIR" "$ERRORS_DIR"

      - name: Upload reverse shards to R2
        if: github.event.inputs.build_type == 'reverse' || github.event.inputs.build_type == 'both'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PROGRESS_DIR=$(mktemp -d)
          ERRORS_DIR=$(mktemp -d)

          echo "Uploading ${VERSION}/reverse-collection.json..."
          wrangler r2 object put "geocoder-shards/${VERSION}/reverse-collection.json" \
            --file "shards/${VERSION}/reverse-collection.json" --remote

          # Count total database files
          TOTAL_DB=$(find "shards/${VERSION}/reverse" -name "*.db" | wc -l)
          echo "Uploading ${TOTAL_DB} reverse shard databases..."

          upload_file() {
            local file="$1"
            local version="$2"
            local subdir="$3"
            local progress_dir="$4"
            local errors_dir="$5"
            local filename=$(basename "$file")
            local r2_path="${version}/${subdir}/${filename}"

            if output=$(wrangler r2 object put "geocoder-shards/${r2_path}" --file "$file" --remote 2>&1); then
              if echo "$output" | grep -q "Resource location: local"; then
                echo "ERROR: $filename uploaded to LOCAL not REMOTE" > "${errors_dir}/${filename}.log"
              fi
              touch "${progress_dir}/${filename}"
            else
              echo "$output" > "${errors_dir}/${filename}.log"
              touch "${progress_dir}/${filename}"
            fi
          }
          export -f upload_file
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID

          find "shards/${VERSION}/reverse" -name "*.db" | \
            xargs -P 8 -I {} bash -c "upload_file '{}' '${VERSION}' 'reverse' '${PROGRESS_DIR}' '${ERRORS_DIR}'" &

          while [ $(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l) -lt "$TOTAL_DB" ]; do
            DONE=$(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l)
            printf "\r  Progress: %d/%d databases" "$DONE" "$TOTAL_DB"
            sleep 1
          done
          wait
          printf "\r  Progress: %d/%d databases ✓\n" "$TOTAL_DB" "$TOTAL_DB"

          if [ "$(ls -A $ERRORS_DIR 2>/dev/null)" ]; then
            echo "::error::Some uploads failed:"
            cat "$ERRORS_DIR"/*.log
            exit 1
          fi

          rm -rf "$PROGRESS_DIR" "$ERRORS_DIR"

      - name: Verify R2 uploads
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'both' }}"
          FAILED=0

          echo "Verifying R2 uploads for version ${VERSION}..."

          # Verify catalog.json exists
          if [ "$BUILD_TYPE" = "forward" ] || [ "$BUILD_TYPE" = "both" ]; then
            if wrangler r2 object get geocoder-shards/catalog.json --remote --pipe > /dev/null 2>&1; then
              echo "  ✓ catalog.json"
            else
              echo "::error::catalog.json NOT FOUND in R2 after upload"
              FAILED=1
            fi

            if wrangler r2 object get "geocoder-shards/${VERSION}/collection.json" --remote --pipe > /dev/null 2>&1; then
              echo "  ✓ ${VERSION}/collection.json"
            else
              echo "::error::${VERSION}/collection.json NOT FOUND in R2 after upload"
              FAILED=1
            fi

            # Spot-check HEAD shard
            if wrangler r2 object get "geocoder-shards/${VERSION}/shards/HEAD.db" --remote --pipe > /dev/null 2>&1; then
              echo "  ✓ ${VERSION}/shards/HEAD.db"
            else
              echo "::error::${VERSION}/shards/HEAD.db NOT FOUND in R2 after upload"
              FAILED=1
            fi
          fi

          if [ "$BUILD_TYPE" = "reverse" ] || [ "$BUILD_TYPE" = "both" ]; then
            if wrangler r2 object get "geocoder-shards/${VERSION}/reverse-collection.json" --remote --pipe > /dev/null 2>&1; then
              echo "  ✓ ${VERSION}/reverse-collection.json"
            else
              echo "::error::${VERSION}/reverse-collection.json NOT FOUND in R2 after upload"
              FAILED=1
            fi

            # Spot-check reverse HEAD shard
            if wrangler r2 object get "geocoder-shards/${VERSION}/reverse/HEAD.db" --remote --pipe > /dev/null 2>&1; then
              echo "  ✓ ${VERSION}/reverse/HEAD.db"
            else
              echo "::error::${VERSION}/reverse/HEAD.db NOT FOUND in R2 after upload"
              FAILED=1
            fi
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::R2 verification failed - uploads may not have persisted"
            exit 1
          fi
          echo "All R2 verification checks passed."

      - name: Cleanup old versions (90+ days)
        if: github.event_name == 'schedule' || github.event.inputs.cleanup_old_versions == 'true'
        run: |
          echo "Checking for old versions to clean up..."
          CUTOFF=$(date -d '-90 days' +%Y-%m-%d)
          echo "Cutoff date: $CUTOFF"

          # List all version directories in R2 by parsing catalog.json
          CATALOG=$(wrangler r2 object get geocoder-shards/catalog.json --remote 2>/dev/null || echo '{}')
          VERSIONS=$(echo "$CATALOG" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+' | sort -u || true)

          DELETED_COUNT=0
          for VERSION in $VERSIONS; do
            VERSION_DATE="${VERSION%.*}"  # Remove .0 suffix
            if [[ "$VERSION_DATE" < "$CUTOFF" ]]; then
              echo "Deleting old version: $VERSION"
              # List and delete all objects with this version prefix
              # Note: wrangler doesn't have recursive delete, so we list and delete individually
              OBJECTS=$(wrangler r2 object list geocoder-shards --prefix "${VERSION}/" --remote 2>/dev/null | grep -oE '"key": "[^"]+' | sed 's/"key": "//' || true)
              for OBJ in $OBJECTS; do
                wrangler r2 object delete "geocoder-shards/${OBJ}" --remote 2>/dev/null || true
              done
              DELETED_COUNT=$((DELETED_COUNT + 1))
            fi
          done

          echo "Deleted $DELETED_COUNT old versions"

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'both' }}"

          echo "## R2 Shards Rebuild Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Build type:** ${BUILD_TYPE}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$BUILD_TYPE" = "forward" ] || [ "$BUILD_TYPE" = "both" ]; then
            echo "### Forward Geocoding Shards" >> $GITHUB_STEP_SUMMARY
            echo "**Count:** $(ls -1 shards/${VERSION}/shards/*.db 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** $(du -sh shards/${VERSION}/shards/ 2>/dev/null | cut -f1 || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$BUILD_TYPE" = "reverse" ] || [ "$BUILD_TYPE" = "both" ]; then
            echo "### Reverse Geocoding Shards" >> $GITHUB_STEP_SUMMARY
            echo "**Count:** $(ls -1 shards/${VERSION}/reverse/*.db 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** $(du -sh shards/${VERSION}/reverse/ 2>/dev/null | cut -f1 || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          fi
