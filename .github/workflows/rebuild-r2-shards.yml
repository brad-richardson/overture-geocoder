name: Rebuild R2 Shards

on:
  # Monthly scheduled rebuild (25th of each month, after typical Overture release)
  schedule:
    - cron: '0 5 25 * *'  # 5 AM UTC, 25th of each month

  workflow_dispatch:
    inputs:
      countries:
        description: 'Comma-separated country codes (empty = all countries)'
        type: string
        required: false
        default: ''
      head_threshold:
        description: 'Population threshold for HEAD shard'
        type: number
        required: false
        default: 100000
      version:
        description: 'Version override (YYYY-MM-DD.N, e.g. 2026-02-25.0). Leave empty for today.'
        type: string
        required: false
        default: ''
      build_type:
        description: 'What to build'
        type: choice
        required: true
        default: 'both'
        options:
          - forward
          - reverse
          - both
      confirm:
        description: 'Type "REBUILD" to confirm (not required for scheduled runs)'
        type: string
        required: false
      build_id_index:
        description: 'Build GERS ID index (parquet shards)'
        type: boolean
        required: false
        default: true
      promote:
        description: 'Publish as production latest (requires countries empty, build_type=both, and ID enabled)'
        type: boolean
        required: false
        default: false
      cleanup_old_versions:
        description: 'After successful promotion and smoke, prune old versions (keep newest 3)'
        type: boolean
        required: false
        default: false

# Overlapping runs (scheduled + a manual re-trigger) would compute the same
# {date}.{n} version from the same published catalog, interleave uploads into
# one prefix, and clobber each other's catalog publish. Queue instead.
concurrency:
  # Shared with any workflow that can mutate the production root catalog.
  group: r2-production-catalog
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  # R2 S3-compatibility: only compute checksums when the operation needs them
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  # Compute the build version and Overture release exactly once so every job
  # (forward, reverse, id-index) writes to the same version directory and
  # reads the same release, even if the build crosses UTC midnight.
  prep:
    runs-on: ubuntu-24.04-arm
    # Scheduled production writes are disabled unless an explicit repository
    # variable opts in. Manual runs still require the typed confirmation.
    if: >-
      (github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_REBUILD == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'REBUILD')
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.release.outputs.release }}
      promote: ${{ steps.mode.outputs.promote }}
      complete: ${{ steps.mode.outputs.complete }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Discover Overture release
        id: release
        run: |
          RELEASE=$(python3 scripts/stac.py | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+' | head -1)
          if [ -z "$RELEASE" ]; then
            echo "::error::Failed to discover latest Overture release from STAC"
            exit 1
          fi
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "Overture release: $RELEASE"

      - name: Validate build and promotion mode
        id: mode
        env:
          COUNTRIES_INPUT: ${{ github.event.inputs.countries || '' }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'both' }}"
          COUNTRIES="$COUNTRIES_INPUT"
          BUILD_ID="${{ github.event_name == 'schedule' || github.event.inputs.build_id_index != 'false' }}"
          PROMOTE="${{ github.event_name == 'schedule' || github.event.inputs.promote == 'true' }}"

          COMPLETE=false
          if [ -z "$COUNTRIES" ] && [ "$BUILD_TYPE" = "both" ] && [ "$BUILD_ID" = "true" ]; then
            COMPLETE=true
          fi

          if [ "$PROMOTE" = "true" ]; then
            if [ "$COMPLETE" != "true" ]; then
              echo "::error::Promotion requires a complete build: countries empty, build_type=both, build_id_index=true"
              exit 1
            fi
          fi

          echo "promote=$PROMOTE" >> "$GITHUB_OUTPUT"
          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"
          echo "Build mode: type=$BUILD_TYPE, id=$BUILD_ID, complete=$COMPLETE, promote=$PROMOTE"

      - name: Compute version
        id: version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version || '' }}
        run: |
          INPUT="$VERSION_INPUT"
          if [ -n "$INPUT" ]; then
            if ! echo "$INPUT" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$'; then
              echo "::error::Invalid version format '$INPUT'. Expected YYYY-MM-DD.N (e.g. 2026-02-25.0)"
              exit 1
            fi
            VERSION="$INPUT"
          else
            # Read the published catalog so a same-day re-run bumps the .N
            # suffix instead of mutating a live, already-published version.
            # A transient fetch failure must abort (not fall back to {}):
            # assuming an empty catalog here reuses a live version number and
            # rebuilds it in place under the worker.
            export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
            ./scripts/r2_catalog_fetch.sh /tmp/catalog.json
            # This deployment is long past first-deploy: an absent catalog
            # here is a misclassified outage, and computing a version from
            # {} reuses a live version number and republishes it as latest
            # (this happened 2026-07-02: a spurious R2 404 made a rebuild
            # compute .0 over a live .2). For a genuine first deploy, pass
            # an explicit version input instead.
            if [ ! -f /tmp/catalog.json ]; then
              echo "::error::catalog.json reported absent from R2 — refusing to auto-number a version. If this is truly a first deploy, dispatch with an explicit version input."
              exit 1
            fi
            VERSION=$(python3 -c "
          import json
          from datetime import datetime, timezone
          date = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          try:
              with open('/tmp/catalog.json') as f:
                  catalog = json.load(f)
          except Exception:
              catalog = {}
          existing = {
              l['href'].split('/')[1]
              for l in catalog.get('links', [])
              if l.get('rel') == 'child' and '/' in l.get('href', '')
          }
          n = 0
          while f'{date}.{n}' in existing:
              n += 1
          print(f'{date}.{n}')
          ")
          fi

          # Versioned prefixes are immutable. Check the actual bucket, not
          # only catalog links: failed/non-promoting runs can leave an orphan
          # prefix that must never be resumed or overwritten by this workflow.
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          EXISTING=$(aws s3api list-objects-v2 \
            --bucket geocoder-shards --prefix "${VERSION}/" --max-keys 1 \
            --endpoint-url "$ENDPOINT" --region auto \
            --query 'KeyCount' --output text)
          if [ "$EXISTING" != "0" ]; then
            echo "::error::Version prefix ${VERSION}/ already exists in R2; choose a new version"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"

  rebuild-shards:
    runs-on: ubuntu-24.04-arm
    needs: prep
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install DuckDB CLI
        run: |
          # Pinned to the same version as the Python duckdb package below.
          # Do NOT downgrade below 1.5: older duckdb writes id-index parquet
          # the worker's positional/stats-based reader can't use (the reason
          # for the original 1.5.1 pin in 6ada977).
          curl -L -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.1/duckdb_cli-linux-arm64.zip
          unzip duckdb.zip
          sudo mv duckdb /usr/local/bin/
          duckdb --version

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: |
          npm install -g wrangler
          echo "Wrangler version: $(wrangler --version)"

      - name: Download divisions data
        run: ./scripts/download_divisions.sh "${{ needs.prep.outputs.release }}"

      - name: Build forward geocoding shards
        if: github.event.inputs.build_type != 'reverse'
        env:
          BUILD_VERSION: ${{ needs.prep.outputs.version }}
          OVERTURE_RELEASE: ${{ needs.prep.outputs.release }}
          HEAD_THRESHOLD: ${{ github.event.inputs.head_threshold || '100000' }}
          COUNTRIES_INPUT: ${{ github.event.inputs.countries || '' }}
        run: |
          ARGS=(
            --version "$BUILD_VERSION"
            --overture-release "$OVERTURE_RELEASE"
            --head-threshold "$HEAD_THRESHOLD"
          )
          if [ -n "$COUNTRIES_INPUT" ]; then
            ARGS+=(--countries "$COUNTRIES_INPUT")
          fi
          python scripts/build_shards.py "${ARGS[@]}"
          mv "shards/${BUILD_VERSION}/build-meta.json" \
            "shards/${BUILD_VERSION}/forward-build-meta.json"

      - name: Build reverse geocoding shards
        if: github.event.inputs.build_type != 'forward'
        env:
          BUILD_VERSION: ${{ needs.prep.outputs.version }}
          OVERTURE_RELEASE: ${{ needs.prep.outputs.release }}
          HEAD_THRESHOLD: ${{ github.event.inputs.head_threshold || '100000' }}
          COUNTRIES_INPUT: ${{ github.event.inputs.countries || '' }}
        run: |
          ARGS=(
            --reverse
            --version "$BUILD_VERSION"
            --overture-release "$OVERTURE_RELEASE"
            --head-threshold "$HEAD_THRESHOLD"
          )
          if [ -n "$COUNTRIES_INPUT" ]; then
            ARGS+=(--countries "$COUNTRIES_INPUT")
          fi
          python scripts/build_shards.py "${ARGS[@]}"
          mv "shards/${BUILD_VERSION}/build-meta.json" \
            "shards/${BUILD_VERSION}/reverse-build-meta.json"

      # This job only writes immutable versioned objects. The root catalog is
      # owned exclusively by finalize-release after every family succeeds.
      - name: Upload forward shards to R2
        if: github.event.inputs.build_type != 'reverse'
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          PROGRESS_DIR=$(mktemp -d)
          ERRORS_DIR=$(mktemp -d)

          # Count total database files
          TOTAL_DB=$(find "shards/${VERSION}/shards" -name "*.db" | wc -l)
          echo "Uploading ${TOTAL_DB} forward shard databases..."

          # Upload function with retry and progress tracking
          upload_file() {
            local file="$1"
            local version="$2"
            local subdir="$3"
            local progress_dir="$4"
            local errors_dir="$5"
            local filename=$(basename "$file")
            local r2_path="${version}/${subdir}/${filename}"
            local attempt output

            for attempt in 1 2 3; do
              if output=$(wrangler r2 object put "geocoder-shards/${r2_path}" --file "$file" --remote 2>&1); then
                # Check for accidental local storage (retrying won't help)
                if echo "$output" | grep -q "Resource location: local"; then
                  echo "ERROR: $filename uploaded to LOCAL not REMOTE" > "${errors_dir}/${filename}.log"
                else
                  rm -f "${errors_dir}/${filename}.log"
                fi
                touch "${progress_dir}/${filename}"
                return 0
              fi
              echo "$output" > "${errors_dir}/${filename}.log"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done
            touch "${progress_dir}/${filename}"
          }
          export -f upload_file
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID

          # Upload databases with progress (16 parallel — network-bound)
          find "shards/${VERSION}/shards" -name "*.db" | \
            xargs -P 16 -I {} bash -c "upload_file '{}' '${VERSION}' 'shards' '${PROGRESS_DIR}' '${ERRORS_DIR}'" &
          UPLOAD_PID=$!

          # Show progress while the uploader is alive (bounded: exits with
          # the background pid instead of spinning until the job timeout)
          while kill -0 "$UPLOAD_PID" 2>/dev/null; do
            DONE=$(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l)
            printf "\r  Progress: %d/%d databases" "$DONE" "$TOTAL_DB"
            sleep 5
          done
          wait "$UPLOAD_PID" || true
          DONE=$(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l)
          printf "\r  Progress: %d/%d databases\n" "$DONE" "$TOTAL_DB"

          # Check for errors
          if [ "$(ls -A $ERRORS_DIR 2>/dev/null)" ]; then
            echo "::error::Some uploads failed:"
            cat "$ERRORS_DIR"/*.log
            exit 1
          fi
          if [ "$DONE" -lt "$TOTAL_DB" ]; then
            echo "::error::Upload incomplete: ${DONE}/${TOTAL_DB} databases uploaded"
            exit 1
          fi

          # The collection advertises router.db, so publish and verify that
          # data object before collection.json can make the version visible.
          ROUTER="shards/${VERSION}/router.db"
          test -f "$ROUTER"
          jq -e '.router.href == "./router.db"' \
            "shards/${VERSION}/collection.json" >/dev/null
          echo "Uploading ${VERSION}/router.db..."
          for attempt in 1 2 3; do
            if wrangler r2 object put "geocoder-shards/${VERSION}/router.db" \
              --file "$ROUTER" --remote; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to upload router.db after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

          echo "Uploading ${VERSION}/forward-build-meta.json..."
          for attempt in 1 2 3; do
            if wrangler r2 object put "geocoder-shards/${VERSION}/forward-build-meta.json" \
              --file "shards/${VERSION}/forward-build-meta.json" --remote; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to upload forward-build-meta.json after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

          # Every referenced data object is now in place; publish metadata.
          echo "Uploading ${VERSION}/collection.json..."
          for attempt in 1 2 3; do
            if wrangler r2 object put "geocoder-shards/${VERSION}/collection.json" \
              --file "shards/${VERSION}/collection.json" --remote; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to upload collection.json after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

          rm -rf "$PROGRESS_DIR" "$ERRORS_DIR"

      - name: Upload reverse shards to R2
        if: github.event.inputs.build_type != 'forward'
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          PROGRESS_DIR=$(mktemp -d)
          ERRORS_DIR=$(mktemp -d)

          # Count total database files
          TOTAL_DB=$(find "shards/${VERSION}/reverse" -name "*.db" | wc -l)
          echo "Uploading ${TOTAL_DB} reverse shard databases..."

          upload_file() {
            local file="$1"
            local version="$2"
            local subdir="$3"
            local progress_dir="$4"
            local errors_dir="$5"
            local filename=$(basename "$file")
            local r2_path="${version}/${subdir}/${filename}"
            local attempt output

            for attempt in 1 2 3; do
              if output=$(wrangler r2 object put "geocoder-shards/${r2_path}" --file "$file" --remote 2>&1); then
                if echo "$output" | grep -q "Resource location: local"; then
                  echo "ERROR: $filename uploaded to LOCAL not REMOTE" > "${errors_dir}/${filename}.log"
                else
                  rm -f "${errors_dir}/${filename}.log"
                fi
                touch "${progress_dir}/${filename}"
                return 0
              fi
              echo "$output" > "${errors_dir}/${filename}.log"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done
            touch "${progress_dir}/${filename}"
          }
          export -f upload_file
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID

          find "shards/${VERSION}/reverse" -name "*.db" | \
            xargs -P 16 -I {} bash -c "upload_file '{}' '${VERSION}' 'reverse' '${PROGRESS_DIR}' '${ERRORS_DIR}'" &
          UPLOAD_PID=$!

          while kill -0 "$UPLOAD_PID" 2>/dev/null; do
            DONE=$(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l)
            printf "\r  Progress: %d/%d databases" "$DONE" "$TOTAL_DB"
            sleep 5
          done
          wait "$UPLOAD_PID" || true
          DONE=$(find "$PROGRESS_DIR" -type f 2>/dev/null | wc -l)
          printf "\r  Progress: %d/%d databases\n" "$DONE" "$TOTAL_DB"

          if [ "$(ls -A $ERRORS_DIR 2>/dev/null)" ]; then
            echo "::error::Some uploads failed:"
            cat "$ERRORS_DIR"/*.log
            exit 1
          fi
          if [ "$DONE" -lt "$TOTAL_DB" ]; then
            echo "::error::Upload incomplete: ${DONE}/${TOTAL_DB} databases uploaded"
            exit 1
          fi

          # Shards are in place; now upload collection metadata (with retry)
          echo "Uploading ${VERSION}/reverse-build-meta.json..."
          for attempt in 1 2 3; do
            if wrangler r2 object put "geocoder-shards/${VERSION}/reverse-build-meta.json" \
              --file "shards/${VERSION}/reverse-build-meta.json" --remote; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to upload reverse-build-meta.json after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

          echo "Uploading ${VERSION}/reverse-collection.json..."
          for attempt in 1 2 3; do
            if wrangler r2 object put "geocoder-shards/${VERSION}/reverse-collection.json" \
              --file "shards/${VERSION}/reverse-collection.json" --remote; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to upload reverse-collection.json after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

          rm -rf "$PROGRESS_DIR" "$ERRORS_DIR"

      - name: Verify R2 uploads
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'both' }}"
          FAILED=0

          echo "Verifying R2 uploads for version ${VERSION}..."

          if [ "$BUILD_TYPE" = "forward" ] || [ "$BUILD_TYPE" = "both" ]; then
            if wrangler r2 object get "geocoder-shards/${VERSION}/collection.json" --remote --pipe > /dev/null 2>&1; then
              echo "  ok: ${VERSION}/collection.json"
            else
              echo "::error::${VERSION}/collection.json NOT FOUND in R2 after upload"
              FAILED=1
            fi

            # Spot-check HEAD shard
            if wrangler r2 object get "geocoder-shards/${VERSION}/shards/HEAD.db" --remote --pipe > /dev/null 2>&1; then
              echo "  ok: ${VERSION}/shards/HEAD.db"
            else
              echo "::error::${VERSION}/shards/HEAD.db NOT FOUND in R2 after upload"
              FAILED=1
            fi

            ROUTER_READBACK_DIR=$(mktemp -d)
            ROUTER_READBACK="${ROUTER_READBACK_DIR}/router.db"
            if wrangler r2 object get "geocoder-shards/${VERSION}/router.db" \
              --remote --file "$ROUTER_READBACK"; then
              EXPECTED_SIZE=$(jq -er '.router.size_bytes' "shards/${VERSION}/collection.json")
              EXPECTED_SHA=$(jq -er '.router.sha256' "shards/${VERSION}/collection.json")
              ACTUAL_SIZE=$(stat -c %s "$ROUTER_READBACK")
              ACTUAL_SHA=$(sha256sum "$ROUTER_READBACK" | cut -d' ' -f1)
              if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ] || [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
                echo "::error::${VERSION}/router.db size/SHA readback mismatch"
                FAILED=1
              else
                echo "  ok: ${VERSION}/router.db (${ACTUAL_SIZE} bytes, SHA verified)"
              fi
            else
              echo "::error::${VERSION}/router.db NOT FOUND in R2 after upload"
              FAILED=1
            fi
          fi

          if [ "$BUILD_TYPE" = "reverse" ] || [ "$BUILD_TYPE" = "both" ]; then
            if wrangler r2 object get "geocoder-shards/${VERSION}/reverse-collection.json" --remote --pipe > /dev/null 2>&1; then
              echo "  ok: ${VERSION}/reverse-collection.json"
            else
              echo "::error::${VERSION}/reverse-collection.json NOT FOUND in R2 after upload"
              FAILED=1
            fi

            # Spot-check reverse HEAD shard
            if wrangler r2 object get "geocoder-shards/${VERSION}/reverse/HEAD.db" --remote --pipe > /dev/null 2>&1; then
              echo "  ok: ${VERSION}/reverse/HEAD.db"
            else
              echo "::error::${VERSION}/reverse/HEAD.db NOT FOUND in R2 after upload"
              FAILED=1
            fi
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::R2 verification failed - uploads may not have persisted"
            exit 1
          fi
          echo "All R2 verification checks passed."

      # This job never mutates catalog.json. A failed or partial build remains
      # invisible until the complete-release finalizer validates every family.
      - name: Summary
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'both' }}"

          echo "## Immutable Forward/Reverse Artifacts Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Overture release:** ${{ needs.prep.outputs.release }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build type:** ${BUILD_TYPE}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$BUILD_TYPE" = "forward" ] || [ "$BUILD_TYPE" = "both" ]; then
            echo "### Forward Geocoding Shards" >> $GITHUB_STEP_SUMMARY
            echo "**Count:** $(ls -1 shards/${VERSION}/shards/*.db 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** $(du -sh shards/${VERSION}/shards/ 2>/dev/null | cut -f1 || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$BUILD_TYPE" = "reverse" ] || [ "$BUILD_TYPE" = "both" ]; then
            echo "### Reverse Geocoding Shards" >> $GITHUB_STEP_SUMMARY
            echo "**Count:** $(ls -1 shards/${VERSION}/reverse/*.db 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** $(du -sh shards/${VERSION}/reverse/ 2>/dev/null | cut -f1 || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          fi

  id-stage:
    runs-on: ubuntu-24.04-arm
    needs: prep
    if: github.event_name == 'schedule' || github.event.inputs.build_id_index != 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            phase: stage-base
            extra_args: ""
          - name: registry-000-3ff
            phase: stage-registry
            extra_args: "--prefix-start 000 --prefix-end 3ff"
          - name: registry-400-7ff
            phase: stage-registry
            extra_args: "--prefix-start 400 --prefix-end 7ff"
          - name: registry-800-bff
            phase: stage-registry
            extra_args: "--prefix-start 800 --prefix-end bff"
          - name: registry-c00-fff
            phase: stage-registry
            extra_args: "--prefix-start c00 --prefix-end fff"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Verify R2 credentials
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2 S3 API credentials not configured"
            exit 1
          fi
          echo "R2 credentials configured"

      - name: "Stage: ${{ matrix.name }}"
        run: |
          python -u scripts/build_id_index.py \
            --phase ${{ matrix.phase }} --prefix-len 3 --workers 8 \
            --version ${{ needs.prep.outputs.version }} \
            --release ${{ needs.prep.outputs.release }} \
            ${{ matrix.extra_args }}

  # One global, deterministic dictionary must be published before the four
  # parallel build ranges assign compact IDs. No range may derive IDs alone.
  id-dictionary:
    runs-on: ubuntu-24.04-arm
    needs: [prep, id-stage]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build global ID locator dictionary
        run: |
          python -u scripts/build_id_index.py \
            --phase dictionaries --prefix-len 3 \
            --version ${{ needs.prep.outputs.version }} \
            --release ${{ needs.prep.outputs.release }}

  id-build:
    runs-on: ubuntu-24.04-arm
    needs: [prep, id-dictionary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix_start: "000"
            prefix_end: "3ff"
          - prefix_start: "400"
            prefix_end: "7ff"
          - prefix_start: "800"
            prefix_end: "bff"
          - prefix_start: "c00"
            prefix_end: "fff"
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Monitor resources
        run: |
          echo "=== Initial disk space ==="
          df -h / /tmp
          (while true; do
            echo "--- $(date -u +%H:%M:%S) ---"
            free -m | grep Mem | awk '{printf "Memory: %dMB used / %dMB total (%.0f%%)\n", $3, $2, $3/$2*100}'
            df -h / | tail -1 | awk '{printf "Disk: %s used / %s total (%s)\n", $3, $2, $5}'
            echo "Processes: $(ps aux | wc -l)"
            sleep 30
          done) &

      - name: "Build: ${{ matrix.prefix_start }}-${{ matrix.prefix_end }}"
        run: |
          python -u scripts/build_id_index.py \
            --phase build --prefix-len 3 --workers 8 \
            --version ${{ needs.prep.outputs.version }} \
            --release ${{ needs.prep.outputs.release }} \
            --prefix-start ${{ matrix.prefix_start }} \
            --prefix-end ${{ matrix.prefix_end }}

  id-post:
    runs-on: ubuntu-24.04-arm
    needs: [prep, id-build]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build ID metadata
        run: |
          python -u scripts/build_id_index.py \
            --phase metadata --prefix-len 3 \
            --version ${{ needs.prep.outputs.version }} \
            --release ${{ needs.prep.outputs.release }}

      - name: Verify R2 uploads
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          echo "Verifying version: ${VERSION}"

          if wrangler r2 object get "geocoder-shards/${VERSION}/id-collection.json" --remote --pipe > /dev/null 2>&1; then
            echo "  ok: ${VERSION}/id-collection.json"
          else
            echo "::error::${VERSION}/id-collection.json NOT FOUND in R2"
            exit 1
          fi

          FAILED=0
          for PREFIX in 000 400 800 c00 fff; do
            if wrangler r2 object get "geocoder-shards/${VERSION}/id-index/${PREFIX}.parquet" --remote --pipe > /dev/null 2>&1; then
              echo "  ok: ${VERSION}/id-index/${PREFIX}.parquet"
            else
              echo "::error::${VERSION}/id-index/${PREFIX}.parquet NOT FOUND in R2"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "R2 verification passed."

      # Staging data is several GB per version and is never read again once
      # the build is verified; delete it via paginated S3 batch deletes.
      - name: Cleanup staging data
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "Deleting ${VERSION}/staging/ from R2..."
          aws s3 rm "s3://geocoder-shards/${VERSION}/staging/" --recursive \
            --endpoint-url "$ENDPOINT" --region auto --only-show-errors
          echo "Staging data deleted."

      - name: Summary
        if: always()
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          echo "## ID Index Rebuild" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Overture release:** ${{ needs.prep.outputs.release }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

  # The only job allowed to create a release manifest or mutate catalog.json.
  # It waits for every production family, so the discovery pointer can never
  # expose a version whose reverse or ID artifacts are still building.
  finalize-release:
    runs-on: ubuntu-24.04-arm
    needs: [prep, rebuild-shards, id-post]
    if: >-
      always() &&
      needs.prep.outputs.complete == 'true' &&
      needs.rebuild-shards.result == 'success' &&
      needs.id-post.result == 'success'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Read back and verify the exact complete release
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          RELEASE="${{ needs.prep.outputs.release }}"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          mkdir -p /tmp/rebuild-finalize/metadata /tmp/rebuild-finalize/readback

          # Retain the exact pre-promotion pointer for rollback before reading
          # any candidate metadata. A missing/transient catalog is fatal.
          ./scripts/r2_catalog_fetch.sh /tmp/rebuild-finalize/catalog-before.json
          test -s /tmp/rebuild-finalize/catalog-before.json

          # JSON metadata and dictionaries are small. Forward/reverse SQLite
          # fleets total under 100 MB, so read every object back and verify its
          # collection SHA rather than relying on upload success or spot checks.
          aws s3 sync "s3://geocoder-shards/${VERSION}/" \
            /tmp/rebuild-finalize/metadata \
            --exclude "*" --include "*.json" \
            --endpoint-url "$ENDPOINT" --region auto --only-show-errors
          aws s3 sync "s3://geocoder-shards/${VERSION}/shards/" \
            /tmp/rebuild-finalize/readback/shards \
            --endpoint-url "$ENDPOINT" --region auto --only-show-errors
          aws s3 sync "s3://geocoder-shards/${VERSION}/reverse/" \
            /tmp/rebuild-finalize/readback/reverse \
            --endpoint-url "$ENDPOINT" --region auto --only-show-errors
          aws s3 cp "s3://geocoder-shards/${VERSION}/router.db" \
            /tmp/rebuild-finalize/readback/router.db \
            --endpoint-url "$ENDPOINT" --region auto --only-show-errors

          # AWS CLI paginates the full prefix. The manifest records exact key,
          # byte-size, and R2 ETag for all 4,000+ objects; ID Parquet schema and
          # footer invariants were already checked for every shard by id-post.
          aws s3api list-objects-v2 \
            --bucket geocoder-shards --prefix "${VERSION}/" \
            --endpoint-url "$ENDPOINT" --region auto --output json \
            > /tmp/rebuild-finalize/inventory.json

          python scripts/finalize_rebuild.py verify \
            --version "$VERSION" --release "$RELEASE" \
            --inventory /tmp/rebuild-finalize/inventory.json \
            --metadata-dir /tmp/rebuild-finalize/metadata \
            --readback-dir /tmp/rebuild-finalize/readback \
            --output /tmp/rebuild-finalize/release-manifest.json

          python scripts/finalize_rebuild.py catalog \
            --before /tmp/rebuild-finalize/catalog-before.json \
            --version "$VERSION" \
            --output /tmp/rebuild-finalize/catalog-next.json

      - name: Publish immutable release manifest
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws s3 cp /tmp/rebuild-finalize/release-manifest.json \
            "s3://geocoder-shards/${VERSION}/release-manifest.json" \
            --endpoint-url "$ENDPOINT" --region auto \
            --content-type application/json --only-show-errors
          aws s3 cp "s3://geocoder-shards/${VERSION}/release-manifest.json" \
            /tmp/rebuild-finalize/release-manifest-readback.json \
            --endpoint-url "$ENDPOINT" --region auto --only-show-errors
          cmp /tmp/rebuild-finalize/release-manifest.json \
            /tmp/rebuild-finalize/release-manifest-readback.json

      - name: Atomically promote and smoke production
        if: needs.prep.outputs.promote == 'true'
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BASE_URL="https://geocoder.bradr.dev"

          publish_catalog() {
            local source="$1"
            local attempt
            for attempt in 1 2 3; do
              if aws s3 cp "$source" "s3://geocoder-shards/catalog.json" \
                --endpoint-url "$ENDPOINT" --region auto \
                --content-type application/json --only-show-errors; then
                return 0
              fi
              sleep $((attempt * 10))
            done
            echo "::error::Failed to publish catalog from ${source} after 3 attempts"
            return 1
          }

          smoke_once() {
            local expected_version="$1"
            local health search reverse gers_id id_json
            health=$(curl -fsS --max-time 20 "${BASE_URL}/health?rebuild=${expected_version}") || return 1
            echo "$health" | jq -e --arg v "$expected_version" \
              '.status == "ok" and .version == $v' >/dev/null || return 1

            search=$(curl -fsS --max-time 20 \
              "${BASE_URL}/search?q=boston&limit=1&rebuild=${expected_version}") || return 1
            echo "$search" | jq -e --arg v "$expected_version" \
              '.data_version == $v and (.results | length) > 0' >/dev/null || return 1
            gers_id=$(echo "$search" | jq -er '.results[0].gers_id') || return 1

            reverse=$(curl -fsS --max-time 20 \
              "${BASE_URL}/reverse?lat=42.36&lon=-71.06&rebuild=${expected_version}") || return 1
            echo "$reverse" | jq -e --arg v "$expected_version" \
              '.data_version == $v and (.gers_id | type == "string")' >/dev/null || return 1

            id_json=$(curl -fsS --max-time 30 "${BASE_URL}/id/${gers_id}?rebuild=${expected_version}") || return 1
            echo "$id_json" | jq -e --arg v "$expected_version" --arg id "$gers_id" \
              '.data_version == $v and .id == $id' >/dev/null || return 1
          }

          rollback_candidate() {
            echo "::error::Restoring the exact previous catalog after failed promotion"
            ./scripts/r2_catalog_fetch.sh /tmp/rebuild-finalize/catalog-live.json || return 1
            if ! cmp /tmp/rebuild-finalize/catalog-next.json \
              /tmp/rebuild-finalize/catalog-live.json; then
              echo "::error::Live catalog no longer equals this candidate; refusing rollback clobber"
              return 1
            fi
            publish_catalog /tmp/rebuild-finalize/catalog-before.json || return 1
            ./scripts/r2_catalog_fetch.sh \
              /tmp/rebuild-finalize/catalog-rollback-readback.json || return 1
            cmp /tmp/rebuild-finalize/catalog-before.json \
              /tmp/rebuild-finalize/catalog-rollback-readback.json || return 1

            # Worker isolates cache catalog.json for up to 300 seconds. Confirm
            # the prior version is served again before claiming rollback.
            for attempt in $(seq 1 14); do
              echo "Rollback smoke attempt ${attempt}/14..."
              if smoke_once "$PREVIOUS_VERSION"; then
                echo "Rollback confirmed: production serves ${PREVIOUS_VERSION}."
                return 0
              fi
              sleep 30
            done
            echo "::error::R2 rolled back but production did not confirm ${PREVIOUS_VERSION}"
            return 1
          }

          rollback_on_exit() {
            local status=$?
            trap - EXIT INT TERM
            if [ "$PUBLISHED" = "true" ]; then
              set +e
              rollback_candidate
              local rollback_status=$?
              set -e
              if [ "$rollback_status" -ne 0 ]; then
                echo "::error::Automatic catalog rollback needs operator attention"
              fi
            fi
            exit "$status"
          }

          # Do not overwrite a catalog changed by another maintenance workflow
          # while this finalizer was reading and hashing the candidate fleet.
          ./scripts/r2_catalog_fetch.sh /tmp/rebuild-finalize/catalog-prepublish.json
          test -s /tmp/rebuild-finalize/catalog-prepublish.json
          if ! cmp /tmp/rebuild-finalize/catalog-before.json \
            /tmp/rebuild-finalize/catalog-prepublish.json; then
            echo "::error::catalog.json changed during finalization; refusing to clobber it"
            exit 1
          fi

          PREVIOUS_VERSION=$(jq -er \
            '[.links[] | select(.rel == "child" and .latest == true)][0].href
             | ltrimstr("./") | split("/")[0]' \
            /tmp/rebuild-finalize/catalog-before.json)

          # Keep a durable operator-recovery copy outside the immutable release
          # prefix. The trap handles normal failures; this survives runner loss.
          aws s3 cp /tmp/rebuild-finalize/catalog-before.json \
            "s3://geocoder-shards/backups/catalog-before-${VERSION}.json" \
            --endpoint-url "$ENDPOINT" --region auto \
            --content-type application/json --only-show-errors
          aws s3 cp "s3://geocoder-shards/backups/catalog-before-${VERSION}.json" \
            /tmp/rebuild-finalize/catalog-backup-readback.json \
            --endpoint-url "$ENDPOINT" --region auto --only-show-errors
          cmp /tmp/rebuild-finalize/catalog-before.json \
            /tmp/rebuild-finalize/catalog-backup-readback.json
          aws s3 cp /tmp/rebuild-finalize/catalog-next.json \
            "s3://geocoder-shards/backups/catalog-candidate-${VERSION}.json" \
            --endpoint-url "$ENDPOINT" --region auto \
            --content-type application/json --only-show-errors
          aws s3 cp "s3://geocoder-shards/backups/catalog-candidate-${VERSION}.json" \
            /tmp/rebuild-finalize/catalog-candidate-backup-readback.json \
            --endpoint-url "$ENDPOINT" --region auto --only-show-errors
          cmp /tmp/rebuild-finalize/catalog-next.json \
            /tmp/rebuild-finalize/catalog-candidate-backup-readback.json

          echo "Publishing catalog.json once after all family verification..."
          PUBLISHED=false
          trap rollback_on_exit EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # Treat publication as possibly successful before invoking the CLI:
          # a connection can fail after R2 accepted the write.
          PUBLISHED=true
          publish_catalog /tmp/rebuild-finalize/catalog-next.json

          PASSED=false
          for attempt in $(seq 1 14); do
            echo "Production smoke attempt ${attempt}/14..."
            if smoke_once "$VERSION"; then
              PASSED=true
              break
            fi
            sleep 30
          done

          if [ "$PASSED" != "true" ]; then
            echo "::error::Production smoke failed"
            exit 1
          fi

          PUBLISHED=false
          trap - EXIT INT TERM
          echo "Production health, search, reverse, and ID all serve ${VERSION}."

  # EXIT traps cannot run after a hard runner loss. This independent job uses
  # the durable before/candidate pair and the same compare-before-swap rule.
  post-finalize:
    runs-on: ubuntu-24.04-arm
    needs: [prep, finalize-release]
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Recover an interrupted catalog promotion
        if: >-
          needs.prep.outputs.promote == 'true' &&
          needs.finalize-release.result != 'success'
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BASE_URL="https://geocoder.bradr.dev"

          COUNT=$(aws s3api list-objects-v2 \
            --bucket geocoder-shards \
            --prefix "backups/catalog-candidate-${VERSION}.json" \
            --max-keys 1 --query 'KeyCount' --output text \
            --endpoint-url "$ENDPOINT" --region auto)
          if [ "$COUNT" = "0" ]; then
            echo "Promotion never reached durable candidate publication; nothing to recover."
            exit 0
          fi

          aws s3 cp "s3://geocoder-shards/backups/catalog-before-${VERSION}.json" \
            /tmp/catalog-before.json --endpoint-url "$ENDPOINT" \
            --region auto --only-show-errors
          aws s3 cp "s3://geocoder-shards/backups/catalog-candidate-${VERSION}.json" \
            /tmp/catalog-candidate.json --endpoint-url "$ENDPOINT" \
            --region auto --only-show-errors
          ./scripts/r2_catalog_fetch.sh /tmp/catalog-live.json

          if cmp /tmp/catalog-before.json /tmp/catalog-live.json; then
            echo "Previous catalog is already restored."
          elif cmp /tmp/catalog-candidate.json /tmp/catalog-live.json; then
            aws s3 cp /tmp/catalog-before.json \
              "s3://geocoder-shards/catalog.json" \
              --endpoint-url "$ENDPOINT" --region auto \
              --content-type application/json --only-show-errors
            ./scripts/r2_catalog_fetch.sh /tmp/catalog-restored.json
            cmp /tmp/catalog-before.json /tmp/catalog-restored.json
          else
            echo "::error::Live catalog is neither the interrupted candidate nor its predecessor; refusing to clobber it"
            exit 1
          fi

          PREVIOUS_VERSION=$(jq -er \
            '[.links[] | select(.rel == "child" and .latest == true)][0].href
             | ltrimstr("./") | split("/")[0]' /tmp/catalog-before.json)
          for attempt in $(seq 1 14); do
            HEALTH=$(curl -fsS --max-time 20 \
              "${BASE_URL}/health?recovery=${VERSION}-${attempt}") || true
            if echo "$HEALTH" | jq -e --arg version "$PREVIOUS_VERSION" \
              '.status == "ok" and .version == $version' >/dev/null; then
              echo "Recovery confirmed: production serves ${PREVIOUS_VERSION}."
              exit 0
            fi
            sleep 30
          done
          echo "::error::Catalog restored in R2 but cached production did not recover"
          exit 1

      - name: Prune only after successful promotion and smoke
        if: >-
          needs.finalize-release.result == 'success' &&
          needs.prep.outputs.promote == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.cleanup_old_versions == 'true'
        run: |
          KEEP_VERSIONS=3
          CURRENT="${{ needs.prep.outputs.version }}"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          ./scripts/r2_catalog_fetch.sh /tmp/rebuild-finalize/catalog-promoted.json
          test -s /tmp/rebuild-finalize/catalog-promoted.json
          python3 - "$KEEP_VERSIONS" "$CURRENT" <<'PY'
          import json
          import re
          import sys

          keep_count = int(sys.argv[1])
          current = sys.argv[2]
          path = "/tmp/rebuild-finalize/catalog-promoted.json"
          with open(path) as src:
              catalog = json.load(src)
          version_re = re.compile(r"^\d{4}-\d{2}-\d{2}\.\d+$")
          children = []
          static = []
          for link in catalog.get("links", []):
              if link.get("rel") != "child":
                  static.append(link)
                  continue
              version = link["href"].strip("./").split("/", 1)[0]
              if not version_re.fullmatch(version):
                  raise RuntimeError(f"invalid catalog version {version!r}")
              date, suffix = version.rsplit(".", 1)
              key = tuple(map(int, date.split("-"))) + (int(suffix),)
              children.append((key, version, link))
          children.sort(reverse=True)
          if not children or children[0][1] != current:
              raise RuntimeError("current build is not catalog latest")
          if len(children) < keep_count:
              raise RuntimeError("refusing to prune below retention floor")
          kept = children[:keep_count]
          dropped = children[keep_count:]
          catalog["links"] = static + [link for _, _, link in kept]
          with open("/tmp/rebuild-finalize/catalog-pruned.json", "w") as dst:
              json.dump(catalog, dst, indent=2)
              dst.write("\n")
          with open("/tmp/rebuild-finalize/prune-versions.txt", "w") as dst:
              for _, version, _ in dropped:
                  dst.write(version + "\n")
          PY

          if [ ! -s /tmp/rebuild-finalize/prune-versions.txt ]; then
            echo "Nothing to prune."
            exit 0
          fi

          # Remove discovery links first; a deletion failure then leaves only
          # unreachable extra objects, never dangling catalog references.
          aws s3 cp /tmp/rebuild-finalize/catalog-pruned.json \
            "s3://geocoder-shards/catalog.json" \
            --endpoint-url "$ENDPOINT" --region auto \
            --content-type application/json --only-show-errors
          while read -r VERSION; do
            test "$VERSION" != "$CURRENT"
            echo "Deleting retired version ${VERSION}/"
            aws s3 rm "s3://geocoder-shards/${VERSION}/" --recursive \
              --endpoint-url "$ENDPOINT" --region auto --only-show-errors
          done < /tmp/rebuild-finalize/prune-versions.txt

      - name: Summary
        if: always()
        run: |
          echo "## Atomic release finalizer" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ needs.prep.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Overture release:** ${{ needs.prep.outputs.release }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Promoted:** ${{ needs.prep.outputs.promote }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Retention requested:** ${{ github.event.inputs.cleanup_old_versions || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
