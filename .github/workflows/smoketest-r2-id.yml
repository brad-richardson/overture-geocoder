name: Smoke Test R2 ID Index

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_id_index.py'
      - 'scripts/prepare_id_smoke_preview.py'
      - 'scripts/stac.py'
      - 'crates/geocoder-core/**'
      - 'crates/geocoder-worker/**'
      - '.github/workflows/rebuild-r2-shards.yml'
      - '.github/workflows/smoketest-r2-id.yml'
  workflow_dispatch:

# This smoke uses a fixed, ID-family-only R2 prefix. Cancel an older ID run
# before its replacement starts so marker-resumable phases and cleanup cannot
# overlap. The shard smoke has a different prefix and concurrency group.
concurrency:
  group: smoketest-r2-id
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  # Fixed family-specific prefix (never collides with real date-based versions)
  SMOKE_VERSION: smoketest-id

jobs:
  smoketest:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install -g wrangler@4.118.0

      - name: Setup Rust for preview Worker
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install preview Worker build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang
          # Pinned: worker-build 0.8 refuses `worker = "0.7"` (#243).
          cargo install worker-build --version '^0.7' --locked

      # Stale staging markers under the fixed prefix would make these
      # resumable phases silently skip, turning the smoke into a no-op.
      - name: Pre-clean stale smoketest data
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          aws s3 rm "s3://geocoder-shards/${SMOKE_VERSION}/" --recursive \
            --only-show-errors \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto
          REMAINING=$(aws s3api list-objects-v2 \
            --bucket geocoder-shards \
            --prefix "${SMOKE_VERSION}/" \
            --max-keys 1 \
            --query 'KeyCount' \
            --output text \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto)
          if [ "$REMAINING" != "0" ]; then
            echo "::error::Pre-clean left objects under ${SMOKE_VERSION}/"
            exit 1
          fi

      - name: Discover Overture release once
        run: |
          RELEASE=$(python3 scripts/stac.py | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+' | head -1)
          if [ -z "$RELEASE" ]; then
            echo "::error::Failed to discover latest Overture release from STAC"
            exit 1
          fi
          echo "OVERTURE_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "Overture release: $RELEASE"

      - name: Stage registry (smoke test)
        run: |
          python scripts/build_id_index.py \
            --phase stage-registry \
            --version $SMOKE_VERSION \
            --release "$OVERTURE_RELEASE" \
            --prefix-len 3 \
            --smoke-test \
            --workers 2

      - name: Stage base (smoke test)
        run: |
          python scripts/build_id_index.py \
            --phase stage-base \
            --version $SMOKE_VERSION \
            --release "$OVERTURE_RELEASE" \
            --prefix-len 3 \
            --smoke-test \
            --workers 2

      - name: Build ID locator dictionary (smoke test)
        run: |
          python scripts/build_id_index.py \
            --phase dictionaries \
            --version $SMOKE_VERSION \
            --release "$OVERTURE_RELEASE" \
            --prefix-len 3 \
            --smoke-test

      - name: Build ID shards (smoke test)
        run: |
          python scripts/build_id_index.py \
            --phase build \
            --version $SMOKE_VERSION \
            --release "$OVERTURE_RELEASE" \
            --prefix-len 3 \
            --smoke-test \
            --workers 2

      - name: Build ID metadata (smoke test)
        run: |
          python scripts/build_id_index.py \
            --phase metadata \
            --version $SMOKE_VERSION \
            --release "$OVERTURE_RELEASE" \
            --prefix-len 3 \
            --smoke-test

      - name: Prepare isolated preview catalog and v3 cases
        run: |
          python scripts/prepare_id_smoke_preview.py \
            --version "$SMOKE_VERSION" \
            --release "$OVERTURE_RELEASE" \
            --output-dir /tmp/id-smoke-preview
          echo "Current case: $(jq -r '.current.id' /tmp/id-smoke-preview/id-smoke-cases.json)"
          echo "Historical case: $(jq -r '.historical.id' /tmp/id-smoke-preview/id-smoke-cases.json)"

      - name: Upload isolated preview catalog
        run: |
          wrangler r2 object put \
            "geocoder-shards/${SMOKE_VERSION}/catalog.json" \
            --file /tmp/id-smoke-preview/catalog.json --remote

      - name: Verify ID index uploads
        run: |
          if wrangler r2 object get "geocoder-shards/${SMOKE_VERSION}/id-collection.json" --remote --pipe > /dev/null 2>&1; then
            echo "  ok: ${SMOKE_VERSION}/id-collection.json"
          else
            echo "::error::${SMOKE_VERSION}/id-collection.json NOT FOUND"
            exit 1
          fi
          if wrangler r2 object get "geocoder-shards/${SMOKE_VERSION}/catalog.json" --remote --pipe > /dev/null 2>&1; then
            echo "  ok: ${SMOKE_VERSION}/catalog.json"
          else
            echo "::error::${SMOKE_VERSION}/catalog.json NOT FOUND"
            exit 1
          fi
          echo "ID index verification passed."

      - name: Deploy isolated ID preview Worker
        working-directory: crates/geocoder-worker
        run: |
          DEPLOY_LOG=$(mktemp)
          if ! wrangler deploy --config wrangler.id-smoke.toml \
            2>&1 | tee "$DEPLOY_LOG"; then
            echo "::error::Failed to deploy isolated ID smoke Worker"
            exit 1
          fi
          PREVIEW_URL=$(grep -oE 'https://[^[:space:]]+\.workers\.dev' "$DEPLOY_LOG" | tail -1)
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::Wrangler output did not contain the preview Worker URL"
            exit 1
          fi
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Preview Worker: $PREVIEW_URL"

      - name: Query current and historical v3 IDs through preview Worker
        run: |
          CURRENT_ID=$(jq -er '.current.id' /tmp/id-smoke-preview/id-smoke-cases.json)
          HISTORICAL_ID=$(jq -er '.historical.id' /tmp/id-smoke-preview/id-smoke-cases.json)
          HISTORICAL_RELEASE=$(jq -er '.historical.expected_last_seen_release' /tmp/id-smoke-preview/id-smoke-cases.json)
          CURRENT_FEATURE_TYPE=$(jq -er '.current.expected_feature_type' /tmp/id-smoke-preview/id-smoke-cases.json)
          CURRENT_THEME=$(jq -er '.current.expected_theme' /tmp/id-smoke-preview/id-smoke-cases.json)
          CURRENT_FILENAME=$(jq -er '.current.expected_filename' /tmp/id-smoke-preview/id-smoke-cases.json)
          CURRENT_OVERTURE_PATH=$(jq -er '.current.expected_overture_path' /tmp/id-smoke-preview/id-smoke-cases.json)
          CURRENT_REGISTRY_MEMBER=$(jq -r '.current.expected_registry_member' /tmp/id-smoke-preview/id-smoke-cases.json)
          if [ "$CURRENT_REGISTRY_MEMBER" != "true" ] && [ "$CURRENT_REGISTRY_MEMBER" != "false" ]; then
            echo "::error::Current smoke case has no boolean registry expectation"
            exit 1
          fi
          CURRENT_BBOX=$(jq -cer '.current.expected_bbox' /tmp/id-smoke-preview/id-smoke-cases.json)
          HISTORICAL_BBOX=$(jq -cer '.historical.expected_bbox' /tmp/id-smoke-preview/id-smoke-cases.json)

          request_id() {
            local id="$1"
            local output="$2"
            local code
            # A newly deployed workers.dev route can take longer than the old
            # ~25-second window to become reachable (Cloudflare 1042/1104).
            # Keep the retry bounded and fail closed after about two minutes.
            for attempt in $(seq 1 12); do
              code=$(curl -sS --max-time 30 -o "$output" -w '%{http_code}' \
                "${PREVIEW_URL}/id/${id}" || true)
              if [ "$code" = "200" ]; then
                return 0
              fi
              echo "Attempt ${attempt}: /id/${id} returned ${code}: $(cat "$output" 2>/dev/null || true)"
              if [ "$attempt" -lt 12 ]; then
                sleep 10
              fi
            done
            return 1
          }

          request_id "$CURRENT_ID" /tmp/current-id.json
          request_id "$HISTORICAL_ID" /tmp/historical-id.json

          jq -e \
            --arg id "$CURRENT_ID" \
            --arg release "$OVERTURE_RELEASE" \
            --arg feature_type "$CURRENT_FEATURE_TYPE" \
            --arg theme "$CURRENT_THEME" \
            --arg filename "$CURRENT_FILENAME" \
            --arg overture_path "$CURRENT_OVERTURE_PATH" \
            --argjson registry_member "$CURRENT_REGISTRY_MEMBER" \
            --argjson bbox "$CURRENT_BBOX" '
            .id == $id
            and .data_version == "smoketest-id"
            and .bbox == $bbox
            and .feature_type == $feature_type
            and .theme == $theme
            and .filename == $filename
            and .last_seen_release == $release
            and .registry_member == $registry_member
            and .exists_in_current_release == true
            and .overture_path == $overture_path
          ' /tmp/current-id.json

          jq -e \
            --arg id "$HISTORICAL_ID" \
            --arg historical_release "$HISTORICAL_RELEASE" \
            --argjson bbox "$HISTORICAL_BBOX" '
            .id == $id
            and .data_version == "smoketest-id"
            and .bbox == $bbox
            and .feature_type == null
            and .theme == null
            and .filename == null
            and .last_seen_release == $historical_release
            and .registry_member == true
            and .exists_in_current_release == false
            and .overture_path == null
          ' /tmp/historical-id.json
          echo "Preview Worker returned valid current and historical v3 responses."

      - name: Delete preview Worker and fixed-prefix R2 objects
        if: always()
        run: |
          FAILED=0
          for attempt in 1 2 3; do
            DELETE_LOG=$(mktemp)
            if wrangler delete \
              --config crates/geocoder-worker/wrangler.id-smoke.toml \
              --force >"$DELETE_LOG" 2>&1; then
              cat "$DELETE_LOG"
              break
            fi
            cat "$DELETE_LOG"
            sleep $((attempt * 5))
          done

          WORKER_ABSENT=0
          WORKER_API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/geocoder-id-smoke"
          for attempt in 1 2 3; do
            if WORKER_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "$WORKER_API"); then
              if [ "$WORKER_STATUS" = "404" ]; then
                WORKER_ABSENT=1
                break
              fi
              if [ "$WORKER_STATUS" = "200" ]; then
                echo "Attempt ${attempt}: preview Worker still exists"
              else
                echo "Attempt ${attempt}: unable to verify preview Worker absence (HTTP ${WORKER_STATUS})"
              fi
            else
              echo "Attempt ${attempt}: unable to verify preview Worker absence (transport error)"
            fi
            sleep $((attempt * 5))
          done
          if [ "$WORKER_ABSENT" -ne 1 ]; then
            echo "::error::Could not verify that the isolated ID smoke Worker was deleted"
            FAILED=1
          fi

          echo "Cleaning up all ID smoke objects under ${SMOKE_VERSION}/..."
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for attempt in 1 2 3; do
            aws s3 rm "s3://geocoder-shards/${SMOKE_VERSION}/" --recursive \
              --only-show-errors --endpoint-url "$ENDPOINT" --region auto || true
            REMAINING=$(aws s3api list-objects-v2 \
              --bucket geocoder-shards --prefix "${SMOKE_VERSION}/" \
              --max-keys 1 --query 'KeyCount' --output text \
              --endpoint-url "$ENDPOINT" --region auto || echo unknown)
            if [ "$REMAINING" = "0" ]; then
              break
            fi
            sleep $((attempt * 5))
          done
          if [ "$REMAINING" != "0" ]; then
            echo "::error::ID smoke cleanup left objects under ${SMOKE_VERSION}/"
            FAILED=1
          fi
          exit "$FAILED"

      - name: Summary
        if: always()
        run: |
          echo "## R2 ID Index Smoke Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release-theme limit:** 50 records per type after fixed-prefix filtering" >> $GITHUB_STEP_SUMMARY
          echo "**Overture release:** ${OVERTURE_RELEASE}" >> $GITHUB_STEP_SUMMARY
          echo "**R2 prefix:** ${SMOKE_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
