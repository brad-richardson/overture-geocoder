name: Hosted address map/reduce data spike

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-address-rowgroup-data-spike
  cancel-in-progress: false

jobs:
  bounded-address-map-reduce:
    name: Address map/reduce task ${{ matrix.name }} (${{ matrix.task_index }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: us-full
            task_index: 48
          - name: mexico-full
            task_index: 3
          - name: smallest-tail
            task_index: 126
    env:
      PYTHONHASHSEED: "0"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - name: Check out main without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install pinned binary dependency
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"

      - name: Record runner resources
        run: |
          {
            echo "## Hosted address map/reduce data spike"
            echo
            echo '```text'
            lscpu
            free -h
            df -h . /tmp
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read and project an inventoried current-release task
        run: |
          set -euo pipefail
          /usr/bin/time -v python scripts/experiment_hosted_rowgroups.py \
            --release 2026-06-17.0 \
            --family addresses \
            --inventory-report benchmarks/address-rowgroup-inventory-report.json \
            --task-index "${{ matrix.task_index }}" \
            --output /tmp/address-rowgroups.parquet \
            --json-out hosted-rowgroup-report.json \
            --target-rowgroup-uncompressed-bytes 350000000 \
            --max-rows 4000000 \
            --max-groups 72 \
            --max-output-bytes 500000000

      - name: Build sorted map fragments and reduce one compact shard
        run: |
          set -euo pipefail
          /usr/bin/time -v python scripts/experiment_address_reduce.py \
            --input /tmp/address-rowgroups.parquet \
            --output /tmp/address-reduced.aidx \
            --json-out hosted-address-reduce-report.json \
            --work-dir /tmp \
            --max-rows 4000000 \
            --fragment-rows 128000 \
            --sparse-stride 256 \
            --max-artifact-bytes 1000000000 \
            --max-workspace-bytes 12000000000

      - name: Compare range-readable address formats and compression
        run: |
          set -euo pipefail
          /usr/bin/time -v python scripts/experiment_address_compression.py \
            --input /tmp/address-reduced.aidx \
            --output-dir /tmp/address-compression \
            --json-out hosted-address-compression-report.json \
            --page-rows 256 \
            --planning-rows 473576753 \
            --max-input-bytes 1000000000 \
            --max-output-bytes 1000000000 \
            --max-workspace-bytes 6000000000 \
            --max-page-bytes 8388608 \
            --max-page-rows 10000

      - name: Summarize bounded measurement
        if: always()
        run: |
          {
            echo
            echo "### Projection report"
            echo '```json'
            test -f hosted-rowgroup-report.json && cat hosted-rowgroup-report.json
            echo '```'
            echo
            echo "### Reduce report"
            echo '```json'
            test -f hosted-address-reduce-report.json && cat hosted-address-reduce-report.json
            echo '```'
            echo
            echo "### Format/compression report"
            echo '```json'
            test -f hosted-address-compression-report.json && cat hosted-address-compression-report.json
            echo '```'
            echo
            echo "The US, Mexico, and smallest-tail tasks are selected from the complete 127-task inventory. Inputs and compact outputs remain ephemeral; no R2 object, catalog, or production state is written."
          } >> "$GITHUB_STEP_SUMMARY"
