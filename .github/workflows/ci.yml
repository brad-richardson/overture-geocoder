name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          curl -fsSL -o download-actionlint.bash \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash"
          bash download-actionlint.bash "${ACTIONLINT_VERSION}"
      - name: Run actionlint
        # Native actionlint checks (workflow syntax, ${{ }} expressions, job
        # needs-graph, action inputs, matrix) must pass. The shellcheck and
        # pyflakes integrations are disabled for now: the existing workflows
        # carry ~70 pre-existing shellcheck quoting findings (mostly SC2086)
        # that need a dedicated cleanup pass. Re-enable by dropping the empty
        # -shellcheck=/-pyflakes= flags once those are fixed.
        run: ./actionlint -color -shellcheck= -pyflakes=

  rust:
    name: Rust (Crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run fmt
        working-directory: crates
        run: cargo fmt --all -- --check
      - name: Run clippy
        working-directory: crates
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        working-directory: crates
        run: cargo test
  python-pipeline:
    name: Python Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --require-hashes \
            -r .github/requirements-hosted-rowgroup.txt
          pip install pytest pytest-xdist pyyaml h3==4.3.1 shapely==2.1.2 psutil==7.2.2
      - name: Run pipeline tests
        # No -m filter: CI always runs the ENTIRE suite. Parallelism comes from
        # pytest.ini's `-n auto --dist worksteal`, never from running less.
        run: pytest tests/ -v

  js-client:
    name: JS Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: clients/js/package-lock.json

      - name: Install dependencies
        working-directory: clients/js
        run: npm ci

      - name: Run type check
        working-directory: clients/js
        run: npm run typecheck

      - name: Run tests
        working-directory: clients/js
        run: npm run test:ci

      - name: Build package
        working-directory: clients/js
        run: npm run build

  python-client:
    name: Python Client
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: clients/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: clients/python
        run: pytest tests/ -v

      - name: Build package
        working-directory: clients/python
        run: pip install build && python -m build
