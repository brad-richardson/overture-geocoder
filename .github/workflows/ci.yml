name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  # A push that lands while GitHub Actions is degraded never gets a run, and
  # nothing can re-request one: `gh run rerun` needs a run to rerun, and CI is
  # what `deploy-rust-worker.yml` waits on. The 2026-08-06 outage left two main
  # commits with zero check-runs and forced a hand-deploy. This makes a commit
  # re-attestable without an empty commit.
  workflow_dispatch:

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          curl -fsSL -o download-actionlint.bash \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash"
          bash download-actionlint.bash "${ACTIONLINT_VERSION}"
      - name: Run actionlint
        # Native actionlint checks (workflow syntax, ${{ }} expressions, job
        # needs-graph, action inputs, matrix) must pass. The shellcheck and
        # pyflakes integrations are disabled for now: the existing workflows
        # carry ~70 pre-existing shellcheck quoting findings (mostly SC2086)
        # that need a dedicated cleanup pass. Re-enable by dropping the empty
        # -shellcheck=/-pyflakes= flags once those are fixed.
        run: ./actionlint -color -shellcheck= -pyflakes=

  rust:
    name: Rust (Crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Every run recompiled the workspace and every dependency from scratch.
      # The job's cost is entirely compilation -- executing the tests takes
      # 0.5s warm, against ~13s of build on a 20-core box (76s of CPU, so
      # appreciably longer on a 4-vCPU runner) -- and clippy --all-targets
      # --all-features plus cargo test are two separate builds within the job.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: Run fmt
        working-directory: crates
        run: cargo fmt --all -- --check
      - name: Run clippy
        working-directory: crates
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        working-directory: crates
        run: cargo test
  python-pipeline:
    name: Python Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements-hosted-rowgroup.txt
      # This job compiles Rust too, and used to do it from scratch: the pytest
      # fixtures shell out to `cargo build -p geocoder-construction --bins`, so
      # the construction crate is built here as well as in the Rust job.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --require-hashes \
            -r .github/requirements-hosted-rowgroup.txt
          # pytest-xdist is REQUIRED, not optional: pytest.ini sets `-n auto`,
          # so CI cannot collect without it. Versions pinned per the
          # cold-start policy in tests/test_workflow_dependency_pinning.py.
          pip install pytest==9.1.1 pytest-xdist==3.8.0 pyyaml==6.0.3 h3==4.3.1 shapely==2.1.2 psutil==7.2.2
      - name: Run pipeline tests
        # No -m filter: CI always runs the ENTIRE suite. Parallelism comes from
        # pytest.ini's `-n auto --dist worksteal`, never from running less.
        run: pytest tests/ -v

  js-client:
    name: JS Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: clients/js/package-lock.json

      - name: Install dependencies
        working-directory: clients/js
        run: npm ci

      - name: Run type check
        working-directory: clients/js
        run: npm run typecheck

      - name: Run tests
        working-directory: clients/js
        run: npm run test:ci

      - name: Build package
        working-directory: clients/js
        run: npm run build

  python-client:
    name: Python Client
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Install dependencies
        working-directory: clients/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: clients/python
        run: pytest tests/ -v

      - name: Build package
        working-directory: clients/python
        run: pip install build==1.5.0 && python -m build
