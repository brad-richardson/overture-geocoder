name: Prepare global v2 family build (no dispatch)

# This workflow freezes and checks the build request only. It has no cloud
# credentials and no data-plane job, so it cannot rebuild shards or publish a
# release. The resulting request is the input contract for the future executor.
on:
  workflow_dispatch:
    inputs:
      overture_release:
        description: Pinned Overture release (YYYY-MM-DD.N).
        required: true
        type: string
      geocoder_build:
        description: Planned geocoder build identity (YYYY-MM-DD.N).
        required: true
        type: string
      slice_version:
        description: Unpublished family slice identity (slice-YYYY-MM-DD.N).
        required: true
        type: string
      legacy_core_version:
        description: Verified legacy core build to reuse (YYYY-MM-DD.N).
        required: true
        type: string
      legacy_core_manifest_sha256:
        description: SHA-256 of that core release-manifest.json.
        required: true
        type: string
      family_inputs_json:
        description: Exact addresses/places inventory, schema, and predecessor key/bytes/SHA triples as JSON.
        required: true
        type: string
      confirmation:
        description: Type PREPARE_ONLY; this workflow never starts a data build.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-global-v2-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  request:
    name: Validate undispatched build request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Require explicit preparation-only confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = PREPARE_ONLY

      - name: Build, reproduce, and validate the request
        env:
          OVERTURE_RELEASE: ${{ inputs.overture_release }}
          GEOCODER_BUILD: ${{ inputs.geocoder_build }}
          SLICE_VERSION: ${{ inputs.slice_version }}
          LEGACY_CORE_VERSION: ${{ inputs.legacy_core_version }}
          LEGACY_CORE_MANIFEST_SHA256: ${{ inputs.legacy_core_manifest_sha256 }}
          FAMILY_INPUTS_JSON: ${{ inputs.family_inputs_json }}
        run: |
          set -euo pipefail
          mkdir -p build-request
          printf '%s\n' "$FAMILY_INPUTS_JSON" > build-request/family-inputs.json
          jq -e '
            type == "object" and
            (keys == ["addresses", "places"]) and
            all(
              .[];
              type == "object" and
              (keys == [
                "inventory_sha256",
                "lineage_generation",
                "predecessor_family_manifest",
                "schema_fingerprint_sha256"
              ]) and
              ((.lineage_generation | type) == "number") and
              (.lineage_generation >= 1) and
              (.lineage_generation == (.lineage_generation | floor)) and
              (.inventory_sha256 | type == "string") and
              (.schema_fingerprint_sha256 | type == "string") and
              (
                (.predecessor_family_manifest | type == "object") and
                (.predecessor_family_manifest | keys == ["bytes", "object_key", "sha256"]) and
                (
                  ([.predecessor_family_manifest[]] | all(. == null)) or
                  (
                    (.predecessor_family_manifest.object_key | type == "string") and
                    (.predecessor_family_manifest.bytes | type == "number") and
                    (.predecessor_family_manifest.sha256 | type == "string")
                  )
                )
              )
            )
          ' build-request/family-inputs.json > /dev/null
          ADDRESSES_INVENTORY_SHA256="$(
            jq -r '.addresses.inventory_sha256' build-request/family-inputs.json
          )"
          ADDRESSES_SCHEMA_FINGERPRINT_SHA256="$(
            jq -r '.addresses.schema_fingerprint_sha256' build-request/family-inputs.json
          )"
          ADDRESSES_PREDECESSOR_FAMILY_MANIFEST="$(
            jq -c '.addresses.predecessor_family_manifest' \
              build-request/family-inputs.json
          )"
          ADDRESSES_LINEAGE_GENERATION="$(
            jq -r '.addresses.lineage_generation' build-request/family-inputs.json
          )"
          PLACES_INVENTORY_SHA256="$(
            jq -r '.places.inventory_sha256' build-request/family-inputs.json
          )"
          PLACES_SCHEMA_FINGERPRINT_SHA256="$(
            jq -r '.places.schema_fingerprint_sha256' build-request/family-inputs.json
          )"
          PLACES_PREDECESSOR_FAMILY_MANIFEST="$(
            jq -c '.places.predecessor_family_manifest' \
              build-request/family-inputs.json
          )"
          PLACES_LINEAGE_GENERATION="$(
            jq -r '.places.lineage_generation' build-request/family-inputs.json
          )"
          LEGACY_CORE_MANIFEST_KEY="$LEGACY_CORE_VERSION/release-manifest.json"
          REQUEST_ARGS=(
            --overture-release "$OVERTURE_RELEASE"
            --geocoder-build "$GEOCODER_BUILD"
            --slice-version "$SLICE_VERSION"
            --legacy-core-version "$LEGACY_CORE_VERSION"
            --legacy-core-overture-release "$OVERTURE_RELEASE"
            --legacy-core-manifest-key "$LEGACY_CORE_MANIFEST_KEY"
            --legacy-core-manifest-sha256 "$LEGACY_CORE_MANIFEST_SHA256"
            --addresses-inventory-sha256 "$ADDRESSES_INVENTORY_SHA256"
            --addresses-schema-fingerprint-sha256 "$ADDRESSES_SCHEMA_FINGERPRINT_SHA256"
            --addresses-lineage-generation "$ADDRESSES_LINEAGE_GENERATION"
            --places-inventory-sha256 "$PLACES_INVENTORY_SHA256"
            --places-schema-fingerprint-sha256 "$PLACES_SCHEMA_FINGERPRINT_SHA256"
            --places-lineage-generation "$PLACES_LINEAGE_GENERATION"
            --producer-commit "$GITHUB_SHA"
            --reduce-job-limit 82
          )
          if [[ "$(jq -r .sha256 <<<"$ADDRESSES_PREDECESSOR_FAMILY_MANIFEST")" != null ]]; then
            REQUEST_ARGS+=(
              --addresses-predecessor-family-manifest-key
              "$(jq -r .object_key <<<"$ADDRESSES_PREDECESSOR_FAMILY_MANIFEST")"
              --addresses-predecessor-family-manifest-bytes
              "$(jq -r .bytes <<<"$ADDRESSES_PREDECESSOR_FAMILY_MANIFEST")"
              --addresses-predecessor-family-manifest-sha256
              "$(jq -r .sha256 <<<"$ADDRESSES_PREDECESSOR_FAMILY_MANIFEST")"
            )
          fi
          if [[ "$(jq -r .sha256 <<<"$PLACES_PREDECESSOR_FAMILY_MANIFEST")" != null ]]; then
            REQUEST_ARGS+=(
              --places-predecessor-family-manifest-key
              "$(jq -r .object_key <<<"$PLACES_PREDECESSOR_FAMILY_MANIFEST")"
              --places-predecessor-family-manifest-bytes
              "$(jq -r .bytes <<<"$PLACES_PREDECESSOR_FAMILY_MANIFEST")"
              --places-predecessor-family-manifest-sha256
              "$(jq -r .sha256 <<<"$PLACES_PREDECESSOR_FAMILY_MANIFEST")"
            )
          fi
          python scripts/global_v2_build_request.py build \
            "${REQUEST_ARGS[@]}" --output build-request/request.json
          python scripts/global_v2_build_request.py build \
            "${REQUEST_ARGS[@]}" --output build-request/request-repeat.json
          cmp build-request/request.json build-request/request-repeat.json
          python scripts/global_v2_build_request.py validate \
            --request build-request/request.json
          sha256sum build-request/request.json > build-request/request.sha256

      - name: Summarize the preparation boundary
        run: |
          {
            echo '## Global v2 family build request'
            echo
            jq '{overture_release, geocoder_build, slice_version, legacy_core, scope, families, execution}' \
              build-request/request.json
            echo
            echo 'No Overture object was read, no R2 object was written, no shard was rebuilt, and no catalog was published.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the exact request for the executor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: global-v2-build-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-request/
          if-no-files-found: error
          retention-days: 30
