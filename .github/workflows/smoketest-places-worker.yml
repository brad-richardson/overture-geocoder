name: Smoke Test Places Worker Read Chain

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoketest-places-worker
  cancel-in-progress: true

env:
  SMOKE_VERSION: smoketest-places-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38de10e7b70166bc74ed198c30 # v6
        with:
          node-version: "24"

      - name: Set up Rust and Worker build
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install smoke tools
        run: |
          pip install duckdb==1.5.1
          npm install -g wrangler@4.111.0
          cargo install worker-build --version 0.7.5 --locked

      - name: Extract three current-release regional samples
        run: |
          set -euo pipefail
          mkdir -p /tmp/places-worker-smoke
          python scripts/experiment_places_partition_extract.py \
            --release 2026-06-17.0 --limit 50000 \
            --xmin -71.25 --xmax -70.85 --ymin 42.15 --ymax 42.55 \
            --output /tmp/places-worker-smoke/boston.parquet
          python scripts/experiment_places_partition_extract.py \
            --release 2026-06-17.0 --limit 50000 \
            --xmin 139.45 --xmax 140.05 --ymin 35.45 --ymax 35.95 \
            --output /tmp/places-worker-smoke/tokyo.parquet
          python scripts/experiment_places_partition_extract.py \
            --release 2026-06-17.0 --limit 50000 \
            --xmin -99.45 --xmax -98.85 --ymin 19.15 --ymax 19.75 \
            --output /tmp/places-worker-smoke/mexico-city.parquet

      - name: Build routed compact shards, catalog, packed head, and exact oracles
        run: |
          set -euo pipefail
          python scripts/prepare_places_worker_smoke.py \
            --input /tmp/places-worker-smoke/boston.parquet \
            --input /tmp/places-worker-smoke/tokyo.parquet \
            --input /tmp/places-worker-smoke/mexico-city.parquet \
            --context boston --context tokyo --context mexico-city \
            --relevance-seed benchmarks/places-relevance-seed.json \
            --output-dir /tmp/places-worker-smoke/artifacts
          jq -e '
            (.catalog.object == "catalog.pcat")
            and (.cases | any(.head_hit == true))
            and (.cases | any(.head_hit == false))
            and (.cases | any(.name == "shard_prefix"))
            and (.cases | any(.name == "cjk_exact"))
            and ([.cases[] | select(.class != "reader_equivalence")] | length == 6)
            and ([.cases[] | select(.route == "catalog_context") | .route_shard] | unique | length == 3)
            and (all(.cases[]; (.required_objects | length) <= 2))
          ' /tmp/places-worker-smoke/artifacts/report.json

      - name: Upload and verify one independent R2 namespace per case
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          jq -c '(.cases + .failure_cases)[]' \
            /tmp/places-worker-smoke/artifacts/report.json | while read -r CASE; do
            SCOPE=$(jq -r '.scope' <<< "$CASE")
            jq -r '.required_objects[]' <<< "$CASE" | while read -r NAME; do
              KEY="${SMOKE_VERSION}/case-${SCOPE}/${NAME}"
              wrangler r2 object put "geocoder-shards/${KEY}" \
                --file "/tmp/places-worker-smoke/artifacts/${NAME}" --remote
              wrangler r2 object get "geocoder-shards/${KEY}" \
                --remote --pipe > "/tmp/readback-${SCOPE}-${NAME}"
              cmp "/tmp/places-worker-smoke/artifacts/${NAME}" \
                "/tmp/readback-${SCOPE}-${NAME}"
            done
          done

      - name: Deploy isolated Places preview Worker
        working-directory: crates/geocoder-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DEPLOY_LOG=$(mktemp)
          wrangler deploy --config wrangler.places-smoke.toml \
            --var ENVIRONMENT:places-smoke \
            --var "PLACES_SPIKE_PREFIX:${SMOKE_VERSION}" \
            2>&1 | tee "$DEPLOY_LOG"
          PREVIEW_URL=$(grep -oE 'https://[^[:space:]]+\.workers\.dev' "$DEPLOY_LOG" | tail -1)
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Wait for preview propagation
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "${PREVIEW_URL}/" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Measure independently cold and warm routed/head chains
        run: |
          set -euo pipefail
          : > /tmp/places-worker-timings.jsonl
          jq -c '.cases[]' /tmp/places-worker-smoke/artifacts/report.json | while read -r CASE; do
            NAME=$(jq -r '.name' <<< "$CASE")
            SCOPE=$(jq -r '.scope | @uri' <<< "$CASE")
            CONTEXT=$(jq -r 'if .context == null then "" else (.context | @uri) end' <<< "$CASE")
            EXPECTED_IDS=$(jq -c '.result_ids' <<< "$CASE")
            EXPECTED_RESULTS=$(jq -c '.results' <<< "$CASE")
            EXPECTED_HEAD=$(jq -r '.head_hit' <<< "$CASE")
            EXPECTED_COUNT=$(jq -r '.candidate_count' <<< "$CASE")
            EXPECTED_ROUTE=$(jq -r '.route' <<< "$CASE")
            QUERY="scope=${SCOPE}"
            if [ -n "$CONTEXT" ]; then QUERY="${QUERY}&context=${CONTEXT}"; fi
            if jq -e '.point != null' <<< "$CASE" >/dev/null; then
              LON=$(jq -r '.point[0] | @uri' <<< "$CASE")
              LAT=$(jq -r '.point[1] | @uri' <<< "$CASE")
              QUERY="${QUERY}&lon=${LON}&lat=${LAT}"
            fi
            while read -r CLAUSE; do
              TOKEN=$(jq -r '.token | @uri' <<< "$CLAUSE")
              PREFIX=$(jq -r 'if .prefix then "1" else "0" end' <<< "$CLAUSE")
              FIELD=$(jq -r 'if .field == null then "any" else .field end | @uri' <<< "$CLAUSE")
              QUERY="${QUERY}&token=${TOKEN}&prefix=${PREFIX}&field=${FIELD}"
            done < <(jq -c '.clauses[]' <<< "$CASE")
            for attempt in 1 2 3 4 5 6; do
              BODY=$(mktemp)
              HEADERS=$(mktemp)
              STATUS=""
              TOTAL=""
              # A newly deployed workers.dev script can briefly alternate with
              # a previous/missing version while propagating between edge hosts.
              # Ignore only that transient 404; the first successful response is
              # still the cold R2 sample and every successful body remains strict.
              for propagation_attempt in $(seq 1 12); do
                read -r STATUS TOTAL < <(curl --silent --show-error \
                  --dump-header "$HEADERS" --output "$BODY" \
                  --write-out '%{http_code} %{time_total}\n' \
                  "${PREVIEW_URL}/__places-page-spike?${QUERY}")
                if [ "$STATUS" = "200" ]; then
                  break
                fi
                if [ "$STATUS" != "404" ]; then
                  echo "::error::Places page spike returned HTTP ${STATUS}"
                  cat "$BODY"
                  exit 1
                fi
                sleep 2
              done
              if [ "$STATUS" != "200" ]; then
                echo "::error::Places page spike remained unavailable after propagation retries"
                cat "$BODY"
                exit 1
              fi
              jq -e --argjson ids "$EXPECTED_IDS" --argjson results "$EXPECTED_RESULTS" \
                --argjson head "$EXPECTED_HEAD" \
                --argjson count "$EXPECTED_COUNT" --arg route "$EXPECTED_ROUTE" \
                --argjson attempt "$attempt" '
                def text_projection:
                  {id,name,category,locality,region,country};
                .schema == "overture-places-worker-spike-v2"
                and [.results[].id] == $ids
                and ([.results[].id] | unique | length) == (.results | length)
                and (.results | length) == ($results | length)
                and all(range(0; $results | length) as $i;
                  (.results[$i] | text_projection) == ($results[$i] | text_projection)
                  and ((.results[$i].latitude - $results[$i].latitude) | abs) < 0.000001
                  and ((.results[$i].longitude - $results[$i].longitude) | abs) < 0.000001
                  and ((.results[$i].confidence - $results[$i].confidence) | abs) < 0.000001
                  and (if ($results[$i] | has("distance_km"))
                       then ((.results[$i].distance_km - $results[$i].distance_km) | abs) < 0.001
                       else (.results[$i] | has("distance_km") | not) end))
                and .candidate_count == $count
                and .head_hit == $head
                and .route == $route
                and .read_metrics.logical_ranges >= 3
                and (if (.route | startswith("head")) or .route == "packed_head"
                     then (.shards | length) == 0 and .head_consulted == true
                     else (.shards | length) == 1 and .head_consulted == false end)
                and (if $attempt == 1 then .read_metrics.r2_reads > 0 else true end)
              ' "$BODY"
              SERVER_TIMING=$(awk 'BEGIN{IGNORECASE=1} /^server-timing:/ {sub(/\r$/, ""); print substr($0, index($0,$2)); exit}' "$HEADERS")
              WORKER_MS=$(sed -nE 's/.*total;dur=([0-9.]+).*/\1/p' <<< "$SERVER_TIMING")
              jq -cn --arg name "$NAME" --argjson attempt "$attempt" \
                --argjson time_total "$TOTAL" --arg server_timing "$SERVER_TIMING" \
                --arg worker_ms "$WORKER_MS" \
                --slurpfile response "$BODY" \
                '{case:$name,attempt:$attempt,time_total_seconds:$time_total,
                  server_timing:$server_timing,
                  worker_time_ms:(try ($worker_ms | tonumber) catch null),
                  read_metrics:$response[0].read_metrics,
                  route:$response[0].route,head_hit:$response[0].head_hit,
                  results:$response[0].results}' >> /tmp/places-worker-timings.jsonl
            done
          done
          jq -s '{schema:"overture-places-worker-latency-spike-v2",samples:.}' \
            /tmp/places-worker-timings.jsonl | tee /tmp/places-worker-latency.json

      - name: Classify technical gates without implying launch approval
        run: |
          set -euo pipefail
          jq -s '
            def median:
              sort as $values | ($values | length) as $length |
              if $length == 0 then null
              elif ($length % 2) == 1 then $values[($length / 2 | floor)]
              else (($values[$length / 2 - 1] + $values[$length / 2]) / 2) end;
            group_by(.case) |
            map(sort_by(.attempt) as $samples |
              $samples[0] as $cold |
              [$samples[1:][] | .time_total_seconds] as $warm_times |
              {
                case: $cold.case,
                route: $cold.route,
                cold: {
                  client_seconds: $cold.time_total_seconds,
                  worker_time_ms: $cold.worker_time_ms,
                  r2_reads: $cold.read_metrics.r2_reads,
                  r2_bytes: $cold.read_metrics.r2_bytes
                },
                warm_median_client_seconds: ($warm_times | median),
                warm_all_zero_r2: all($samples[1:][]; .read_metrics.r2_reads == 0),
                technical_pass: (
                  $cold.time_total_seconds <= 1.0
                  and (($warm_times | median) <= 0.250)
                  and all($samples[1:][]; .read_metrics.r2_reads == 0)
                  and (if ($cold.route == "packed_head" or $cold.route == "head_only_miss")
                       then ($cold.read_metrics.r2_reads <= 4 and $cold.read_metrics.r2_bytes <= 262144)
                       else ($cold.read_metrics.r2_reads <= 8 and $cold.read_metrics.r2_bytes <= 524288)
                       end)
                )
              }) as $cases |
            {
              schema: "overture-places-worker-technical-decision-v1",
              classification: (if all($cases[]; .technical_pass)
                               then "awaiting_relevance_benchmark" else "optimize" end),
              launch_approved: false,
              note: "A green workflow means evidence capture succeeded. Side-by-side reference-geocoder comparison and adjudication are still required and can produce proceed, optimize, or stop.",
              cases: $cases
            }
          ' /tmp/places-worker-timings.jsonl | tee /tmp/places-worker-technical-decision.json
          jq -e '.launch_approved == false and (.classification == "awaiting_relevance_benchmark" or .classification == "optimize")' \
            /tmp/places-worker-technical-decision.json

      - name: Exercise independently cold catalog failure
        run: |
          set -euo pipefail
          CASE=$(jq -c '.failure_cases[0]' /tmp/places-worker-smoke/artifacts/report.json)
          SCOPE=$(jq -r '.scope | @uri' <<< "$CASE")
          CONTEXT=$(jq -r '.context | @uri' <<< "$CASE")
          TOKEN=$(jq -r '.clauses[0].token | @uri' <<< "$CASE")
          BODY=$(mktemp)
          HEADERS=$(mktemp)
          read -r STATUS TOTAL < <(curl --silent --show-error --output "$BODY" \
            --dump-header "$HEADERS" --write-out '%{http_code} %{time_total}\n' \
            "${PREVIEW_URL}/__places-page-spike?scope=${SCOPE}&context=${CONTEXT}&token=${TOKEN}")
          test "$STATUS" = "400"
          jq -e '
            .schema == "overture-places-worker-spike-v2"
            and .route == "catalog_miss"
            and .read_metrics.r2_reads == 2
          ' "$BODY"
          SERVER_TIMING=$(awk 'BEGIN{IGNORECASE=1} /^server-timing:/ {sub(/\r$/, ""); print substr($0, index($0,$2)); exit}' "$HEADERS")
          jq -cn --argjson status "$STATUS" --argjson time_total "$TOTAL" \
            --arg server_timing "$SERVER_TIMING" --slurpfile response "$BODY" \
            '{schema:"overture-places-worker-failure-spike-v1",status:$status,
              time_total_seconds:$time_total,server_timing:$server_timing,
              response:$response[0]}' | tee /tmp/places-worker-failure.json

      - name: Summarize measurement
        if: always()
        run: |
          {
            echo "## Places Worker compact-shard/head smoke"
            echo
            echo '```json'
            test -f /tmp/places-worker-smoke/artifacts/report.json && \
              cat /tmp/places-worker-smoke/artifacts/report.json
            test -f /tmp/places-worker-latency.json && cat /tmp/places-worker-latency.json
            test -f /tmp/places-worker-technical-decision.json && cat /tmp/places-worker-technical-decision.json
            test -f /tmp/places-worker-failure.json && cat /tmp/places-worker-failure.json
            echo '```'
            echo
            echo "Three real regional samples, versioned catalog routing, one shard maximum per located query, packed-head-only context-free queries, and one independent cache namespace per latency case. All objects are non-promoting."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete preview Worker and isolated R2 objects
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set +e
          FAILED=0
          WORKER_API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/geocoder-places-smoke"
          STATUS=$(curl --silent --show-error --request DELETE --output /dev/null \
            --write-out '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$WORKER_API")
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "404" ]; then FAILED=1; fi
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 rm "s3://geocoder-shards/${SMOKE_VERSION}/" --recursive \
            --only-show-errors --endpoint-url "$ENDPOINT" --region auto
          REMAINING=$(aws s3api list-objects-v2 --bucket geocoder-shards \
            --prefix "${SMOKE_VERSION}/" --max-keys 1 --query KeyCount --output text \
            --endpoint-url "$ENDPOINT" --region auto)
          if [ "$REMAINING" != "0" ]; then FAILED=1; fi
          exit "$FAILED"
