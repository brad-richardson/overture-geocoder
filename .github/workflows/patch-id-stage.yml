name: Patch ID Stage

# Recovery ritual, the "Re-run failed jobs" publication path, and the
# two-dispatch stale-marker trap are documented in docs/rebuild-recovery.md.
# Read it before dispatching a patch: pass prefixes AND run_build=true together.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g., 2026-02-26.0)'
        type: string
        required: true
      release:
        description: 'Overture release the version was built from (e.g., 2026-01-21.0). Must match the original build — discovering "latest" here could mix releases within one version.'
        type: string
        required: true
      prefixes:
        description: 'Comma-separated failed prefixes (e.g., 001,401,801); empty = skip registry patching'
        type: string
        required: false
        default: ''
      marker_ranges:
        description: 'Comma-separated ranges to mark complete (e.g., 000-3ff,c00-fff)'
        type: string
        required: false
        default: ''
      run_stage_base:
        description: 'Run the release (base/addresses) staging phase (resumes past completed types)'
        type: boolean
        required: false
        default: false
      run_build:
        description: 'Run build using the existing immutable global locator dictionary; unseen tuples/releases fail closed'
        type: boolean
        required: false
        default: true
      run_metadata:
        description: 'Run metadata phase after build'
        type: boolean
        required: false
        default: true

# This workflow mutates versioned ID artifacts, so it must not overlap release
# finalization, catalog publication, or cleanup.
concurrency:
  group: r2-production-catalog
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  PATCH_VERSION: ${{ inputs.version }}
  PATCH_RELEASE: ${{ inputs.release }}
  PATCH_PREFIXES: ${{ inputs.prefixes }}
  PATCH_MARKER_RANGES: ${{ inputs.marker_ranges }}

jobs:
  patch-stage:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Reject immutable finalized releases
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          COUNT=$(aws s3api list-objects-v2 \
            --bucket geocoder-shards \
            --prefix "${PATCH_VERSION}/release-manifest.json" \
            --max-keys 1 --query 'KeyCount' --output text \
            --endpoint-url "$ENDPOINT" --region auto)
          if [ "$COUNT" != "0" ]; then
            echo "::error::${PATCH_VERSION} is finalized and immutable; rebuild under a new version"
            exit 1
          fi
          ./scripts/r2_catalog_fetch.sh /tmp/patch-catalog.json
          if jq -e --arg version "$PATCH_VERSION" \
            'any(.links[]?;
              .rel == "child" and
              ((.href | ltrimstr("./") | split("/")[0]) == $version))' \
            /tmp/patch-catalog.json >/dev/null; then
            echo "::error::${PATCH_VERSION} is catalogued and immutable; rebuild under a new version"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install -g wrangler@4.118.0

      - name: Patch failed prefixes
        if: inputs.prefixes != ''
        run: |
          echo "Patching prefixes: ${PATCH_PREFIXES}"
          echo "Will mark ranges complete: ${PATCH_MARKER_RANGES}"
          python -u scripts/build_id_index.py \
            --phase stage-registry \
            --prefix-len 3 --workers 8 \
            --version "$PATCH_VERSION" \
            --release "$PATCH_RELEASE" \
            --prefixes "$PATCH_PREFIXES" \
            --marker-ranges "$PATCH_MARKER_RANGES"

      - name: Force complete rebuilds of affected ranges
        if: inputs.prefixes != '' && inputs.run_build
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for RANGE in 000-3ff 400-7ff 800-bff c00-fff; do
            START=${RANGE%-*}
            END=${RANGE#*-}
            MATCH=false
            IFS=',' read -ra PREFIX_LIST <<< "$PATCH_PREFIXES"
            for PREFIX in "${PREFIX_LIST[@]}"; do
              PREFIX=${PREFIX//[[:space:]]/}
              if (( 16#$PREFIX >= 16#$START && 16#$PREFIX <= 16#$END )); then
                MATCH=true
              fi
            done
            if [ "$MATCH" = "true" ]; then
              echo "Invalidating build-${RANGE}; patched shards require a complete range rebuild"
              aws s3 rm \
                "s3://geocoder-shards/${PATCH_VERSION}/staging/build-${RANGE}/_SUCCESS" \
                --endpoint-url "$ENDPOINT" --region auto --only-show-errors
            fi
          done

      - name: Stage release themes
        if: inputs.run_stage_base
        run: |
          python -u scripts/build_id_index.py \
            --phase stage-base --prefix-len 3 \
            --version "$PATCH_VERSION" \
            --release "$PATCH_RELEASE"

  # Always rebuild the complete affected range so its producer SHA inventory
  # remains canonical. Unaffected ranges retain and honor their markers.
  build-ranges:
    runs-on: ubuntu-24.04-arm
    needs: patch-stage
    if: inputs.run_build
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix_start: "000"
            prefix_end: "3ff"
          - prefix_start: "400"
            prefix_end: "7ff"
          - prefix_start: "800"
            prefix_end: "bff"
          - prefix_start: "c00"
            prefix_end: "fff"
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main @ 2026-08-04
        with:
          tool-cache: false

      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install -g wrangler@4.118.0

      - name: Monitor resources
        run: |
          echo "=== Initial disk space ==="
          df -h / /tmp
          (while true; do
            echo "--- $(date -u +%H:%M:%S) ---"
            free -m | grep Mem | awk '{printf "Memory: %dMB used / %dMB total (%.0f%%)\n", $3, $2, $3/$2*100}'
            df -h / | tail -1 | awk '{printf "Disk: %s used / %s total (%s)\n", $3, $2, $5}'
            echo "Processes: $(ps aux | wc -l)"
            sleep 30
          done) &

      - name: "Build: ${{ matrix.prefix_start }}-${{ matrix.prefix_end }}"
        run: |
          python -u scripts/build_id_index.py \
            --phase build --prefix-len 3 --workers 8 \
            --version "$PATCH_VERSION" \
            --release "$PATCH_RELEASE" \
            --prefix-start ${{ matrix.prefix_start }} \
            --prefix-end ${{ matrix.prefix_end }}

  metadata:
    runs-on: ubuntu-24.04-arm
    needs: [patch-stage, build-ranges]
    # Run when requested even if both build jobs were skipped (run_build=false)
    # — the implicit success() would otherwise skip this job whenever a
    # dependency is skipped. Never run past a failed stage or build.
    if: >-
      ${{ !cancelled() && inputs.run_metadata
          && needs.patch-stage.result == 'success'
          && needs.build-ranges.result != 'failure' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install -g wrangler@4.118.0

      - name: Build ID metadata
        run: |
          python -u scripts/build_id_index.py \
            --phase metadata --prefix-len 3 \
            --version "$PATCH_VERSION" \
            --release "$PATCH_RELEASE"

      - name: Summary
        run: |
          echo "## Patch ID Stage Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Overture release:** ${{ inputs.release }}" >> $GITHUB_STEP_SUMMARY
          echo "**Patched prefixes:** ${{ inputs.prefixes }}" >> $GITHUB_STEP_SUMMARY
          echo "**Marked ranges:** ${{ inputs.marker_ranges }}" >> $GITHUB_STEP_SUMMARY
