name: Construction v1 planet build

# Hosted map/reduce/head/finalize for the isolated construction-v1 Address +
# Places contract. It creates only an immutable, NON-PROMOTING slice under a
# request-derived namespace: it never writes either production catalog, never
# writes production release history, and never promotes.
#
# The first job is a secret-free fail-closed admission gate
# (construction_v1_control.py admit-dispatch): it regenerates the canonical
# request from the submitted bytes and rejects any changed byte, hash, typed
# confirmation, readiness result, or run attempt other than 1, then derives the
# deterministic contract.json / runtime.json every later job consumes. A stale
# or mismatched request SHA fails here before any credential is touched.
#
# The execute data plane is the construction-v1-native adapter
# (construction_v1_hosted.py) driving the vectorized Address/Places producers
# against one content-addressed store. That store lives in a run-scoped R2
# STAGING prefix (staging/global-v2/<request-sha256>/construction-v1/<family>/),
# not in a GitHub artifact: it is 63.5 GB for planet Places and does not fit on a
# runner, so the artifacts between jobs carry MARKERS AND JSON ONLY and each phase
# fetches by key the objects its markers name. See
# docs/plans/2026-07-24-r2-staging-design.md. The exact execute command sequence
# is proven end-to-end with no network in tests/test_construction_v1_hosted.py,
# and the whole transport runs credential-free on the slice harness
# (.github/workflows/slice-smoke.yml) with a filesystem staging backend.
#
# dry-run  -> planning + admission + a bounded sample of map tasks, no R2 writes.
# execute  -> the real non-promoting slice with create-only R2 writes and a
#             completion marker written last.
#
# Runner-minute ledger: every phase appends its actual elapsed minutes to a
# ledger artifact, and each fan-in re-sums prior + spent + next and FAILS CLOSED
# before provisioning the next matrix. Resume is a fresh dispatch (never Re-run
# failed jobs): supply resume_from with the prior run id; the admission job
# downloads the prior ledger read-only and refuses to start if its consumed
# total does not match PRIOR_RUNNER_MINUTES bound into the confirmation.
on:
  workflow_dispatch:
    inputs:
      family:
        description: Which family to build in this run.
        required: true
        type: choice
        options: [address, places]
      mode:
        description: Read-only planning dry-run, or the resumable non-promoting execute slice.
        required: true
        type: choice
        options: [dry-run, execute]
      confirmation:
        description: The FULL typed EXECUTE_CONSTRUCTION_V1::<request-sha>::MODE=execute::MAX_PARALLEL=..::MAX_TOTAL_RUNNER_MINUTES=..::PRIOR_RUNNER_MINUTES=..::MAX_COST_USD=.. string from construction_v1_control.py.
        required: true
        type: string
      request_json:
        description: The canonical one-line request JSON (the ".request" object from the reviewed prepare package); the admission gate re-derives and byte-verifies it against the confirmation SHA.
        required: true
        type: string
      resume_from:
        description: Optional prior run id for fresh-dispatch resume; its ledger's consumed total must equal PRIOR_RUNNER_MINUTES in the confirmation.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: construction-v1-${{ inputs.family }}-${{ inputs.confirmation }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  R2_BUCKET: geocoder-shards
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  # Honest per-phase upper-bound runner-minute estimates used for the fail-closed
  # ledger gate (match construction_v1_control CAPS map/reduce wall minutes).
  MAP_PHASE_ESTIMATE_MINUTES: "60"
  REDUCE_PHASE_ESTIMATE_MINUTES: "90"
  HEAD_PHASE_ESTIMATE_MINUTES: "90"
  FINALIZE_PHASE_ESTIMATE_MINUTES: "120"

jobs:
  admit:
    name: Fail-closed admission, contract, and resume ledger (no cloud secrets)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      request_sha256: ${{ steps.gate.outputs.request_sha256 }}
      family_key: ${{ steps.gate.outputs.family_key }}
      max_parallel: ${{ steps.gate.outputs.max_parallel }}
      max_total_runner_minutes: ${{ steps.gate.outputs.max_total_runner_minutes }}
      prior_runner_minutes: ${{ steps.gate.outputs.prior_runner_minutes }}
      max_cost_usd: ${{ steps.gate.outputs.max_cost_usd }}
      producer_commit: ${{ steps.gate.outputs.producer_commit }}
      map_matrix: ${{ steps.gate.outputs.map_matrix }}
      sample_matrix: ${{ steps.gate.outputs.sample_matrix }}
      map_task_count: ${{ steps.gate.outputs.map_task_count }}
    steps:
      - name: Check out dispatched main without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"
      - name: Install hash-pinned admission dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"

      - name: Regenerate the canonical request, enforce the confirmation, derive the contract
        id: gate
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUEST_JSON: ${{ inputs.request_json }}
          FAMILY: ${{ inputs.family }}
        run: |
          set -euo pipefail
          mkdir -p control
          printf '%s\n' "$REQUEST_JSON" > control/request.json

          case "$CONFIRMATION" in
            EXECUTE_CONSTRUCTION_V1::*) : ;;
            *) echo "confirmation is not an EXECUTE_CONSTRUCTION_V1 string" >&2; exit 1 ;;
          esac
          REQUEST_SHA256="$(printf '%s' "$CONFIRMATION" | awk -F'::' '{print $2}')"
          MAX_PARALLEL="$(printf '%s' "$CONFIRMATION" | sed -n 's/.*MAX_PARALLEL=\([0-9]*\).*/\1/p')"
          MAX_TOTAL="$(printf '%s' "$CONFIRMATION" | sed -n 's/.*MAX_TOTAL_RUNNER_MINUTES=\([0-9]*\).*/\1/p')"
          PRIOR="$(printf '%s' "$CONFIRMATION" | sed -n 's/.*PRIOR_RUNNER_MINUTES=\([0-9]*\).*/\1/p')"
          MAX_COST="$(printf '%s' "$CONFIRMATION" | sed -n 's/.*MAX_COST_USD=\([0-9.]*\).*/\1/p')"
          case "$MAX_PARALLEL" in ''|*[!0-9]*) echo "unparseable MAX_PARALLEL" >&2; exit 1 ;; esac
          if [ "$MAX_PARALLEL" -lt 1 ] || [ "$MAX_PARALLEL" -gt 8 ]; then
            echo "MAX_PARALLEL must be 1..8" >&2; exit 1
          fi
          case "$FAMILY" in
            address) FAMILY_KEY=addresses ;;
            places)  FAMILY_KEY=places ;;
            *) echo "unknown family $FAMILY" >&2; exit 1 ;;
          esac

          # Fail-closed admission (regenerates the request, rejects any drift or
          # run_attempt != 1) and emits both family map matrices.
          python scripts/construction_v1_control.py admit-dispatch \
            --request control/request.json \
            --request-sha256 "$REQUEST_SHA256" \
            --confirmation "$CONFIRMATION" \
            --run-attempt '${{ github.run_attempt }}' \
            --github-output control/matrices.env

          # Deterministic contract + runtime every later job consumes.
          python scripts/construction_v1_hosted.py derive-contract \
            --request control/request.json \
            --output control/contract.json --runtime control/runtime.json \
            --strict-versions

          # matrices.env keys use the dispatch input's singular family form
          # (address_matrix/places_matrix), not the plural contract key.
          MAP_MATRIX="$(sed -n "s/^${FAMILY}_matrix=//p" control/matrices.env)"
          test -n "$MAP_MATRIX"
          MAP_COUNT="$(jq '.include | length' <<<"$MAP_MATRIX")"
          if [ "$MAP_COUNT" -gt 256 ]; then
            echo "map matrix has $MAP_COUNT entries; exceeds the 256 matrix cap (chunk required)" >&2
            exit 1
          fi
          SAMPLE_MATRIX="$(jq -c '{include: (.include[0:3])}' <<<"$MAP_MATRIX")"
          PRODUCER="$(jq -er '.producer_commit' control/request.json)"

          {
            echo "request_sha256=$REQUEST_SHA256"
            echo "family_key=$FAMILY_KEY"
            echo "max_parallel=$MAX_PARALLEL"
            echo "max_total_runner_minutes=$MAX_TOTAL"
            echo "prior_runner_minutes=$PRIOR"
            echo "max_cost_usd=$MAX_COST"
            echo "producer_commit=$PRODUCER"
            echo "map_matrix=$MAP_MATRIX"
            echo "sample_matrix=$SAMPLE_MATRIX"
            echo "map_task_count=$MAP_COUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Carry the prior run ledger forward or fail closed (resume only)
        if: inputs.resume_from != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_FROM: ${{ inputs.resume_from }}
          PRIOR: ${{ steps.gate.outputs.prior_runner_minutes }}
        run: |
          set -euo pipefail
          case "$RESUME_FROM" in ''|*[!0-9]*) echo "resume_from must be a prior run id" >&2; exit 1 ;; esac
          mkdir -p resume
          ART_URL="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_FROM}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("construction-v1-ledger-")) | .archive_download_url' | head -1)"
          if [ -z "$ART_URL" ]; then
            echo "resume failed closed: no construction-v1-ledger artifact on run ${RESUME_FROM}" >&2
            exit 1
          fi
          gh api "$ART_URL" > resume/ledger.zip
          (cd resume && unzip -o ledger.zip >/dev/null)
          PRIOR_CONSUMED="$(jq -r '(.prior_runner_minutes // 0) + ([.phases[].runner_minutes] | add // 0)' resume/ledger.json)"
          echo "Prior run ${RESUME_FROM} consumed ${PRIOR_CONSUMED} runner minutes; confirmation binds PRIOR=${PRIOR}."
          if [ "$PRIOR_CONSUMED" != "$PRIOR" ]; then
            echo "resume failed closed: prior ledger consumed ${PRIOR_CONSUMED} != confirmation PRIOR_RUNNER_MINUTES ${PRIOR}" >&2
            echo "Re-run prepare with --prior-runner-minutes ${PRIOR_CONSUMED} and dispatch the new confirmation." >&2
            exit 1
          fi

      - name: Seed the run ledger (genesis or resumed prior)
        run: |
          set -euo pipefail
          jq -n \
            --arg run '${{ github.run_id }}-${{ github.run_attempt }}' \
            --arg resume '${{ inputs.resume_from }}' \
            --arg request '${{ steps.gate.outputs.request_sha256 }}' \
            --arg family '${{ steps.gate.outputs.family_key }}' \
            --argjson cap '${{ steps.gate.outputs.max_total_runner_minutes }}' \
            --argjson prior '${{ steps.gate.outputs.prior_runner_minutes }}' \
            '{schema:"construction-v1-run-ledger-v1",run:$run,resume_from:$resume,request_sha256:$request,family:$family,max_total_runner_minutes:$cap,prior_runner_minutes:$prior,phases:[{phase:"admission",runner_minutes:0}]}' \
            > control/ledger.json
          python scripts/construction_v1_hosted.py ledger-check \
            --ledger control/ledger.json --next-phase-minutes "$MAP_PHASE_ESTIMATE_MINUTES"
          {
            echo "## Construction v1 admission"
            echo
            echo "- Family: \`${{ steps.gate.outputs.family_key }}\` | Mode: \`${{ inputs.mode }}\`"
            echo "- Request SHA-256: \`${{ steps.gate.outputs.request_sha256 }}\`"
            echo "- Map tasks: ${{ steps.gate.outputs.map_task_count }} | Max concurrency: ${{ steps.gate.outputs.max_parallel }}"
            echo "- Retained runner-minute cap: ${{ steps.gate.outputs.max_total_runner_minutes }} | Prior (confirmation-bound): ${{ steps.gate.outputs.prior_runner_minutes }}"
            echo "- Resume-from: \`${{ inputs.resume_from }}\` | Run attempt: ${{ github.run_attempt }} (admission requires 1)"
            echo "- Slice: non-promoting; production catalog writes forbidden"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the control artifact (request, contract, runtime, ledger)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cv1-control
          if-no-files-found: error
          retention-days: 30
          path: |
            control/request.json
            control/contract.json
            control/runtime.json
            control/ledger.json

  map:
    name: ${{ needs.admit.outputs.family_key }} map ${{ matrix.task_index }}
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.admit.outputs.max_parallel) }}
      matrix: ${{ fromJSON(inputs.mode == 'execute' && needs.admit.outputs.map_matrix || needs.admit.outputs.sample_matrix) }}
    steps:
      - name: Check out the request-pinned producer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.admit.outputs.producer_commit }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"
      - name: Install hash-pinned hosted dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - name: Download the control artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cv1-control
          path: control

      - name: Re-run the fail-closed admission gate on this runner (no secrets)
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          python scripts/construction_v1_control.py admit-dispatch \
            --request control/request.json \
            --request-sha256 '${{ needs.admit.outputs.request_sha256 }}' \
            --confirmation "$CONFIRMATION" --run-attempt '${{ github.run_attempt }}'

      - name: Bounded planning sample for one map task (dry-run, no R2 writes)
        if: inputs.mode != 'execute'
        env:
          FAMILY_KEY: ${{ needs.admit.outputs.family_key }}
          TASK_ID: ${{ matrix.task_id }}
          TASK_INDEX: ${{ matrix.task_index }}
        run: |
          set -euo pipefail
          START=$SECONDS
          echo "TASK BEGIN $TASK_ID (family=$FAMILY_KEY index=$TASK_INDEX mode=dry-run)"
          RELEASE="$(jq -r '.release' control/request.json)"
          mkdir -p dryrun
          # P1-1: run the REAL projection argument + inventory-schema validation
          # (no S3) and a reduce capacity prediction, so a dry-run certifies the
          # execute would actually parse, fit the matrix, and fit the budget.
          case "$FAMILY_KEY" in
            addresses)
              INVENTORY=benchmarks/address-construction-v1-data/inventory/addresses.json
              python scripts/experiment_hosted_rowgroups.py --validate-only \
                --release "$RELEASE" --family addresses --inventory-report "$INVENTORY" \
                --task-index "$TASK_INDEX" --json-out "dryrun/validate-${TASK_INDEX}.json" \
                --target-rowgroup-uncompressed-bytes 400000000 --max-rows 4000000 --max-groups 72
              ;;
            places)
              INVENTORY=benchmarks/places-construction-v1-data/inventory/places.json
              # Single source of truth: the evidence-spec path is threaded from
              # the admission-pinned contract (construction_v1_control.py), never
              # a hardcoded constant, so a spec version bump cannot silently
              # diverge from the sha the admission gate verified.
              SPEC="$(jq -er '.families.places.spec' control/contract.json)"
              python scripts/project_places_construction_v1.py --validate-only \
                --inventory "$INVENTORY" --evidence-spec "$SPEC" \
                --task-index "$TASK_INDEX" --report "dryrun/validate-${TASK_INDEX}.json" \
                --max-rows 4000000 --max-groups 72 \
                --max-selected-compressed-bytes 536870912 --max-selected-uncompressed-bytes 1000000000
              ;;
          esac
          ROWS="$(jq -r '.planned_rows // .expected_input_records' "dryrun/validate-${TASK_INDEX}.json")"
          BYTES="$(jq -r '.planned_selected_uncompressed_bytes // .selected_uncompressed_bytes' "dryrun/validate-${TASK_INDEX}.json")"
          RANGES="$(jq -r '.would_read_ranges | length' "dryrun/validate-${TASK_INDEX}.json")"
          # Predict the reduce partition/batch/minute demand from inventory stats
          # and fail closed if a real execute could not fit matrix/reducer/budget.
          TAIL_MINUTES=$(( HEAD_PHASE_ESTIMATE_MINUTES + FINALIZE_PHASE_ESTIMATE_MINUTES ))
          # batch_size + reduce minutes derive from the MEASURED per-partition
          # reduce time (construction_v1_hosted.MEASURED_REDUCE_MINUTES_PER_PARTITION);
          # predict-reduce reports the timing assumption it used.
          python scripts/construction_v1_hosted.py predict-reduce \
            --contract control/contract.json --family "$FAMILY_KEY" --inventory "$INVENTORY" \
            --ledger control/ledger.json \
            --tail-minutes "$TAIL_MINUTES" --output "dryrun/predict-${TASK_INDEX}.json"
          PARTITIONS="$(jq -r '.predicted_partitions' "dryrun/predict-${TASK_INDEX}.json")"
          JOBS="$(jq -r '.reduce_job_count' "dryrun/predict-${TASK_INDEX}.json")"
          ELAPSED=$(( SECONDS - START ))
          echo "TASK END   $TASK_ID planned_rows=$ROWS selected_uncompressed_bytes=$BYTES would_read_ranges=$RANGES predicted_partitions=$PARTITIONS reduce_jobs=$JOBS elapsed=${ELAPSED}s r2_writes=0"
          {
            echo "### dry-run map sample: \`$TASK_ID\`"
            echo "- Planned input rows: $ROWS | Selected uncompressed bytes: $BYTES | Ranges validated: $RANGES | Elapsed: ${ELAPSED}s | R2 writes: 0"
            echo "- Predicted reduce partitions: $PARTITIONS across $JOBS batch jobs (fits matrix + budget)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk before bounded map work (execute mode only)
        if: inputs.mode == 'execute'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      # Unconditional so a dry-run also certifies the binaries compile on the
      # runner (attempt 1 died here in execute mode only).
      - name: Build the pinned construction binaries
        run: cargo build --manifest-path crates/Cargo.toml -p geocoder-construction --bins --release

      - name: Admit, project, map, and publish one task create-only (execute)
        if: inputs.mode == 'execute'
        env:
          FAMILY_KEY: ${{ needs.admit.outputs.family_key }}
          TASK_ID: ${{ matrix.task_id }}
          TASK_INDEX: ${{ matrix.task_index }}
          # The map phase's intermediate store now goes to a run-scoped R2 staging
          # prefix instead of a 63.5 GB GitHub artifact. These are the SAME
          # workflow credentials finalize already uses; scoping them down to a
          # staging-only token is a tracked follow-up
          # (docs/plans/2026-07-24-construction-v1-follow-ups.md, "scope down the
          # R2 credentials used by construction-v1"). execute-only, as the
          # workflow-contract test requires of every credentialed step here.
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 25000000
          START=$SECONDS
          mkdir -p store markers work/scratch phase
          echo "TASK BEGIN $TASK_ID (family=$FAMILY_KEY index=$TASK_INDEX mode=execute)"
          # Ledger gate: prior + this map estimate must fit under the cap.
          python scripts/construction_v1_hosted.py ledger-check \
            --ledger control/ledger.json --next-phase-minutes "$MAP_PHASE_ESTIMATE_MINUTES"
          # Skip recomputation if a marker for this task already exists. With the
          # store in R2 staging the marker check is DURABLE across dispatches: the
          # staged marker is the record, so a fresh resume skips completed tasks
          # with no local store at all. The contract is required because the
          # staging prefix is derived from its request_sha256.
          python scripts/construction_v1_hosted.py admit-task \
            --store-root store --family "$FAMILY_KEY" --phase map --task-id "$TASK_ID" \
            --contract control/contract.json \
            --staging-bucket "$R2_BUCKET" --staging-endpoint-url "$R2_ENDPOINT" \
            --marker-out "markers/${TASK_INDEX}.json" \
            --output phase/admit.json >/dev/null
          COMPLETED="$(jq -r '.completed' phase/admit.json)"
          if [ "$COMPLETED" = true ]; then
            # --marker-out wrote the completed task's marker, so a SKIPPED task
            # still reaches the plan phase's fan-in. This artifact carries markers
            # only now, so a skip that emitted no marker would silently drop the
            # task from the plan.
            test -s "markers/${TASK_INDEX}.json"
            echo "TASK END   $TASK_ID already-completed=true marker_republished=true elapsed=$(( SECONDS - START ))s"
          else
            BINDIR="crates/target/release"
            RELEASE="$(jq -r '.release' control/request.json)"
            # Project the exact inventory-assigned row groups from S3 (read-only),
            # then read the authoritative projected row count from the report so
            # the transform's per-object source-limits bound is positive+exact.
            case "$FAMILY_KEY" in
              addresses)
                TRANSFORM="$BINDIR/address-transform-v1"; PROOF="$BINDIR/address-proof-directory"
                INVENTORY=benchmarks/address-construction-v1-data/inventory/addresses.json
                /usr/bin/time -v python scripts/experiment_hosted_rowgroups.py \
                  --release "$RELEASE" --family "$FAMILY_KEY" --inventory-report "$INVENTORY" \
                  --task-index "$TASK_INDEX" --output work/projected.parquet \
                  --json-out work/projection.json --target-rowgroup-uncompressed-bytes 400000000 \
                  --max-rows 4000000 --max-groups 72 --max-output-bytes 500000000
                ROWS="$(jq -r '.output.rows' work/projection.json)"
                ;;
              places)
                # P0-1: Places has its own S3 projector (nested-column flatten +
                # etag/byte identity pins verified pre- AND post-read); the
                # address row-group experiment has no Places code path.
                TRANSFORM="$BINDIR/places-transform-v1"; PROOF="$BINDIR/places-proof-directory"
                INVENTORY=benchmarks/places-construction-v1-data/inventory/places.json
                # Spec path threaded from the admission-pinned contract (see the
                # dry-run branch); never a hardcoded version constant.
                SPEC="$(jq -er '.families.places.spec' control/contract.json)"
                /usr/bin/time -v python scripts/project_places_construction_v1.py \
                  --inventory "$INVENTORY" --evidence-spec "$SPEC" \
                  --task-index "$TASK_INDEX" --output work/projected.parquet \
                  --report work/projection.json --max-rows 4000000 --max-groups 72 \
                  --max-selected-compressed-bytes 536870912 \
                  --max-selected-uncompressed-bytes 1000000000 --max-output-bytes 500000000
                ROWS="$(jq -r '.output.records' work/projection.json)"
                ;;
            esac
            test "$ROWS" -gt 0
            # Derive the transform's per-object source-limits bound from the
            # projection report so real projected locators (original row-group
            # indices) are never spuriously rejected.
            python scripts/construction_v1_hosted.py source-limits \
              --report work/projection.json --family "$FAMILY_KEY" \
              --output work/source-limits.json
            /usr/bin/time -v python scripts/construction_v1_hosted.py run-map \
              --contract control/contract.json --store-root store --family "$FAMILY_KEY" \
              --staging-bucket "$R2_BUCKET" --staging-endpoint-url "$R2_ENDPOINT" \
              --task-id "$TASK_ID" --input work/projected.parquet \
              --source-limits work/source-limits.json --transform-binary "$TRANSFORM" \
              --proof-binary "$PROOF" --scratch-dir work/scratch \
              --marker-out "markers/${TASK_INDEX}.json" --output phase/map.json
            OUT_ROWS="$(jq -r '.records' phase/map.json)"
            STAGED="$(jq -r '.staged_objects_published' phase/map.json)"
            STAGED_BYTES="$(jq -r '.staged_bytes_published' phase/map.json)"
            # A task that published no staged objects wrote its fragments nowhere
            # durable, and the artifact below no longer carries them -- so fail
            # here rather than let the plan phase discover the gap.
            test "$STAGED" -gt 0
            echo "TASK END   $TASK_ID output_records=$OUT_ROWS staged_objects=$STAGED staged_bytes=$STAGED_BYTES elapsed=$(( SECONDS - START ))s marker_written_last=true"
          fi
          ELAPSED_MIN=$(( (SECONDS - START + 59) / 60 ))
          jq -n --arg phase "map-${TASK_INDEX}" --argjson m "$ELAPSED_MIN" \
            '{phase:$phase,runner_minutes:$m}' > "phase/ledger-fragment-${TASK_INDEX}.json"

      # MARKERS AND JSON ONLY. The store itself is in R2 staging: 89 map tasks x
      # 63.5 GB of artifact traffic was the planet blocker (run 30113308268 died
      # on a 63 GB plan artifact), and a marker set is single-digit MB. Do not add
      # `store` back to this path -- that is the regression this increment exists
      # to prevent, and tests/test_construction_v1_workflow_contract.py asserts it.
      - name: Publish this map task's marker and ledger fragment (store is in R2 staging)
        if: inputs.mode == 'execute'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cv1-map-${{ matrix.task_index }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            markers
            phase/ledger-fragment-${{ matrix.task_index }}.json

  plan:
    name: Exact map fan-in and stable reducer plan
    needs: [admit, map]
    if: inputs.mode == 'execute'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      reduce_matrix: ${{ steps.plan.outputs.reduce_matrix }}
      reduce_count: ${{ steps.plan.outputs.reduce_count }}
    steps:
      - name: Check out the request-pinned producer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.admit.outputs.producer_commit }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"
      - name: Install hash-pinned hosted dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - name: Download control and every map marker (the store stays in R2 staging)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: cv1-map-*
          path: mapdl
          merge-multiple: true
      - name: Download the control artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cv1-control
          path: control
      - name: Fan in map minutes, gate the ledger, and build the reducer plan
        id: plan
        env:
          FAMILY_KEY: ${{ needs.admit.outputs.family_key }}
          MAP_TASK_COUNT: ${{ needs.admit.outputs.map_task_count }}
          # Read access to the run-scoped staging prefix: the plan phase reads map
          # packs by key to size partitions. Same reused workflow credentials as
          # map and finalize; scoping is a tracked follow-up.
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # This job reads pack BODIES (bounded to max_fan_in_packs at a time, then
          # evicted), so it needs the same free-disk floor map and reduce have. It
          # is the job run 30113308268 died on, when it downloaded a 63 GB artifact.
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 25000000
          # Fold every map job's actual minutes into the ledger, then FAIL CLOSED
          # before provisioning the reduce matrix if the total would exceed cap.
          for FRAG in mapdl/phase/ledger-fragment-*.json; do
            [ -f "$FRAG" ] || continue
            PH="$(jq -r '.phase' "$FRAG")"; MN="$(jq -r '.runner_minutes' "$FRAG")"
            python scripts/construction_v1_hosted.py ledger-append \
              --ledger control/ledger.json --phase "$PH" --minutes "$MN"
          done
          PART_ESTIMATE=$(( REDUCE_PHASE_ESTIMATE_MINUTES + HEAD_PHASE_ESTIMATE_MINUTES + FINALIZE_PHASE_ESTIMATE_MINUTES ))
          python scripts/construction_v1_hosted.py ledger-check \
            --ledger control/ledger.json --next-phase-minutes "$PART_ESTIMATE" \
            --output control/plan-ledger-check.json
          mkdir -p plan-scratch plan store
          # With the store out of the artifacts, a missing MARKER is the only way a
          # map task can silently vanish from the plan -- so count them against the
          # admitted task count instead of trusting the download.
          MARKERS="$(find mapdl/markers -maxdepth 1 -name '*.json' | wc -l)"
          if [ "$MARKERS" -ne "$MAP_TASK_COUNT" ]; then
            echo "::error::fanned in $MARKERS map markers but admission dispatched $MAP_TASK_COUNT tasks" >&2
            exit 1
          fi
          # P0-3: the reducer plan batches partitions into <=256 matrix JOBS and
          # fails closed here if the BATCHED reduce projection (job_count x the
          # per-job estimate + head/finalize tails) would exceed the ledger cap.
          TAIL_MINUTES=$(( HEAD_PHASE_ESTIMATE_MINUTES + FINALIZE_PHASE_ESTIMATE_MINUTES ))
          # --store-root is an EMPTY local cache; the packs this phase needs are
          # hydrated by key from the run-scoped staging prefix and verified against
          # the digest in the key.
          python scripts/construction_v1_hosted.py plan-reduce \
            --contract control/contract.json --store-root store --family "$FAMILY_KEY" \
            --staging-bucket "$R2_BUCKET" --staging-endpoint-url "$R2_ENDPOINT" \
            --markers-dir mapdl/markers --scratch-dir plan-scratch \
            --ledger control/ledger.json --tail-minutes "$TAIL_MINUTES" \
            --staging-report plan/staging.json \
            --output plan/plan.json --matrix-out plan/reduce-matrix.json
          # The bound that decides whether this job fits a runner: peak HYDRATED
          # input resident at once, not the total it streamed through.
          PEAK="$(jq -r '.staged_peak_resident_bytes' plan/staging.json)"
          TOTAL="$(jq -r '.staged_bytes_hydrated' plan/staging.json)"
          echo "PLAN staging: hydrated $TOTAL bytes, peak resident $PEAK bytes"
          MATRIX="$(jq -c '.' plan/reduce-matrix.json)"
          COUNT="$(jq '.include | length' <<<"$MATRIX")"
          if [ "$COUNT" -gt 256 ]; then echo "reduce matrix exceeds 256 cap" >&2; exit 1; fi
          PARTITIONS="$(jq -r '.reduce_execution.partition_count' plan/plan.json)"
          BATCH_SIZE="$(jq -r '.reduce_execution.batch_size' plan/plan.json)"
          # Places jobs own a contiguous SHUFFLE-BUCKET range (each reads its own
          # map fragments once); addresses still batch contiguous partitions.
          OWNERSHIP="$(jq -r '.reduce_execution.ownership // "partition-batch"' plan/plan.json)"
          STRIDE="$(jq -r '.reduce_execution.bucket_stride // "n/a"' plan/plan.json)"
          {
            echo "reduce_matrix=$MATRIX"
            echo "reduce_count=$COUNT"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Reducer plan"
            echo "- Reduce partitions: $PARTITIONS across $COUNT jobs, owned by $OWNERSHIP (largest job $BATCH_SIZE partitions, bucket stride $STRIDE, matrix cap 256)"
          } >> "$GITHUB_STEP_SUMMARY"
      # Plan, markers, and the ledger. No store: this artifact WAS the 63.5 GB one
      # every reduce batch downloaded whole.
      - name: Publish the plan, markers, and updated ledger (store is in R2 staging)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cv1-plan
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            plan
            mapdl/markers
            control/ledger.json

  reduce:
    name: ${{ needs.admit.outputs.family_key }} reduce batch ${{ matrix.batch_index }}
    needs: [admit, plan]
    if: inputs.mode == 'execute'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.admit.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.reduce_matrix) }}
    steps:
      - name: Check out the request-pinned producer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.admit.outputs.producer_commit }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"
      - name: Install hash-pinned hosted dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - name: Download the plan and markers (the store stays in R2 staging)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cv1-plan
          path: cv1
      - name: Build the pinned construction binaries
        run: cargo build --manifest-path crates/Cargo.toml -p geocoder-construction --bins --release
      - name: Run one selective reducer batch create-only
        env:
          FAMILY_KEY: ${{ needs.admit.outputs.family_key }}
          BATCH_INDEX: ${{ matrix.batch_index }}
          # A Places reduce job owns a shuffle-bucket RANGE, so with the store in
          # staging it fetches ONLY the fragments in its own range instead of the
          # whole 63.5 GB store. That is the change that makes reduce startable.
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 30000000
          START=$SECONDS
          mkdir -p reductions reduce-scratch phase store
          python scripts/construction_v1_hosted.py ledger-check \
            --ledger cv1/control/ledger.json --next-phase-minutes "$REDUCE_PHASE_ESTIMATE_MINUTES"
          echo "REDUCE BEGIN $FAMILY_KEY batch=$BATCH_INDEX"
          BINDIR="crates/target/release"
          case "$FAMILY_KEY" in
            addresses) PROOF="$BINDIR/address-proof-directory"; ENC="$BINDIR/address-serving-encode-v1"; VER="$BINDIR/address-serving-verify-v1" ;;
            places)    PROOF=""; ENC="$BINDIR/places-serving-encode-v1"; VER="$BINDIR/places-serving-verify-v1" ;;
          esac
          # P0-3: one matrix job reduces a contiguous BATCH of partitions serially,
          # writing one create-only serving object + marker per partition into
          # reductions/. The ledger fragment records this job's real elapsed time.
          /usr/bin/time -v python scripts/construction_v1_hosted.py run-reduce \
            --contract cv1/control/contract.json --store-root store --family "$FAMILY_KEY" \
            --staging-bucket "$R2_BUCKET" --staging-endpoint-url "$R2_ENDPOINT" \
            --plan cv1/plan/plan.json --markers-dir cv1/mapdl/markers \
            --batch-index "$BATCH_INDEX" --proof-binary "$PROOF" \
            --encoder-binary "$ENC" --verifier-binary "$VER" --scratch-dir reduce-scratch \
            --staging-report "phase/staging-${BATCH_INDEX}.json" \
            --output-dir reductions
          echo "REDUCE staging: $(jq -c '{staged_bytes_hydrated,staged_peak_resident_bytes}' "phase/staging-${BATCH_INDEX}.json")"
          echo "REDUCE END $FAMILY_KEY batch=$BATCH_INDEX elapsed=$(( SECONDS - START ))s marker_written_last=true"
          ELAPSED_MIN=$(( (SECONDS - START + 59) / 60 ))
          jq -n --arg phase "reduce-batch-${BATCH_INDEX}" --argjson m "$ELAPSED_MIN" \
            '{phase:$phase,runner_minutes:$m}' > "phase/ledger-fragment-${BATCH_INDEX}.json"
      # Reductions and the ledger fragment only. The serving objects this batch
      # produced are in R2 staging, named by key inside the reduction JSON; the
      # store re-upload was the second-largest leg of the ~33 TB artifact total.
      - name: Publish this reducer batch's reductions and ledger fragment (objects are in R2 staging)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cv1-reduce-${{ matrix.batch_index }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            reductions
            phase/ledger-fragment-${{ matrix.batch_index }}.json

  head:
    name: Global Places head (execute)
    needs: [admit, plan, reduce]
    if: inputs.mode == 'execute'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Check out the request-pinned producer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.admit.outputs.producer_commit }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"
      - name: Install hash-pinned hosted dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - name: Download every reduce fragment (reductions only; objects are in R2 staging)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: cv1-reduce-*
          path: cv1
          merge-multiple: true
      - name: Download the plan artifact (plan.json, markers, ledger)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cv1-plan
          path: cv1plan
      - name: Build the global Places head (address is a no-op)
        env:
          FAMILY_KEY: ${{ needs.admit.outputs.family_key }}
          # Head reads the per-task head candidates (already bounded) by key from
          # the run-scoped staging prefix, instead of downloading every reduce
          # artifact's copy of the whole store.
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # The last phase without a free-disk floor. Head hydrates EVERY task's
          # head-candidate pack and hands them to one read_parquet, so it cannot
          # batch-and-evict the way plan does; the floor is the only guard it has.
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 25000000
          mkdir -p head head-scratch store
          if [ "$FAMILY_KEY" = places ]; then
            cargo build --manifest-path crates/Cargo.toml -p geocoder-construction --bins --release
            python scripts/construction_v1_hosted.py ledger-check \
              --ledger cv1plan/control/ledger.json --next-phase-minutes "$HEAD_PHASE_ESTIMATE_MINUTES"
            BINDIR="crates/target/release"
            python scripts/construction_v1_hosted.py run-head \
              --contract cv1plan/control/contract.json --store-root store \
              --staging-bucket "$R2_BUCKET" --staging-endpoint-url "$R2_ENDPOINT" \
              --family places --markers-dir cv1plan/mapdl/markers \
              --encoder-binary "$BINDIR/places-serving-encode-v1" \
              --verifier-binary "$BINDIR/places-serving-verify-v1" \
              --staging-report head/staging.json \
              --scratch-dir head-scratch --shard-bits 12 --output head/head.json
            echo "HEAD staging: $(jq -c '{staged_bytes_hydrated,staged_peak_resident_bytes}' head/staging.json)"
            echo "HEAD END places shards=$(jq -r '.shard_count' head/head.json) marker_written_last=true"
          else
            python scripts/construction_v1_hosted.py run-head \
              --contract cv1plan/control/contract.json --store-root store \
              --staging-bucket "$R2_BUCKET" --staging-endpoint-url "$R2_ENDPOINT" \
              --family addresses --markers-dir cv1plan/mapdl/markers \
              --staging-report head/staging.json --output head/head.json
            echo "Address family has no global head phase."
          fi
      - name: Publish the head result (its shards are in R2 staging)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cv1-head
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            head

  finalize:
    name: Finalize the non-promoting slice, create-only to R2, marker last
    needs: [admit, plan, reduce, head]
    if: inputs.mode == 'execute'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out the request-pinned producer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.admit.outputs.producer_commit }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"
      - name: Install hash-pinned hosted dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - name: Download all reduce fragments
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: cv1-reduce-*
          path: red
          merge-multiple: true
      - name: Download the head artifact (head.json; its shards are in R2 staging)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cv1-head
          path: headdl
      - name: Download the plan artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cv1-plan
          path: cv1plan
      - name: Fan in reduce minutes, gate, finalize locally, verify the whole slice once
        env:
          FAMILY_KEY: ${{ needs.admit.outputs.family_key }}
          # Finalize hydrates the exact published set by key from the run-scoped
          # staging prefix (serving objects, head shards, per-record packs) and
          # verifies each against the digest in its key before mirroring it.
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Finalize hydrates the whole published set (routed shards, head shards,
          # per-record packs) and then mirrors it, so it holds two copies of the
          # slice at once. Same free-disk floor as every other phase.
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 25000000
          for FRAG in red/phase/ledger-fragment-*.json; do
            [ -f "$FRAG" ] || continue
            PH="$(jq -r '.phase' "$FRAG")"; MN="$(jq -r '.runner_minutes' "$FRAG")"
            python scripts/construction_v1_hosted.py ledger-append \
              --ledger cv1plan/control/ledger.json --phase "$PH" --minutes "$MN"
          done
          python scripts/construction_v1_hosted.py ledger-check \
            --ledger cv1plan/control/ledger.json --next-phase-minutes "$FINALIZE_PHASE_ESTIMATE_MINUTES"
          mkdir -p final-work publish store
          HEAD_ARG=""
          if [ "$FAMILY_KEY" = places ]; then HEAD_ARG="--head headdl/head/head.json"; fi
          # --store-root is an EMPTY local cache. Every object in the published set
          # is named by key in the reductions, head result and map markers, and is
          # hydrated from the run-scoped R2 staging prefix and verified against the
          # digest in its key. --remote-root is the LOCAL publish tree the next step
          # mirrors to R2; it is deliberately not called "staging" any more, because
          # `staging/` now means the R2 intermediate prefix.
          python scripts/construction_v1_hosted.py finalize \
            --contract cv1plan/control/contract.json --store-root store \
            --staging-bucket "$R2_BUCKET" --staging-endpoint-url "$R2_ENDPOINT" \
            --family "$FAMILY_KEY" --plan cv1plan/plan/plan.json --reductions-dir red/reductions \
            --markers-dir cv1plan/mapdl/markers \
            $HEAD_ARG --remote-root publish --work-root final-work --output final-work/result.json
          echo "FINALIZE local staging complete: $(jq -c '{objects,reconciles,marker_key,serving_objects,positions_objects,staged_objects_hydrated}' final-work/result.json)"
          # A published slice with no SERVING payload is the defect this gate
          # exists for: places reductions record `routed_object`, not `artifact`,
          # so finalize used to drop every .plrv while `objects`, `reconciles` and
          # `positions_objects` all stayed non-zero.
          # The EXACT set, the same equality the slice-smoke jobs assert: one
          # routed object per reduction, one shard per POPULATED head shard, and
          # the head MANIFEST that maps shard ids to those content-addressed shard
          # objects (without it the shards are unroutable).
          # `-ge` would have accepted a slice that published the routed objects and
          # no head shards at all, which is the other half of the same defect.
          # Addresses have no head phase, so head.json carries `head: null` and
          # both POP and MANIFESTS resolve to 0 through the same expressions.
          SERVING="$(jq -r '.serving_objects' final-work/result.json)"
          REDUCTIONS="$(jq -r '.reduction_serving_objects' final-work/result.json)"
          # `-e` + `| numbers`, not `-r` + `// 0`: bash arithmetic reads an absent
          # key's "null" as 0, which would turn a MISSING manifest into a passing
          # gate -- the same permissive-default failure the residency gate below
          # calls out. An absent or non-numeric key exits non-zero here instead.
          MANIFESTS="$(jq -er '.head_manifest_objects | numbers' final-work/result.json)"
          POP=0
          if [ -f headdl/head/head.json ]; then
            POP="$(jq -r '.populated_shards // 0' headdl/head/head.json)"
          fi
          test "$SERVING" -eq "$(( REDUCTIONS + POP + MANIFESTS ))"
          test "$SERVING" -gt 0
          # The residency bound, asserted where it actually decides whether a planet
          # run finishes. Finalize used to build its exact set out of
          # `store.path(...)` calls, so every published object was hydrated onto this
          # runner before the first upload and NOTHING was released anywhere in the
          # phase -- 13-18 GB at planet scale (a ~10-11 GB head payload plus 3.3-6.7
          # GB of positions packs), on the last job of a multi-hour run. It now
          # hydrates, verifies, uploads and evicts one object at a time.
          #
          # Three keys, each covering a different way the bound can silently go:
          #   hydrated  > 0 -- finalize really read its inputs from R2 staging. Its
          #                    --store-root is an EMPTY cache, so 0 would mean it
          #                    found a store it should not have had.
          #   released  > 0 -- it EVICTED them. Hydrating and never releasing is
          #                    precisely the old behaviour, and it is invisible in
          #                    every other number here.
          #   peak < hydrated -- the assertable form of "one object at a time".
          #                    Eager hydration makes peak == hydrated exactly.
          #
          # FAIL CLOSED on a missing or non-numeric key: `| numbers` yields empty for
          # anything that is not a JSON number, so `jq -e` exits 4 (no output) rather
          # than comparing. Deliberately NOT the `// 0` shape used for POP above -- a
          # permissive default turns an ABSENT key into a passing bound, which is the
          # exact failure mode this gate exists to prevent.
          jq -e '
            (.staged_objects_hydrated | numbers) > 0
            and (.staged_objects_released | numbers) > 0
            and ((.staged_peak_resident_bytes | numbers) < (.staged_bytes_hydrated | numbers))
          ' final-work/result.json >/dev/null || {
            echo "Finalize is not bounded: it did not hydrate, evict and publish one object at a time." >&2
            jq -c '{staged_objects_hydrated,staged_objects_released,staged_peak_resident_bytes,staged_bytes_hydrated}' \
              final-work/result.json >&2 || echo "(no staging evidence in final-work/result.json)" >&2
            echo "peak == hydrated with nothing released is eager hydration, which OOMs the planet finalize job." >&2
            exit 1
          }
      - name: Mirror the exact staged slice to R2 create-only, marker written last
        env:
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          MARKER_KEY="$(jq -r '.marker_key' final-work/result.json)"
          # Upload every non-marker object create-only (If-None-Match '*'),
          # HEAD-verify, then the completion marker LAST.
          find publish -type f ! -path "publish/${MARKER_KEY}" | sort | while read -r FILE; do
            KEY="${FILE#publish/}"
            aws s3api put-object --bucket "$R2_BUCKET" --key "$KEY" --body "$FILE" \
              --if-none-match '*' --endpoint-url "$R2_ENDPOINT" --region auto >/dev/null \
              || aws s3api head-object --bucket "$R2_BUCKET" --key "$KEY" \
                   --endpoint-url "$R2_ENDPOINT" --region auto >/dev/null
            aws s3api head-object --bucket "$R2_BUCKET" --key "$KEY" \
              --endpoint-url "$R2_ENDPOINT" --region auto >/dev/null
          done
          aws s3api put-object --bucket "$R2_BUCKET" --key "$MARKER_KEY" \
            --body "publish/${MARKER_KEY}" --if-none-match '*' \
            --endpoint-url "$R2_ENDPOINT" --region auto >/dev/null \
            || aws s3api head-object --bucket "$R2_BUCKET" --key "$MARKER_KEY" \
                 --endpoint-url "$R2_ENDPOINT" --region auto >/dev/null
          aws s3api head-object --bucket "$R2_BUCKET" --key "$MARKER_KEY" \
            --endpoint-url "$R2_ENDPOINT" --region auto >/dev/null
          echo "R2 create-only mirror complete; marker written last: $MARKER_KEY"
      - name: Publish the final ledger for future resume accounting
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: construction-v1-ledger-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: cv1plan/control/ledger.json
      - name: Final run summary (diagnosable from the Actions UI)
        if: always()
        env:
          FAMILY_KEY: ${{ needs.admit.outputs.family_key }}
        run: |
          {
            echo "## Construction v1 run result"
            echo
            echo "- Family: \`$FAMILY_KEY\` | Request: \`${{ needs.admit.outputs.request_sha256 }}\`"
            echo "- Map tasks: ${{ needs.admit.outputs.map_task_count }} | Reduce jobs: ${{ needs.plan.outputs.reduce_count }}"
            echo "- Max concurrency: ${{ needs.admit.outputs.max_parallel }} | Cap: ${{ needs.admit.outputs.max_total_runner_minutes }} runner-min | Prior: ${{ needs.admit.outputs.prior_runner_minutes }}"
            echo "- Consumed runner minutes (ledger): $(jq -r '(.prior_runner_minutes // 0) + ([.phases[].runner_minutes] | add // 0)' cv1plan/control/ledger.json 2>/dev/null || echo unavailable)"
            echo "- Slice: immutable, NON-PROMOTING; completion marker create-only and written last"
            echo "- Resume rule: fresh workflow_dispatch only; never Re-run failed jobs"
          } >> "$GITHUB_STEP_SUMMARY"
