name: Construction v1 planet build

# Hosted map/reduce/head/finalize for the isolated construction-v1 Address +
# Places contract. This workflow creates only an immutable, NON-PROMOTING slice
# under a request-derived namespace. It never writes either production catalog,
# never writes production release history, and never promotes. Promotion is a
# separate operator-reviewed decision.
#
# The very first job is a secret-free fail-closed admission gate:
# scripts/construction_v1_control.py admit-dispatch independently regenerates the
# canonical request from the submitted request bytes and rejects any changed
# byte, hash, typed confirmation, readiness result, or run attempt other than 1.
# A stale or mismatched request SHA therefore fails in that first job before any
# credential is touched.
#
# dry-run  -> planning + admission + a bounded sample of map tasks, no R2 writes.
# execute  -> the real non-promoting slice with create-only R2 writes and a
#             completion marker written last.
#
# Resume is always a FRESH workflow_dispatch (never GitHub "Re-run failed jobs"):
# supply resume_from with the prior run id and an updated, limit-bound
# confirmation. run_attempt must be 1; the admission gate rejects any re-run.
on:
  workflow_dispatch:
    inputs:
      family:
        description: Which family to build in this run.
        required: true
        type: choice
        options: [address, places]
      mode:
        description: Read-only planning dry-run, or the resumable non-promoting execute slice.
        required: true
        type: choice
        options: [dry-run, execute]
      confirmation:
        description: The FULL typed EXECUTE_CONSTRUCTION_V1::<request-sha>::MODE=execute::MAX_PARALLEL=..::MAX_TOTAL_RUNNER_MINUTES=..::PRIOR_RUNNER_MINUTES=..::MAX_COST_USD=.. string emitted by construction_v1_control.py.
        required: true
        type: string
      request_json:
        description: The canonical one-line request JSON (the ".request" object from the reviewed prepare package); the admission gate re-derives and byte-verifies it against the confirmation SHA.
        required: true
        type: string
      resume_from:
        description: Optional prior run identifier for fresh-dispatch resume accounting; leave blank for a first attempt.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # One in-flight run per (request, family). Never cancel an in-progress slice.
  group: construction-v1-${{ inputs.family }}-${{ inputs.confirmation }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  R2_BUCKET: geocoder-shards
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  admit:
    name: Fail-closed admission and map matrix (no secrets)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      request_sha256: ${{ steps.gate.outputs.request_sha256 }}
      family_key: ${{ steps.gate.outputs.family_key }}
      max_parallel: ${{ steps.gate.outputs.max_parallel }}
      max_total_runner_minutes: ${{ steps.gate.outputs.max_total_runner_minutes }}
      prior_runner_minutes: ${{ steps.gate.outputs.prior_runner_minutes }}
      max_cost_usd: ${{ steps.gate.outputs.max_cost_usd }}
      producer_commit: ${{ steps.gate.outputs.producer_commit }}
      map_matrix: ${{ steps.gate.outputs.map_matrix }}
      sample_matrix: ${{ steps.gate.outputs.sample_matrix }}
      map_task_count: ${{ steps.gate.outputs.map_task_count }}
    steps:
      - name: Check out dispatched main without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"

      - name: Install hash-pinned admission dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"

      - name: Regenerate the canonical request and enforce the typed confirmation
        id: gate
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUEST_JSON: ${{ inputs.request_json }}
          FAMILY: ${{ inputs.family }}
          RESUME_FROM: ${{ inputs.resume_from }}
        run: |
          set -euo pipefail
          mkdir -p control
          printf '%s\n' "$REQUEST_JSON" > control/request.json

          # Parse the durable limits out of the typed confirmation. The gate
          # below still re-derives and byte-compares the whole confirmation, so
          # this parse is only used to expose the numbers to later jobs.
          case "$CONFIRMATION" in
            EXECUTE_CONSTRUCTION_V1::*) : ;;
            *) echo "confirmation is not an EXECUTE_CONSTRUCTION_V1 string" >&2; exit 1 ;;
          esac
          REQUEST_SHA256="$(printf '%s' "$CONFIRMATION" | awk -F'::' '{print $2}')"
          MAX_PARALLEL="$(printf '%s' "$CONFIRMATION" | sed -n 's/.*MAX_PARALLEL=\([0-9]*\).*/\1/p')"
          MAX_TOTAL="$(printf '%s' "$CONFIRMATION" | sed -n 's/.*MAX_TOTAL_RUNNER_MINUTES=\([0-9]*\).*/\1/p')"
          PRIOR="$(printf '%s' "$CONFIRMATION" | sed -n 's/.*PRIOR_RUNNER_MINUTES=\([0-9]*\).*/\1/p')"
          MAX_COST="$(printf '%s' "$CONFIRMATION" | sed -n 's/.*MAX_COST_USD=\([0-9.]*\).*/\1/p')"
          case "$MAX_PARALLEL" in ''|*[!0-9]*) echo "unparseable MAX_PARALLEL" >&2; exit 1 ;; esac
          if [ "$MAX_PARALLEL" -lt 1 ] || [ "$MAX_PARALLEL" -gt 8 ]; then
            echo "MAX_PARALLEL must be 1..8" >&2; exit 1
          fi

          case "$FAMILY" in
            address) FAMILY_KEY=addresses ;;
            places)  FAMILY_KEY=places ;;
            *) echo "unknown family $FAMILY" >&2; exit 1 ;;
          esac

          # Fail-closed admission: regenerates the request from its bytes,
          # rejects any changed byte/hash/confirmation/readiness, requires
          # run_attempt == 1, and writes both family map matrices to matrices.env.
          python scripts/construction_v1_control.py admit-dispatch \
            --request control/request.json \
            --request-sha256 "$REQUEST_SHA256" \
            --confirmation "$CONFIRMATION" \
            --run-attempt '${{ github.run_attempt }}' \
            --github-output control/matrices.env

          # Select this run's family matrix and a bounded dry-run sample (<=3).
          MAP_MATRIX="$(sed -n "s/^${FAMILY_KEY}_matrix=//p" control/matrices.env)"
          test -n "$MAP_MATRIX"
          MAP_COUNT="$(jq '.include | length' <<<"$MAP_MATRIX")"
          if [ "$MAP_COUNT" -gt 256 ]; then
            echo "map matrix has $MAP_COUNT entries; exceeds the 256 matrix cap (chunk required)" >&2
            exit 1
          fi
          SAMPLE_MATRIX="$(jq -c '{include: (.include[0:3])}' <<<"$MAP_MATRIX")"

          PRODUCER="$(jq -er '.producer_commit' control/request.json)"

          {
            echo "request_sha256=$REQUEST_SHA256"
            echo "family_key=$FAMILY_KEY"
            echo "max_parallel=$MAX_PARALLEL"
            echo "max_total_runner_minutes=$MAX_TOTAL"
            echo "prior_runner_minutes=$PRIOR"
            echo "max_cost_usd=$MAX_COST"
            echo "producer_commit=$PRODUCER"
            echo "map_matrix=$MAP_MATRIX"
            echo "sample_matrix=$SAMPLE_MATRIX"
            echo "map_task_count=$MAP_COUNT"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Construction v1 admission"
            echo
            echo "- Family: \`$FAMILY_KEY\`"
            echo "- Mode: \`${{ inputs.mode }}\`"
            echo "- Request SHA-256: \`$REQUEST_SHA256\`"
            echo "- Map tasks: $MAP_COUNT (dry-run sample: $(jq '.include | length' <<<"$SAMPLE_MATRIX"))"
            echo "- Max concurrency: $MAX_PARALLEL"
            echo "- Retained runner-minute cap: $MAX_TOTAL"
            echo "- Prior runner minutes (confirmation-bound): $PRIOR"
            echo "- Conservative cost cap: \$$MAX_COST"
            echo "- Resume-from: \`${RESUME_FROM:-<none>}\`"
            echo "- Run attempt: ${{ github.run_attempt }} (admission requires 1; resume is a fresh dispatch)"
            echo "- Production catalog writes: forbidden; slice is non-promoting"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Seed the run ledger (genesis + retained prior minutes)
        run: |
          set -euo pipefail
          mkdir -p control
          jq -n \
            --arg phase admission \
            --arg family '${{ steps.gate.outputs.family_key }}' \
            --arg request '${{ steps.gate.outputs.request_sha256 }}' \
            --argjson prior '${{ steps.gate.outputs.prior_runner_minutes }}' \
            --argjson cap '${{ steps.gate.outputs.max_total_runner_minutes }}' \
            --arg resume '${{ inputs.resume_from }}' \
            --arg run '${{ github.run_id }}-${{ github.run_attempt }}' \
            '{schema:"construction-v1-run-ledger-v1",run:$run,resume_from:$resume,request_sha256:$request,family:$family,max_total_runner_minutes:$cap,prior_runner_minutes:$prior,phases:[{phase:$phase,runner_minutes:0,note:"secret-free admission gate"}]}' \
            > control/ledger.json
          cat control/ledger.json

      - name: Retain admission ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: construction-v1-admission-${{ steps.gate.outputs.request_sha256 }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            control/request.json
            control/ledger.json

  map:
    name: ${{ needs.admit.outputs.family_key }} map ${{ matrix.task_index }}
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.admit.outputs.max_parallel) }}
      matrix: ${{ fromJSON(inputs.mode == 'execute' && needs.admit.outputs.map_matrix || needs.admit.outputs.sample_matrix) }}
    steps:
      - name: Check out the request-pinned producer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.admit.outputs.producer_commit }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"
      - name: Install hash-pinned hosted dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"

      - name: Re-run the fail-closed admission gate on this runner (no secrets)
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          set -euo pipefail
          mkdir -p control work/output work/scratch
          printf '%s\n' "$REQUEST_JSON" > control/request.json
          python scripts/construction_v1_control.py admit-dispatch \
            --request control/request.json \
            --request-sha256 '${{ needs.admit.outputs.request_sha256 }}' \
            --confirmation "$CONFIRMATION" \
            --run-attempt '${{ github.run_attempt }}'

      - name: Free disk before bounded map work (execute mode only)
        if: inputs.mode == 'execute'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Bounded planning sample for one map task (dry-run, no R2 writes)
        if: inputs.mode != 'execute'
        env:
          FAMILY_KEY: ${{ needs.admit.outputs.family_key }}
          TASK_ID: ${{ matrix.task_id }}
          TASK_INDEX: ${{ matrix.task_index }}
        run: |
          set -euo pipefail
          START=$SECONDS
          echo "TASK BEGIN $TASK_ID (family=$FAMILY_KEY index=$TASK_INDEX mode=dry-run)"
          case "$FAMILY_KEY" in
            addresses) INVENTORY=benchmarks/address-construction-v1-data/inventory/addresses.json ;;
            places)    INVENTORY=benchmarks/places-construction-v1-data/inventory/places.json ;;
          esac
          # Read-only: re-derive the exact task descriptor (rows, selected bytes,
          # ranges, digests) that execute mode would hydrate. No S3 fetch, no R2.
          TASK="$(jq -c --arg id "$TASK_ID" \
            'def tasks: (.map_plan.tasks // .plan.tasks // (.checks.canonical_inventory_identity.tasks)); [tasks[]] | .[] | select(("'"$FAMILY_KEY"'"|sub("es$";"")) as $_ | true)' \
            "$INVENTORY" 2>/dev/null || echo '{}')"
          ROWS="$(jq -r --argjson i "$TASK_INDEX" 'def tasks: (.map_plan.tasks // .plan.tasks // .checks.canonical_inventory_identity.tasks); (tasks[$i] | (.rows // .expected_input_records)) // "unknown"' "$INVENTORY" 2>/dev/null || echo unknown)"
          BYTES="$(jq -r --argjson i "$TASK_INDEX" 'def tasks: (.map_plan.tasks // .plan.tasks // .checks.canonical_inventory_identity.tasks); (tasks[$i].selected_uncompressed_bytes) // "unknown"' "$INVENTORY" 2>/dev/null || echo unknown)"
          ELAPSED=$(( SECONDS - START ))
          echo "TASK END   $TASK_ID planned_rows=$ROWS selected_uncompressed_bytes=$BYTES elapsed=${ELAPSED}s r2_writes=0"
          {
            echo "### dry-run map sample: \`$TASK_ID\`"
            echo "- Planned input rows: $ROWS"
            echo "- Selected uncompressed bytes: $BYTES"
            echo "- Elapsed: ${ELAPSED}s"
            echo "- R2 writes: 0 (planning-only sample)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Admit, map, and publish one task create-only with marker last (execute)
        if: inputs.mode == 'execute'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TASK_ID: ${{ matrix.task_id }}
          TASK_INDEX: ${{ matrix.task_index }}
          FAMILY_KEY: ${{ needs.admit.outputs.family_key }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 25000000
          START=$SECONDS
          echo "TASK BEGIN $TASK_ID (family=$FAMILY_KEY index=$TASK_INDEX mode=execute)"
          # Admit an already-completed marker before recomputing so a fresh
          # resume dispatch loses at most the one interrupted logical subtask.
          python scripts/global_v2_hosted.py admit-task \
            --contract control/contract.json --runtime control/runtime.json \
            --phase map --family "$FAMILY_KEY" --task-id "$TASK_ID" --index "$TASK_INDEX" \
            --marker-only --output control/task-admission.json
          if [ "$(jq -r '.completed' control/task-admission.json)" = true ]; then
            echo "TASK END   $TASK_ID already-completed=true elapsed=$(( SECONDS - START ))s"
            exit 0
          fi
          # Vectorized map producer -> local packs + proofs, then create-only
          # upload under the content-addressed namespace with the marker last.
          python scripts/global_v2_hosted.py publish-map \
            --contract control/contract.json --runtime control/runtime.json \
            --request control/request.json --family "$FAMILY_KEY" \
            --task-index "$TASK_INDEX" --producer-report work/completion.json \
            --producer-output-root work/output --scratch-dir work/scratch \
            --output work/published.json
          ROWS="$(jq -r '.output_records // .records // "unknown"' work/published.json 2>/dev/null || echo unknown)"
          BYTES="$(jq -r '.output_bytes // "unknown"' work/published.json 2>/dev/null || echo unknown)"
          ELAPSED=$(( SECONDS - START ))
          echo "TASK END   $TASK_ID output_records=$ROWS output_bytes=$BYTES elapsed=${ELAPSED}s marker_written_last=true"
          {
            echo "### map task \`$TASK_ID\`"
            echo "- Output records: $ROWS"
            echo "- Output bytes: $BYTES"
            echo "- Elapsed: ${ELAPSED}s"
            echo "- Create-only marker written last: yes"
          } >> "$GITHUB_STEP_SUMMARY"

  reduce:
    name: ${{ matrix.family }} reduce ${{ matrix.index }}
    needs: [admit, map]
    if: inputs.mode == 'execute'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.admit.outputs.max_parallel) }}
      matrix:
        include:
          - family: ${{ needs.admit.outputs.family_key }}
            index: 0
    steps:
      - name: Check out the request-pinned producer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.admit.outputs.producer_commit }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"
      - name: Install hash-pinned hosted dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - name: Free disk before the selective reducer
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Restore exact plans and run one budgeted reducer create-only
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUEST_JSON: ${{ inputs.request_json }}
          FAMILY: ${{ matrix.family }}
          INDEX: ${{ matrix.index }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 30000000
          START=$SECONDS
          mkdir -p control plans work
          printf '%s\n' "$REQUEST_JSON" > control/request.json
          # Re-run the fail-closed admission gate before touching credentials.
          python scripts/construction_v1_control.py admit-dispatch \
            --request control/request.json \
            --request-sha256 '${{ needs.admit.outputs.request_sha256 }}' \
            --confirmation "$CONFIRMATION" --run-attempt '${{ github.run_attempt }}'
          echo "REDUCE BEGIN $FAMILY index=$INDEX"
          python scripts/global_v2_hosted.py admit-task \
            --contract control/contract.json --runtime control/runtime.json \
            --phase reduce --family "$FAMILY" --task-id "$FAMILY-reduce-000" \
            --index "$INDEX" --marker-only --output control/task-admission.json
          if [ "$(jq -r '.completed' control/task-admission.json)" = true ]; then
            echo "REDUCE END $FAMILY index=$INDEX already-completed=true elapsed=$(( SECONDS - START ))s"
            exit 0
          fi
          python scripts/global_v2_hosted.py restore-reducer-plans \
            --contract control/contract.json --runtime control/runtime.json \
            --output-root plans \
            --output-prefix "$(jq -r '.namespaces.immutable_root+"/aggregate-plan"' control/request.json)" \
            --output control/restored-plans.json
          python scripts/global_v2_hosted.py run-publish-reduce \
            --contract control/contract.json --runtime control/runtime.json \
            --request control/request.json --family "$FAMILY" --index "$INDEX" \
            --work-root work --output control/reduce-result.json
          echo "REDUCE END $FAMILY index=$INDEX elapsed=$(( SECONDS - START ))s marker_written_last=true"

  head:
    name: Selective reduce fan-in and global Places head
    needs: [admit, reduce]
    if: inputs.mode == 'execute'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Check out the request-pinned producer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.admit.outputs.producer_commit }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"
      - name: Install hash-pinned hosted dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - name: Build and publish the global head create-only (Places), marker last
        if: needs.admit.outputs.family_key == 'places'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUEST_JSON: ${{ inputs.request_json }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          START=$SECONDS
          mkdir -p control plans head-work
          printf '%s\n' "$REQUEST_JSON" > control/request.json
          python scripts/construction_v1_control.py admit-dispatch \
            --request control/request.json \
            --request-sha256 '${{ needs.admit.outputs.request_sha256 }}' \
            --confirmation "$CONFIRMATION" --run-attempt '${{ github.run_attempt }}'
          echo "HEAD BEGIN places-head-000"
          python scripts/global_v2_hosted.py admit-task \
            --contract control/contract.json --runtime control/runtime.json \
            --phase head --family places --task-id places-head-000 --index 0 \
            --marker-only --output control/task-admission.json
          if [ "$(jq -r '.completed' control/task-admission.json)" = true ]; then
            echo "HEAD END already-completed=true elapsed=$(( SECONDS - START ))s"
            exit 0
          fi
          python scripts/global_v2_hosted.py run-publish-head \
            --contract control/contract.json --runtime control/runtime.json \
            --request control/request.json --places-plan plans/places-plan.json \
            --work-root head-work --output control/head-result.json
          echo "HEAD END places-head-000 elapsed=$(( SECONDS - START ))s marker_written_last=true"
      - name: No global head for the address family
        if: needs.admit.outputs.family_key != 'places'
        run: echo "Address family has no global head phase; nothing to build."

  finalize:
    name: Finalize the non-promoting slice with the marker written last
    needs: [admit, map, reduce, head]
    if: inputs.mode == 'execute'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out the request-pinned producer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.admit.outputs.producer_commit }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"
      - name: Install hash-pinned hosted dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - name: Free disk before streaming finalization
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Finalize, verify the whole slice once, and write the marker last
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUEST_JSON: ${{ inputs.request_json }}
          FAMILY_KEY: ${{ needs.admit.outputs.family_key }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 30000000
          START=$SECONDS
          mkdir -p control plans final-work preview
          printf '%s\n' "$REQUEST_JSON" > control/request.json
          python scripts/construction_v1_control.py admit-dispatch \
            --request control/request.json \
            --request-sha256 '${{ needs.admit.outputs.request_sha256 }}' \
            --confirmation "$CONFIRMATION" --run-attempt '${{ github.run_attempt }}'
          echo "FINALIZE BEGIN family=$FAMILY_KEY"
          # Stream final family encoders to local artifacts, then create-only
          # publish the family manifest and slice manifest. The completion
          # marker is written last (construction_v1_remote create-only contract:
          # create-only objects, per-upload HEAD verification, marker last, one
          # exact-prefix listing + one streaming read per final object).
          python scripts/global_v2_hosted.py finalize-publish-families \
            --contract control/contract.json --request control/request.json \
            --family "$FAMILY_KEY" --work-root final-work \
            --output control/family-results.json
          ELAPSED=$(( SECONDS - START ))
          echo "FINALIZE END family=$FAMILY_KEY elapsed=${ELAPSED}s"
      - name: Final run summary (diagnosable from the Actions UI)
        if: always()
        env:
          FAMILY_KEY: ${{ needs.admit.outputs.family_key }}
        run: |
          {
            echo "## Construction v1 run result"
            echo
            echo "- Family: \`$FAMILY_KEY\`"
            echo "- Request SHA-256: \`${{ needs.admit.outputs.request_sha256 }}\`"
            echo "- Map tasks: ${{ needs.admit.outputs.map_task_count }}"
            echo "- Max concurrency: ${{ needs.admit.outputs.max_parallel }}"
            echo "- Retained runner-minute cap: ${{ needs.admit.outputs.max_total_runner_minutes }}"
            echo "- Prior retained runner minutes: ${{ needs.admit.outputs.prior_runner_minutes }}"
            echo "- Conservative cost cap: \$${{ needs.admit.outputs.max_cost_usd }}"
            echo "- Slice: immutable, NON-PROMOTING (no catalog or release-history write)"
            echo "- Completion marker: create-only, written last"
            echo "- Resume rule: fresh workflow_dispatch only; never Re-run failed jobs"
          } >> "$GITHUB_STEP_SUMMARY"
