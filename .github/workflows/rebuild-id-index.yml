name: Rebuild ID Index

on:
  # Monthly scheduled rebuild (26th of each month, day after geocoder shards)
  schedule:
    - cron: '0 6 26 * *'  # 6 AM UTC, 26th of each month

  workflow_dispatch:
    inputs:
      types:
        description: 'Comma-separated types to index (empty = all registry types)'
        type: string
        required: false
        default: ''
      prefix_len:
        description: 'Hex prefix length for sharding (3 = 4096 shards)'
        type: number
        required: false
        default: 3
      version_suffix:
        description: 'Version suffix (0 = default, 1/2/3 = same-day rebuilds)'
        type: string
        required: false
        default: '0'
      phase:
        description: 'Pipeline phase (all, partition, build, metadata)'
        type: string
        required: false
        default: 'all'
      skip_partition:
        description: 'Skip Phase 1 (reuse existing R2 staging)'
        type: boolean
        required: false
        default: false
      confirm:
        description: 'Type "REBUILD" to confirm (not required for scheduled runs)'
        type: string
        required: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  rebuild-id-index:
    runs-on: ubuntu-latest-xlarge
    # Run if: scheduled OR manual with REBUILD confirmation
    if: github.event_name == 'schedule' || github.event.inputs.confirm == 'REBUILD'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: |
          npm install -g wrangler
          echo "Wrangler version: $(wrangler --version)"

      - name: Check disk space
        run: df -h /

      - name: Verify R2 credentials
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2 S3 API credentials not configured"
            echo "Add R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY to repository secrets"
            echo "Create tokens at: Cloudflare Dashboard > R2 > Manage R2 API Tokens"
            exit 1
          fi
          echo "R2 credentials configured"

      - name: Build ID index
        run: |
          ARGS="--prefix-len ${{ github.event.inputs.prefix_len || 3 }}"
          ARGS="$ARGS --version-suffix ${{ github.event.inputs.version_suffix || '0' }}"
          ARGS="$ARGS --phase ${{ github.event.inputs.phase || 'all' }}"
          if [ -n "${{ github.event.inputs.types }}" ]; then
            ARGS="$ARGS --types ${{ github.event.inputs.types }}"
          fi
          if [ "${{ github.event.inputs.skip_partition }}" = "true" ]; then
            ARGS="$ARGS --skip-partition"
          fi
          echo "Running: python scripts/build_id_index.py $ARGS"
          python scripts/build_id_index.py $ARGS

      - name: Verify R2 uploads
        if: contains(github.event.inputs.phase || 'all', 'all') || contains(github.event.inputs.phase || 'all', 'metadata')
        run: |
          # Get the version that was built
          VERSION=$(python3 -c "
          from datetime import datetime, timezone
          suffix = '${{ github.event.inputs.version_suffix || 0 }}'
          print(datetime.now(timezone.utc).strftime('%Y-%m-%d') + '.' + suffix)
          ")
          echo "Verifying version: ${VERSION}"
          FAILED=0

          # Verify id-collection.json
          if wrangler r2 object get "geocoder-shards/${VERSION}/id-collection.json" --remote --pipe > /dev/null 2>&1; then
            echo "  ok: ${VERSION}/id-collection.json"
          else
            echo "::error::${VERSION}/id-collection.json NOT FOUND in R2"
            FAILED=1
          fi

          # Spot-check a few shards
          for PREFIX in 000 080 0ff 800 fff; do
            if wrangler r2 object get "geocoder-shards/${VERSION}/id-index/${PREFIX}.db" --remote --pipe > /dev/null 2>&1; then
              SIZE=$(wrangler r2 object get "geocoder-shards/${VERSION}/id-index/${PREFIX}.db" --remote --pipe 2>/dev/null | wc -c)
              echo "  ok: ${VERSION}/id-index/${PREFIX}.db (${SIZE} bytes)"
            else
              echo "  skip: ${VERSION}/id-index/${PREFIX}.db (may not exist)"
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::R2 verification failed"
            exit 1
          fi
          echo "R2 verification passed."

      - name: Summary
        if: always()
        run: |
          VERSION=$(python3 -c "
          from datetime import datetime, timezone
          suffix = '${{ github.event.inputs.version_suffix || 0 }}'
          print(datetime.now(timezone.utc).strftime('%Y-%m-%d') + '.' + suffix)
          ")

          echo "## ID Index Rebuild" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Phase:** ${{ github.event.inputs.phase || 'all' }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.inputs.types }}" ]; then
            echo "**Types:** ${{ github.event.inputs.types }}" >> $GITHUB_STEP_SUMMARY
          fi
