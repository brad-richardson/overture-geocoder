name: Global v2 families-only build

# This workflow creates an immutable, non-promoting address + Places slice.
# It never writes either production catalog or production release history. Promotion is
# a separate operator-reviewed workflow. Dry-run performs only read-only
# preflight/inventory validation and never writes R2 or deploys a Worker.
on:
  workflow_dispatch:
    inputs:
      request_json:
        description: Canonical one-line global-v2 request JSON (the workflow adds its final newline).
        required: true
        type: string
      request_sha256:
        description: SHA-256 of the canonical request bytes, including the final newline.
        required: true
        type: string
      mode:
        description: Read-only dry-run or resumable families-only execution.
        required: true
        type: choice
        options: [dry-run, execute]
      confirmation:
        description: Exact phrase binding request, mode, all budget limits, concurrency, and prior retained minutes.
        required: true
        type: string
      max_parallel:
        description: Maximum concurrent map/reduce jobs (1-8).
        required: true
        default: "4"
        type: string
      max_total_runner_minutes:
        description: Hard retained runner-minute budget.
        required: true
        default: "50000"
        type: string
      max_estimated_cost_usd:
        description: Hard conservative cost cap in USD.
        required: true
        default: "1000"
        type: string
      prior_runner_minutes:
        description: Retained runner minutes from earlier attempts; resume only with a fresh dispatch, never Re-run jobs.
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: global-v2-families-${{ inputs.request_sha256 }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  R2_BUCKET: geocoder-shards
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  validate-request:
    name: Validate request ancestry on trusted main (no secrets)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      prepared_at: ${{ steps.trust.outputs.prepared_at }}
      runner_image_os: ${{ steps.trust.outputs.runner_image_os }}
      runner_image_version: ${{ steps.trust.outputs.runner_image_version }}
    steps:
      - name: Check out dispatched main with ancestry
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"
      - name: Install hash-pinned validation dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - name: Validate canonical request, typed confirmation, and merged producer
        id: trust
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          set -euo pipefail
          mkdir -p control
          printf '%s\n' "$REQUEST_JSON" > control/request.json
          PRODUCER="$(jq -er '.producer_commit' control/request.json)"
          PREPARED_AT="$(git show -s --format=%cI "$PRODUCER")"
          python scripts/global_v2_executor.py preflight \
            --request control/request.json --request-sha256 '${{ inputs.request_sha256 }}' \
            --mode '${{ inputs.mode }}' --confirmation '${{ inputs.confirmation }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --prepared-at "$PREPARED_AT" --repository . --main-commit "$GITHUB_SHA" \
            --max-parallel '${{ inputs.max_parallel }}' \
            --max-total-runner-minutes '${{ inputs.max_total_runner_minutes }}' \
            --max-estimated-cost-usd '${{ inputs.max_estimated_cost_usd }}' \
            --runner-image-os ubuntu24 --runner-image-version per-job-provenance \
            --prior-runner-minutes '${{ inputs.prior_runner_minutes }}' \
            --output control/contract.json
          {
            echo "prepared_at=$PREPARED_AT"
            echo "runner_image_os=ubuntu24"
            echo "runner_image_version=per-job-provenance"
          } >> "$GITHUB_OUTPUT"

  preflight:
    name: Read-only preflight and exact inventories
    needs: validate-request
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      prepared_at: ${{ steps.expose.outputs.prepared_at }}
      runner_image_os: ${{ steps.expose.outputs.runner_image_os }}
      runner_image_version: ${{ steps.expose.outputs.runner_image_version }}
      address_bytes: ${{ steps.expose.outputs.address_bytes }}
      address_sha256: ${{ steps.expose.outputs.address_sha256 }}
      places_bytes: ${{ steps.expose.outputs.places_bytes }}
      places_sha256: ${{ steps.expose.outputs.places_sha256 }}
      address_matrix: ${{ steps.expose.outputs.address_matrix }}
      places_matrix: ${{ steps.expose.outputs.places_matrix }}
      map_task_count: ${{ steps.expose.outputs.map_task_count }}
    steps:
      - name: Check out the request producer without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ fromJSON(inputs.request_json).producer_commit }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"

      - name: Install hash-pinned hosted dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"

      - name: Free space with the reviewed action revision
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Enforce pre-inventory disk gate
        run: |
          set -euo pipefail
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 25000000
          df -h / /tmp

      - name: Freeze request, confirmation, checkout, runtime, and budget
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          MAX_TOTAL_RUNNER_MINUTES: ${{ inputs.max_total_runner_minutes }}
          MAX_ESTIMATED_COST_USD: ${{ inputs.max_estimated_cost_usd }}
        run: |
          set -euo pipefail
          mkdir -p control inventory
          printf '%s\n' "$REQUEST_JSON" > control/request.json
          PREPARED_AT='${{ needs.validate-request.outputs.prepared_at }}'
          printf '%s\n' "$PREPARED_AT" > control/prepared-at.txt
          python scripts/global_v2_executor.py preflight \
            --request control/request.json --request-sha256 "$REQUEST_SHA256" \
            --mode "$MODE" --confirmation "$CONFIRMATION" \
            --run-attempt '${{ github.run_attempt }}' \
            --prepared-at "$PREPARED_AT" --repository . \
            --main-commit "$(jq -r '.producer_commit' control/request.json)" \
            --max-parallel "$MAX_PARALLEL" \
            --max-total-runner-minutes "$MAX_TOTAL_RUNNER_MINUTES" \
            --max-estimated-cost-usd "$MAX_ESTIMATED_COST_USD" \
            --runner-image-os '${{ needs.validate-request.outputs.runner_image_os }}' \
            --runner-image-version '${{ needs.validate-request.outputs.runner_image_version }}' \
            --prior-runner-minutes '${{ inputs.prior_runner_minutes }}' \
            --output control/contract.json
          python scripts/global_v2_executor.py assert-exact-checkout \
            --request control/request.json --request-sha256 "$REQUEST_SHA256"
          python scripts/global_v2_executor.py runtime --output control/runtime.json
          python scripts/global_v2_executor.py budget \
            --contract control/contract.json --request control/request.json \
            --phase inventory --jobs 1 \
            --consumed-runner-minutes '${{ inputs.prior_runner_minutes }}' \
            --output control/inventory-budget.json

      - name: Read back and validate the exact legacy core (no writes)
        env:
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          CORE_KEY="$(jq -er '.legacy_core.manifest_key' control/request.json)"
          aws s3api get-object --bucket "$R2_BUCKET" --key "$CORE_KEY" \
            --endpoint-url "$R2_ENDPOINT" --region auto control/legacy-release-manifest.json >/dev/null
          python scripts/global_v2_executor.py validate-legacy-core \
            --request control/request.json --request-sha256 '${{ inputs.request_sha256 }}' \
            --manifest control/legacy-release-manifest.json \
            --output control/legacy-core-validation.json

      - name: Rebuild canonical footer inventories read-only
        run: |
          set -euo pipefail
          RELEASE="$(jq -er '.overture_release' control/request.json)"
          /usr/bin/time -v python scripts/inventory_address_rowgroups.py \
            --release "$RELEASE" --json-out inventory/addresses.json \
            --markdown-out inventory/addresses.md --workers 8 \
            --target-rows 4000000 --max-selected-uncompressed-bytes 400000000 \
            --max-groups 72 --max-tasks 128
          /usr/bin/time -v python scripts/global_v2_places_inventory.py \
            --release "$RELEASE" --output inventory/places.json --workers 8 \
            --target-rows 1000000 --max-selected-uncompressed-bytes 1000000000 \
            --max-groups 64 --max-tasks 128
          python scripts/global_v2_executor.py validate-inventory \
            --request control/request.json --request-sha256 '${{ inputs.request_sha256 }}' \
            --family addresses --inventory inventory/addresses.json
          python scripts/global_v2_executor.py validate-inventory \
            --request control/request.json --request-sha256 '${{ inputs.request_sha256 }}' \
            --family places --inventory inventory/places.json

      - name: Publish resumable inventory completion only in execute mode
        if: inputs.mode == 'execute'
        env:
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          python scripts/global_v2_hosted.py publish-inventory \
            --contract control/contract.json --runtime control/runtime.json \
            --request control/request.json --addresses inventory/addresses.json \
            --places inventory/places.json --output control/inventory-completion.json

      - name: Expose exact bounded matrices and inventory identities
        id: expose
        run: |
          set -euo pipefail
          ADDRESS_MATRIX="$(jq -c '{include:[.plan.tasks[]|{index:.index}]}' inventory/addresses.json)"
          PLACES_MATRIX="$(jq -c '{include:[.map_plan.tasks[]|{index:.index}]}' inventory/places.json)"
          {
            echo "prepared_at=$(cat control/prepared-at.txt)"
            echo "runner_image_os=$ImageOS"
            echo "runner_image_version=$ImageVersion"
            echo "address_bytes=$(stat -c %s inventory/addresses.json)"
            echo "address_sha256=$(sha256sum inventory/addresses.json | awk '{print $1}')"
            echo "places_bytes=$(stat -c %s inventory/places.json)"
            echo "places_sha256=$(sha256sum inventory/places.json | awk '{print $1}')"
            echo "address_matrix=$ADDRESS_MATRIX"
            echo "places_matrix=$PLACES_MATRIX"
            echo "map_task_count=$(( $(jq '.include|length' <<<"$ADDRESS_MATRIX") + $(jq '.include|length' <<<"$PLACES_MATRIX") ))"
          } >> "$GITHUB_OUTPUT"

      - name: Retain preflight evidence for operator sign-off
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: global-v2-preflight-${{ inputs.request_sha256 }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            control/request.json
            control/contract.json
            control/runtime.json
            control/inventory-budget.json
            control/legacy-core-validation.json
            inventory/addresses.json
            inventory/addresses.md
            inventory/places.json

      - name: Summarize the non-promoting gate
        if: always()
        run: |
          {
            echo "## Global v2 families-only preflight"
            echo
            echo "- Mode: ${{ inputs.mode }}"
            echo "- Request: ${{ inputs.request_sha256 }}"
            echo "- Address map tasks: $(jq '.plan.tasks|length' inventory/addresses.json 2>/dev/null || echo unavailable)"
            echo "- Places map tasks: $(jq '.map_plan.tasks|length' inventory/places.json 2>/dev/null || echo unavailable)"
            echo "- Prior retained runner minutes: ${{ inputs.prior_runner_minutes }}"
            echo "- Resume rule: use a fresh workflow_dispatch with updated prior minutes and confirmation; never Re-run jobs"
            echo "- Production catalog writes: forbidden"
            echo "- Dry-run R2/Worker writes: none (evidence retained only as a GitHub artifact)"
          } >> "$GITHUB_STEP_SUMMARY"

  address-map:
    name: Address map ${{ matrix.index }}
    needs: preflight
    if: inputs.mode == 'execute'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.preflight.outputs.address_matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ fromJSON(inputs.request_json).producer_commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.14"
      - run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Recreate control files, restore exact inventory, and gate resources
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 25000000
          mkdir -p control inventory work/output
          printf '%s\n' "$REQUEST_JSON" > control/request.json
          python scripts/global_v2_executor.py preflight \
            --request control/request.json --request-sha256 '${{ inputs.request_sha256 }}' \
            --mode execute --confirmation '${{ inputs.confirmation }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --prepared-at '${{ needs.preflight.outputs.prepared_at }}' \
            --main-commit "$(jq -r '.producer_commit' control/request.json)" \
            --max-parallel '${{ inputs.max_parallel }}' \
            --max-total-runner-minutes '${{ inputs.max_total_runner_minutes }}' \
            --max-estimated-cost-usd '${{ inputs.max_estimated_cost_usd }}' \
            --runner-image-os '${{ needs.preflight.outputs.runner_image_os }}' \
            --runner-image-version '${{ needs.preflight.outputs.runner_image_version }}' \
            --prior-runner-minutes '${{ inputs.prior_runner_minutes }}' \
            --output control/contract.json
          python scripts/global_v2_executor.py assert-exact-checkout \
            --request control/request.json --request-sha256 '${{ inputs.request_sha256 }}'
          python scripts/global_v2_executor.py runtime --output control/runtime.json
          KEY="$(jq -r '.namespace.immutable_root+"/inventory/addresses.json"' control/contract.json)"
          python scripts/global_v2_executor.py restore-immutable \
            --contract control/contract.json --request control/request.json --object-key "$KEY" \
            --bytes '${{ needs.preflight.outputs.address_bytes }}' \
            --sha256 '${{ needs.preflight.outputs.address_sha256 }}' \
            --destination inventory/addresses.json
          python scripts/global_v2_executor.py budget --contract control/contract.json \
            --request control/request.json --phase map \
            --jobs '${{ needs.preflight.outputs.map_task_count }}' \
            --consumed-runner-minutes "$(( ${{ inputs.prior_runner_minutes }} + 120 ))" \
            --output control/map-budget.json
      - name: Admit an exact completed address task before recomputing
        id: admit
        env:
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          INDEX='${{ matrix.index }}'
          TASK_ID="addresses-map-$(printf '%03d' "$INDEX")"
          python scripts/global_v2_hosted.py admit-task \
            --contract control/contract.json --runtime control/runtime.json \
            --phase map --family addresses --task-id "$TASK_ID" --index "$INDEX" \
            --marker-only \
            --output control/task-admission.json
          echo "completed=$(jq -r '.completed' control/task-admission.json)" >> "$GITHUB_OUTPUT"
      - name: Project and map the exact address task
        if: steps.admit.outputs.completed != 'true'
        run: |
          set -euo pipefail
          INDEX='${{ matrix.index }}'
          RELEASE="$(jq -r '.overture_release' control/request.json)"
          TASK="$(jq -c --argjson i "$INDEX" '.plan.tasks[$i]' inventory/addresses.json)"
          /usr/bin/time -v python scripts/experiment_hosted_rowgroups.py \
            --release "$RELEASE" --family addresses --inventory-report inventory/addresses.json \
            --task-index "$INDEX" --output work/projected.parquet --json-out work/projection.json \
            --target-rowgroup-uncompressed-bytes 400000000 --max-rows 4000000 \
            --max-groups 72 --max-output-bytes 500000000
          /usr/bin/time -v python scripts/global_v2_address_map.py \
            --input work/projected.parquet --output-dir work/output \
            --completion-out work/completion.json \
            --execution-bucket "$(jq -r '.execution_bucket' <<<"$TASK")" \
            --expected-release "$RELEASE" \
            --expected-schema-fingerprint-sha256 "$(jq -r '.families.addresses.source.schema_fingerprint_sha256' control/request.json)" \
            --expected-inventory-sha256 "$(jq -r '.inventory_sha256' inventory/addresses.json)" \
            --expected-task-index "$INDEX" \
            --expected-task-digest-sha256 "$(jq -r '.task_digest_sha256' <<<"$TASK")" \
            --expected-task-source-digest-sha256 "$(jq -r '.source_digest_sha256' <<<"$TASK")" \
            --maximum-hash-bits "$(jq -r '.families.addresses.partition.maximum_hash_bits' control/request.json)" \
            --max-rows 4000000
      - name: Publish the exact address task outputs and marker
        if: steps.admit.outputs.completed != 'true'
        env:
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          INDEX='${{ matrix.index }}'
          python scripts/global_v2_hosted.py publish-map \
            --contract control/contract.json --runtime control/runtime.json \
            --request control/request.json --inventory inventory/addresses.json \
            --family addresses --task-index "$INDEX" --producer-report work/completion.json \
            --producer-output-root work/output --scratch-dir work/scratch \
            --output work/published.json

  places-map:
    name: Places map ${{ matrix.index }}
    needs: [preflight, address-map]
    if: inputs.mode == 'execute'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.preflight.outputs.places_matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ fromJSON(inputs.request_json).producer_commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.14"
      - run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Restore exact control and Places inventory
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 25000000
          mkdir -p control inventory work/output work/scratch
          printf '%s\n' "$REQUEST_JSON" > control/request.json
          python scripts/global_v2_executor.py preflight --request control/request.json \
            --request-sha256 '${{ inputs.request_sha256 }}' --mode execute \
            --confirmation '${{ inputs.confirmation }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --prepared-at '${{ needs.preflight.outputs.prepared_at }}' \
            --main-commit "$(jq -r '.producer_commit' control/request.json)" \
            --max-parallel '${{ inputs.max_parallel }}' \
            --max-total-runner-minutes '${{ inputs.max_total_runner_minutes }}' \
            --max-estimated-cost-usd '${{ inputs.max_estimated_cost_usd }}' \
            --runner-image-os '${{ needs.preflight.outputs.runner_image_os }}' \
            --runner-image-version '${{ needs.preflight.outputs.runner_image_version }}' \
            --prior-runner-minutes '${{ inputs.prior_runner_minutes }}' \
            --output control/contract.json
          python scripts/global_v2_executor.py assert-exact-checkout --request control/request.json \
            --request-sha256 '${{ inputs.request_sha256 }}'
          python scripts/global_v2_executor.py runtime --output control/runtime.json
          KEY="$(jq -r '.namespace.immutable_root+"/inventory/places.json"' control/contract.json)"
          python scripts/global_v2_executor.py restore-immutable --contract control/contract.json \
            --request control/request.json --object-key "$KEY" \
            --bytes '${{ needs.preflight.outputs.places_bytes }}' \
            --sha256 '${{ needs.preflight.outputs.places_sha256 }}' \
            --destination inventory/places.json
          python scripts/global_v2_executor.py budget --contract control/contract.json \
            --request control/request.json --phase map \
            --jobs '${{ needs.preflight.outputs.map_task_count }}' \
            --consumed-runner-minutes "$(( ${{ inputs.prior_runner_minutes }} + 120 ))" \
            --output control/map-budget.json
      - name: Admit an exact completed Places task before recomputing
        id: admit
        env:
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          INDEX='${{ matrix.index }}'
          TASK_ID="places-map-$(printf '%03d' "$INDEX")"
          python scripts/global_v2_hosted.py admit-task \
            --contract control/contract.json --runtime control/runtime.json \
            --phase map --family places --task-id "$TASK_ID" --index "$INDEX" \
            --marker-only \
            --output control/task-admission.json
          echo "completed=$(jq -r '.completed' control/task-admission.json)" >> "$GITHUB_OUTPUT"
      - name: Map the exact Places task
        if: steps.admit.outputs.completed != 'true'
        run: |
          set -euo pipefail
          INDEX='${{ matrix.index }}'
          /usr/bin/time -v python scripts/global_v2_places_map.py \
            --inventory inventory/places.json --task-index "$INDEX" \
            --output-dir work/output --report work/report.json \
            --maximum-level "$(jq -r '.families.places.partition.maximum_level' control/request.json)"
      - name: Publish the exact Places task outputs and marker
        if: steps.admit.outputs.completed != 'true'
        env:
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          INDEX='${{ matrix.index }}'
          python scripts/global_v2_hosted.py publish-map \
            --contract control/contract.json --runtime control/runtime.json \
            --request control/request.json --inventory inventory/places.json \
            --family places --task-index "$INDEX" --producer-report work/report.json \
            --producer-output-root work/output --scratch-dir work/scratch \
            --output work/published.json

  aggregate-plan:
    name: Exact map fan-in and stable reducer plans
    needs: [preflight, address-map, places-map]
    if: inputs.mode == 'execute'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      reduce_matrix: ${{ steps.matrix.outputs.reduce_matrix }}
      reduce_task_count: ${{ steps.matrix.outputs.reduce_task_count }}
      estimated_total_runner_minutes: ${{ steps.matrix.outputs.estimated_total_runner_minutes }}
      estimated_total_cost_usd: ${{ steps.matrix.outputs.estimated_total_cost_usd }}
    steps:
      - name: Check out the request-pinned producer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ fromJSON(inputs.request_json).producer_commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.14"
      - run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Recreate contract and restore exact inventories
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 25000000
          mkdir -p control inventory map-inputs plans
          printf '%s\n' "$REQUEST_JSON" > control/request.json
          python scripts/global_v2_executor.py preflight --request control/request.json \
            --request-sha256 '${{ inputs.request_sha256 }}' --mode execute \
            --confirmation '${{ inputs.confirmation }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --prepared-at '${{ needs.preflight.outputs.prepared_at }}' \
            --main-commit "$(jq -r '.producer_commit' control/request.json)" \
            --max-parallel '${{ inputs.max_parallel }}' \
            --max-total-runner-minutes '${{ inputs.max_total_runner_minutes }}' \
            --max-estimated-cost-usd '${{ inputs.max_estimated_cost_usd }}' \
            --runner-image-os '${{ needs.preflight.outputs.runner_image_os }}' \
            --runner-image-version '${{ needs.preflight.outputs.runner_image_version }}' \
            --prior-runner-minutes '${{ inputs.prior_runner_minutes }}' \
            --output control/contract.json
          python scripts/global_v2_executor.py runtime --output control/runtime.json
          for FAMILY in addresses places; do
            if [ "$FAMILY" = addresses ]; then
              BYTES='${{ needs.preflight.outputs.address_bytes }}'; SHA='${{ needs.preflight.outputs.address_sha256 }}'
            else
              BYTES='${{ needs.preflight.outputs.places_bytes }}'; SHA='${{ needs.preflight.outputs.places_sha256 }}'
            fi
            KEY="$(jq -r --arg f "$FAMILY" '.namespace.immutable_root+"/inventory/"+$f+".json"' control/contract.json)"
            python scripts/global_v2_executor.py restore-immutable --contract control/contract.json \
              --request control/request.json --object-key "$KEY" --bytes "$BYTES" --sha256 "$SHA" \
              --destination "inventory/$FAMILY.json"
          done
          python scripts/global_v2_executor.py budget --contract control/contract.json \
            --request control/request.json --phase aggregate-plan --jobs 1 \
            --consumed-runner-minutes "$(( ${{ inputs.prior_runner_minutes }} + 120 + ${{ needs.preflight.outputs.map_task_count }} * 90))" \
            --output control/aggregate-budget.json
      - name: Require exact map markers and build summary-only plans
        env:
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          jq -n --slurpfile a inventory/addresses.json --slurpfile p inventory/places.json \
            '[$a[0].plan.tasks[]|{family:"addresses",task_id:("addresses-map-"+("000"+(.index|tostring))[-3:]),index:.index}] + [$p[0].map_plan.tasks[]|{family:"places",task_id:("places-map-"+("000"+(.index|tostring))[-3:]),index:.index}]' \
            > control/expected-map.json
          python scripts/global_v2_hosted.py restore-map-planner-inputs \
            --contract control/contract.json --runtime control/runtime.json \
            --expected-tasks control/expected-map.json --output-root map-inputs \
            --output control/restored-map.json
          jq '.phase.completion' control/restored-map.json > control/map-phase.json
          # Geocoder build suffixes are zero-based, while address plan sequences
          # are intentionally positive and one-based.
          BUILD_NUMBER="$(jq -r '.geocoder_build|split(".")[1]|tonumber+1' control/request.json)"
          python scripts/global_v2_hosted.py build-publish-plans \
            --contract control/contract.json --runtime control/runtime.json \
            --request control/request.json --address-inventory inventory/addresses.json \
            --places-inventory inventory/places.json --restored-map-root map-inputs \
            --plan-output-root plans --map-completion control/map-phase.json \
            --build-number "$BUILD_NUMBER" \
            --output control/aggregate-result.json
      - name: Expose the exact reducer matrix
        id: matrix
        run: |
          set -euo pipefail
          MATRIX="$(jq -c '.matrix' control/aggregate-result.json)"
          REDUCE_COUNT="$(jq '.include|length' <<<"$MATRIX")"
          python scripts/global_v2_executor.py execution-budget \
            --contract control/contract.json --request control/request.json \
            --map-jobs '${{ needs.preflight.outputs.map_task_count }}' \
            --reduce-jobs "$REDUCE_COUNT" \
            --prior-runner-minutes '${{ inputs.prior_runner_minutes }}' \
            --output control/execution-budget.json
          {
            echo "reduce_matrix=$MATRIX"
            echo "reduce_task_count=$REDUCE_COUNT"
            echo "estimated_total_runner_minutes=$(jq -r '.estimated_total_runner_minutes' control/execution-budget.json)"
            echo "estimated_total_cost_usd=$(jq -r '.estimated_total_cost_usd' control/execution-budget.json)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Full execution estimate (operator sign-off evidence)"
            echo
            echo "- Address + Places map tasks: ${{ needs.preflight.outputs.map_task_count }}"
            echo "- Combined reducer tasks: $REDUCE_COUNT"
            echo "- Maximum concurrency: ${{ inputs.max_parallel }}"
            echo "- Estimated runner minutes (all phases): $(jq -r '.estimated_total_runner_minutes' control/execution-budget.json)"
            echo "- Conservative cost: \$$(jq -r '.estimated_total_cost_usd' control/execution-budget.json)"
            echo "- Includes inventory, map, plan, reduce, head, remote verify, finalization, and Worker smoke"
          } >> "$GITHUB_STEP_SUMMARY"

  reduce:
    name: ${{ matrix.family }} reduce ${{ matrix.index }}
    needs: [preflight, aggregate-plan]
    if: inputs.mode == 'execute'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.aggregate-plan.outputs.reduce_matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ fromJSON(inputs.request_json).producer_commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.14"
      - run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Restore the exact plans and run one budgeted reducer
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 30000000
          mkdir -p control plans work
          printf '%s\n' "$REQUEST_JSON" > control/request.json
          python scripts/global_v2_executor.py preflight --request control/request.json \
            --request-sha256 '${{ inputs.request_sha256 }}' --mode execute \
            --confirmation '${{ inputs.confirmation }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --prepared-at '${{ needs.preflight.outputs.prepared_at }}' \
            --main-commit "$(jq -r '.producer_commit' control/request.json)" \
            --max-parallel '${{ inputs.max_parallel }}' \
            --max-total-runner-minutes '${{ inputs.max_total_runner_minutes }}' \
            --max-estimated-cost-usd '${{ inputs.max_estimated_cost_usd }}' \
            --runner-image-os '${{ needs.preflight.outputs.runner_image_os }}' \
            --runner-image-version '${{ needs.preflight.outputs.runner_image_version }}' \
            --prior-runner-minutes '${{ inputs.prior_runner_minutes }}' \
            --output control/contract.json
          python scripts/global_v2_executor.py runtime --output control/runtime.json
          python scripts/global_v2_hosted.py admit-task \
            --contract control/contract.json --runtime control/runtime.json \
            --phase reduce --family '${{ matrix.family }}' \
            --task-id '${{ matrix.task_id }}' --index '${{ matrix.index }}' \
            --marker-only \
            --output control/task-admission.json
          if [ "$(jq -r '.completed' control/task-admission.json)" = true ]; then
            echo "Exact reduce task already completed; skipping recomputation."
            exit 0
          fi
          PREFIX="$(jq -r '.namespace.immutable_root+"/aggregate-plan"' control/contract.json)"
          python scripts/global_v2_hosted.py restore-reducer-plans --contract control/contract.json \
            --runtime control/runtime.json --output-root plans --output-prefix "$PREFIX" \
            --output control/restored-plans.json
          python scripts/global_v2_executor.py budget --contract control/contract.json \
            --request control/request.json --phase reduce \
            --jobs '${{ needs.aggregate-plan.outputs.reduce_task_count }}' \
            --consumed-runner-minutes "$(( ${{ inputs.prior_runner_minutes }} + 120 + ${{ needs.preflight.outputs.map_task_count }} * 90 + 180))" \
            --output control/reduce-budget.json
          python scripts/global_v2_hosted.py run-publish-reduce \
            --contract control/contract.json --runtime control/runtime.json \
            --request control/request.json --family '${{ matrix.family }}' \
            --index '${{ matrix.index }}' \
            --matrix-jobs '${{ needs.aggregate-plan.outputs.reduce_task_count }}' \
            --consumed-runner-minutes "$(( ${{ inputs.prior_runner_minutes }} + 120 + ${{ needs.preflight.outputs.map_task_count }} * 90 + 180))" \
            --address-partition-plan plans/address_partition-plan.json \
            --address-reduce-plan plans/addresses-plan.json \
            --places-plan plans/places-plan.json --work-root work \
            --output control/reduce-result.json

  head:
    name: Exact reduce fan-in and global Places head
    needs: [preflight, aggregate-plan, reduce]
    if: inputs.mode == 'execute'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ fromJSON(inputs.request_json).producer_commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.14"
      - run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Complete reduce, build head, and complete head
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 30000000
          mkdir -p control plans head-work
          printf '%s\n' "$REQUEST_JSON" > control/request.json
          python scripts/global_v2_executor.py preflight --request control/request.json \
            --request-sha256 '${{ inputs.request_sha256 }}' --mode execute \
            --confirmation '${{ inputs.confirmation }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --prepared-at '${{ needs.preflight.outputs.prepared_at }}' \
            --main-commit "$(jq -r '.producer_commit' control/request.json)" \
            --max-parallel '${{ inputs.max_parallel }}' \
            --max-total-runner-minutes '${{ inputs.max_total_runner_minutes }}' \
            --max-estimated-cost-usd '${{ inputs.max_estimated_cost_usd }}' \
            --runner-image-os '${{ needs.preflight.outputs.runner_image_os }}' \
            --runner-image-version '${{ needs.preflight.outputs.runner_image_version }}' \
            --prior-runner-minutes '${{ inputs.prior_runner_minutes }}' \
            --output control/contract.json
          python scripts/global_v2_executor.py runtime --output control/runtime.json
          python scripts/global_v2_hosted.py admit-task \
            --contract control/contract.json --runtime control/runtime.json \
            --phase head --family places --task-id places-head-000 --index 0 \
            --marker-only \
            --output control/task-admission.json
          if [ "$(jq -r '.completed' control/task-admission.json)" = true ]; then
            echo "Exact head task already completed; skipping recomputation."
            exit 0
          fi
          PREFIX="$(jq -r '.namespace.immutable_root+"/aggregate-plan"' control/contract.json)"
          python scripts/global_v2_hosted.py restore-reducer-plans --contract control/contract.json \
            --runtime control/runtime.json --output-root plans --output-prefix "$PREFIX" \
            --output control/restored-plans.json
          jq '[.jobs[]|{family:"addresses",task_id:.id,index:.index}]' \
            plans/addresses-plan.json > control/address-reduce-tasks.json
          jq '[.reduce_jobs[]|{family:"places",task_id:("places-reduce-"+("000"+(.index|tostring))[-3:]),index:.index}]' \
            plans/places-plan.json > control/places-reduce-tasks.json
          jq -s 'add' control/address-reduce-tasks.json control/places-reduce-tasks.json > control/expected-reduce.json
          python scripts/global_v2_hosted.py complete-phase --contract control/contract.json \
            --runtime control/runtime.json --phase reduce --expected-tasks control/expected-reduce.json \
            --output-dir control/reduce-markers --output control/reduce-wrapper.json
          jq '.completion' control/reduce-wrapper.json > control/reduce-phase.json
          python scripts/global_v2_executor.py budget --contract control/contract.json \
            --request control/request.json --phase head --jobs 1 \
            --consumed-runner-minutes "$(( ${{ inputs.prior_runner_minutes }} + 120 + ${{ needs.preflight.outputs.map_task_count }} * 90 + 180 + ${{ needs.aggregate-plan.outputs.reduce_task_count }} * 180))" \
            --output control/head-budget.json
          python scripts/global_v2_hosted.py run-publish-head \
            --contract control/contract.json --runtime control/runtime.json \
            --request control/request.json --places-plan plans/places-plan.json \
            --reduce-completion control/reduce-phase.json --work-root head-work \
            --reduce-marker-dir control/reduce-markers \
            --consumed-runner-minutes "$(( ${{ inputs.prior_runner_minutes }} + 120 + ${{ needs.preflight.outputs.map_task_count }} * 90 + 180 + ${{ needs.aggregate-plan.outputs.reduce_task_count }} * 180))" \
            --output control/head-result.json
          printf '%s\n' '[{"family":"places","task_id":"places-head-000","index":0}]' > control/expected-head.json
          python scripts/global_v2_hosted.py complete-phase --contract control/contract.json \
            --runtime control/runtime.json --phase head --expected-tasks control/expected-head.json \
            --output-dir control/head-markers --output control/head-wrapper.json

  finalize-slice:
    name: Stream family finalization and publish exact non-promoting slice evidence
    needs: [preflight, aggregate-plan, head]
    if: inputs.mode == 'execute'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ fromJSON(inputs.request_json).producer_commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.14"
      - run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Recreate contract and exact finalization inputs
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 30000000
          mkdir -p control plans final-inputs final-work preview
          printf '%s\n' "$REQUEST_JSON" > control/request.json
          python scripts/global_v2_executor.py preflight --request control/request.json \
            --request-sha256 '${{ inputs.request_sha256 }}' --mode execute \
            --confirmation '${{ inputs.confirmation }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --prepared-at '${{ needs.preflight.outputs.prepared_at }}' \
            --main-commit "$(jq -r '.producer_commit' control/request.json)" \
            --max-parallel '${{ inputs.max_parallel }}' \
            --max-total-runner-minutes '${{ inputs.max_total_runner_minutes }}' \
            --max-estimated-cost-usd '${{ inputs.max_estimated_cost_usd }}' \
            --runner-image-os '${{ needs.preflight.outputs.runner_image_os }}' \
            --runner-image-version '${{ needs.preflight.outputs.runner_image_version }}' \
            --prior-runner-minutes '${{ inputs.prior_runner_minutes }}' \
            --output control/contract.json
          python scripts/global_v2_executor.py runtime --output control/runtime.json
          PREFIX="$(jq -r '.namespace.immutable_root+"/aggregate-plan"' control/contract.json)"
          python scripts/global_v2_hosted.py restore-reducer-plans --contract control/contract.json \
            --runtime control/runtime.json --output-root plans --output-prefix "$PREFIX" \
            --output control/restored-plans.json
          jq '[.jobs[]|{family:"addresses",task_id:.id,index:.index}]' plans/addresses-plan.json > control/a.json
          jq '[.reduce_jobs[]|{family:"places",task_id:("places-reduce-"+("000"+(.index|tostring))[-3:]),index:.index}]' plans/places-plan.json > control/p.json
          jq -s 'add' control/a.json control/p.json > control/expected-reduce.json
          printf '%s\n' '[{"family":"places","task_id":"places-head-000","index":0}]' > control/expected-head.json
          python scripts/global_v2_hosted.py restore-finalization-reports \
            --contract control/contract.json --runtime control/runtime.json \
            --expected-reduce-tasks control/expected-reduce.json \
            --expected-head-tasks control/expected-head.json --output-root final-inputs \
            --output control/finalization-inputs.json
      - name: Stream final parsers and publish family manifests last
        env:
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          python scripts/global_v2_hosted.py finalize-publish-families \
            --contract control/contract.json --request control/request.json \
            --address-partition-plan plans/address_partition-plan.json \
            --address-reduce-plan plans/addresses-plan.json \
            --places-plan plans/places-plan.json \
            --finalization-inputs control/finalization-inputs.json \
            --work-root final-work --output control/family-results.json
      - name: One whole-slice streaming verification and create-only marker
        env:
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p control/phase-evidence
          for PHASE in inventory map aggregate-plan reduce head; do
            KEY="$(jq -r --arg p "$PHASE" '.namespace.phase_completion_root+"/"+$p+".json"' control/contract.json)"
            python scripts/global_v2_executor.py restore-known-key \
              --contract control/contract.json --request control/request.json \
              --object-key "$KEY" --destination "control/phase-evidence/$PHASE.json"
          done
          jq -s 'map({phase:.phase,completion_sha256:.completion_sha256})' \
            control/phase-evidence/inventory.json control/phase-evidence/map.json \
            control/phase-evidence/aggregate-plan.json control/phase-evidence/reduce.json \
            control/phase-evidence/head.json > control/phase-evidence.json
          ADDRESS_MANIFEST="$(jq -r '.addresses.manifest' control/family-results.json)"
          PLACES_MANIFEST="$(jq -r '.places.manifest' control/family-results.json)"
          python scripts/finalize_rebuild.py publish-global-v2-slice \
            --request control/request.json --contract control/contract.json \
            --runtime control/runtime.json --addresses-manifest "$ADDRESS_MANIFEST" \
            --places-manifest "$PLACES_MANIFEST" --phase-evidence control/phase-evidence.json \
            --candidate control/slice-manifest.json --report control/slice-completion.json
  worker-smoke:
    name: Isolated candidate Worker smoke and verified cleanup
    needs: [preflight, aggregate-plan, finalize-slice]
    if: inputs.mode == 'execute'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ fromJSON(inputs.request_json).producer_commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.14"
      - run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - name: Recreate exact candidate and smoke inputs from immutable R2 state
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p control preview final-inputs/head/reports final-work/addresses/families/addresses
          printf '%s\n' "$REQUEST_JSON" > control/request.json
          python scripts/global_v2_executor.py preflight --request control/request.json \
            --request-sha256 '${{ inputs.request_sha256 }}' --mode execute \
            --confirmation '${{ inputs.confirmation }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --prepared-at '${{ needs.preflight.outputs.prepared_at }}' \
            --main-commit "$(jq -r '.producer_commit' control/request.json)" \
            --max-parallel '${{ inputs.max_parallel }}' \
            --max-total-runner-minutes '${{ inputs.max_total_runner_minutes }}' \
            --max-estimated-cost-usd '${{ inputs.max_estimated_cost_usd }}' \
            --runner-image-os '${{ needs.preflight.outputs.runner_image_os }}' \
            --runner-image-version '${{ needs.preflight.outputs.runner_image_version }}' \
            --prior-runner-minutes '${{ inputs.prior_runner_minutes }}' \
            --output control/contract.json
          python scripts/global_v2_executor.py runtime --output control/runtime.json
          SLICE="$(jq -r '.slice_version' control/request.json)"
          IMMUTABLE="$(jq -r '.namespace.immutable_root' control/contract.json)"
          PHASE_ROOT="$(jq -r '.namespace.phase_completion_root' control/contract.json)"
          while read -r KEY DESTINATION; do
            python scripts/global_v2_executor.py restore-known-key \
              --contract control/contract.json --request control/request.json \
              --object-key "$KEY" --destination "$DESTINATION"
          done <<EOF
          $SLICE/families/addresses/family-manifest.json control/addresses-family-manifest.json
          $SLICE/families/places/family-manifest.json control/places-family-manifest.json
          $SLICE/slice-manifest.json control/slice-manifest.json
          $IMMUTABLE/finalize/addresses/report.json final-work/addresses/families/addresses/reduce-completion.json
          $IMMUTABLE/head/places/report.json final-inputs/head/reports/places-000.json
          $PHASE_ROOT/finalize-slice.json control/finalize-slice-phase.json
          EOF
          jq '{finalize_slice:{completion_sha256:.completion_sha256}}' \
            control/finalize-slice-phase.json > control/slice-completion.json
      - name: Restore exact legacy manifest and publish only isolated preview objects
        env:
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          CORE_KEY="$(jq -r '.legacy_core.manifest_key' control/request.json)"
          aws s3api get-object --bucket "$R2_BUCKET" --key "$CORE_KEY" \
            --endpoint-url "$R2_ENDPOINT" --region auto control/legacy-release-manifest.json >/dev/null
          python scripts/global_v2_executor.py validate-legacy-core \
            --request control/request.json --request-sha256 '${{ inputs.request_sha256 }}' \
            --manifest control/legacy-release-manifest.json --output control/legacy-validation.json
          python scripts/global_v2_hosted.py publish-preview \
            --contract control/contract.json --request control/request.json \
            --legacy-manifest control/legacy-release-manifest.json \
            --address-manifest control/addresses-family-manifest.json \
            --places-manifest control/places-family-manifest.json \
            --slice-manifest control/slice-manifest.json \
            --run-id '${{ github.run_id }}-${{ github.run_attempt }}' \
            --generated-at '${{ needs.preflight.outputs.prepared_at }}' \
            --output-root preview --output control/preview.json
      - name: Install exact preview Worker tooling
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          cargo install worker-build --version 0.7.2 --locked
          npm install --global wrangler@4.112.0
      - name: Deploy isolated workers.dev preview and query v2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: crates/geocoder-worker
        run: |
          set -euo pipefail
          WORKER_NAME="$(jq -r '.cleanup.worker_name' ../../control/preview.json)"
          CATALOG_KEY="$(jq -r '.catalog_key' ../../control/preview.json)"
          GEOCODER_BUILD="$(jq -r '.geocoder_build' ../../control/request.json)"
          OVERTURE_RELEASE="$(jq -r '.overture_release' ../../control/request.json)"
          DEPLOY_LOG="$(mktemp)"
          wrangler deploy --config wrangler.global-v2-preview.toml --name "$WORKER_NAME" \
            --var ENVIRONMENT:preview --var "V2_CATALOG_KEY_OVERRIDE:$CATALOG_KEY" \
            --var "EXPECTED_V2_CATALOG_KEY:$CATALOG_KEY" \
            --var "EXPECTED_GEOCODER_BUILD:$GEOCODER_BUILD" \
            --var "EXPECTED_OVERTURE_RELEASE:$OVERTURE_RELEASE" \
            2>&1 | tee "$DEPLOY_LOG"
          PREVIEW_URL="$(grep -oE 'https://[^[:space:]]+\.workers\.dev' "$DEPLOY_LOG" | tail -1)"
          test -n "$PREVIEW_URL"
          printf '%s\n' "$PREVIEW_URL" > ../../control/preview-url.txt
          READY=0
          PLACES_SAMPLE=../../final-inputs/head/reports/places-000.json
          ADDRESS_SAMPLE=../../final-work/addresses/families/addresses/reduce-completion.json
          PLACE_QUERY="$(jq -er '.smoke_sample.query' "$PLACES_SAMPLE")"
          PLACE_ID="$(jq -er '.smoke_sample.expected_id' "$PLACES_SAMPLE")"
          ADDRESS_ID="$(jq -er '.smoke_sample.expected_id' "$ADDRESS_SAMPLE")"
          ADDRESS_COUNTRY="$(jq -r '.smoke_sample.country' "$ADDRESS_SAMPLE")"
          ADDRESS_GENERAL="$(jq -r '.smoke_sample.admin_level_general' "$ADDRESS_SAMPLE")"
          ADDRESS_SPECIFIC="$(jq -r '.smoke_sample.admin_level_specific' "$ADDRESS_SAMPLE")"
          ADDRESS_CITY="$(jq -r '.smoke_sample.postal_city' "$ADDRESS_SAMPLE")"
          ADDRESS_POSTCODE="$(jq -r '.smoke_sample.postcode' "$ADDRESS_SAMPLE")"
          ADDRESS_STREET="$(jq -r '.smoke_sample.street' "$ADDRESS_SAMPLE")"
          ADDRESS_NUMBER="$(jq -r '.smoke_sample.number' "$ADDRESS_SAMPLE")"
          ADDRESS_UNIT="$(jq -r '.smoke_sample.unit' "$ADDRESS_SAMPLE")"
          jq -n --arg q "$PLACE_QUERY" --arg place_id "$PLACE_ID" \
            --arg address_id "$ADDRESS_ID" --arg country "$ADDRESS_COUNTRY" \
            --arg general "$ADDRESS_GENERAL" --arg specific "$ADDRESS_SPECIFIC" \
            --arg city "$ADDRESS_CITY" --arg postcode "$ADDRESS_POSTCODE" \
            --arg street "$ADDRESS_STREET" --arg number "$ADDRESS_NUMBER" \
            --arg unit "$ADDRESS_UNIT" \
            '{places:{query:{q:$q,types:["poi"],limit:5},expected_id:$place_id},addresses:{query:{country:$country,admin_level_general:$general,admin_level_specific:$specific,postal_city:$city,postcode:$postcode,street:$street,number:$number,unit:$unit},expected_id:$address_id}}' \
            > ../../control/smoke-requests.json
          for ATTEMPT in $(seq 1 12); do
            if curl -fsS --max-time 20 "$PREVIEW_URL/health" -o ../../control/health.json \
              && jq -e --arg build "$GEOCODER_BUILD" --arg release "$OVERTURE_RELEASE" --arg catalog "$CATALOG_KEY" \
                '.status == "ok" and .candidate_isolated == true and .geocoder_build == $build and .overture_release == $release and .catalog_key == $catalog' \
                ../../control/health.json >/dev/null \
              && curl -fsS --max-time 30 --get --data-urlencode "q=$PLACE_QUERY" \
                --data-urlencode 'types=poi' --data-urlencode 'limit=5' \
                "$PREVIEW_URL/v2/forward" -o ../../control/places-query.json \
              && jq -e --arg id "$PLACE_ID" '.metadata.types == ["poi"] and any(.features[]; .id == $id and .properties.feature_type == "poi")' ../../control/places-query.json >/dev/null \
              && curl -fsS --max-time 30 --get \
                --data-urlencode "country=$ADDRESS_COUNTRY" \
                --data-urlencode "admin_level_general=$ADDRESS_GENERAL" \
                --data-urlencode "admin_level_specific=$ADDRESS_SPECIFIC" \
                --data-urlencode "postal_city=$ADDRESS_CITY" \
                --data-urlencode "postcode=$ADDRESS_POSTCODE" \
                --data-urlencode "street=$ADDRESS_STREET" \
                --data-urlencode "number=$ADDRESS_NUMBER" \
                --data-urlencode "unit=$ADDRESS_UNIT" \
                "$PREVIEW_URL/v2/forward" -o ../../control/address-query.json \
              && jq -e --arg id "$ADDRESS_ID" '.metadata.mode == "structured_address" and any(.features[]; .id == $id and .properties.feature_type == "address")' ../../control/address-query.json >/dev/null; then
              READY=1
              break
            fi
            echo "Preview readiness attempt $ATTEMPT failed"
            sleep 10
          done
          test "$READY" -eq 1
          for LEGACY_PATH in / /search /reverse /id/00000000-0000-0000-0000-000000000000; do
            STATUS="$(curl -sS -o /dev/null -w '%{http_code}' "$PREVIEW_URL$LEGACY_PATH")"
            test "$STATUS" = 404
          done
      - name: Always delete the isolated Worker and its two preview objects
        if: always()
        env:
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: crates/geocoder-worker
        run: |
          set -uo pipefail
          FAILED=0
          WORKER_NAME="geocoder-global-v2-${{ github.run_id }}-${{ github.run_attempt }}"
          WORKER_DELETED=false
          WORKER_API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/$WORKER_NAME"
          for ATTEMPT in 1 2 3; do
            STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
              -X DELETE -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "$WORKER_API" || true)"
            if [ "$STATUS" = 200 ] || [ "$STATUS" = 404 ]; then break; fi
            sleep $((ATTEMPT * 5))
          done
          for ATTEMPT in 1 2 3; do
            STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$WORKER_API" || true)"
            if [ "$STATUS" = 404 ]; then WORKER_DELETED=true; break; fi
            sleep $((ATTEMPT * 5))
          done
          if [ "$WORKER_DELETED" != true ]; then FAILED=1; fi
          CATALOG_KEY="smoketest-v2/${{ github.run_id }}-${{ github.run_attempt }}/catalog.json"
          RELEASE_KEY="smoketest-v2/${{ github.run_id }}-${{ github.run_attempt }}/release.json"
          DELETED_KEYS='[]'
          for KEY in "$CATALOG_KEY" "$RELEASE_KEY"; do
            DELETED=false
            for ATTEMPT in 1 2 3; do
              if aws s3api delete-object --bucket "$R2_BUCKET" --key "$KEY" \
                --endpoint-url "$R2_ENDPOINT" --region auto >/dev/null; then
                DELETED=true
                break
              fi
              sleep $((ATTEMPT * 5))
            done
            if [ "$DELETED" = true ]; then
              DELETED_KEYS="$(jq -c --arg key "$KEY" '. + [$key]' <<<"$DELETED_KEYS")"
            else
              FAILED=1
            fi
          done
          PREFIX="smoketest-v2/${{ github.run_id }}-${{ github.run_attempt }}/"
          if ! REMAINING="$(aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix "$PREFIX" \
            --endpoint-url "$R2_ENDPOINT" --region auto --query 'Contents[].Key' --output json)"; then
            REMAINING='["listing-failed"]'
            FAILED=1
          fi
          if [ "$REMAINING" != '[]' ]; then FAILED=1; fi
          jq -n --arg worker "$WORKER_NAME" --arg catalog "$CATALOG_KEY" \
            --arg release "$RELEASE_KEY" --arg prefix "$PREFIX" --argjson deleted "$DELETED_KEYS" \
            --argjson remaining "$REMAINING" --argjson worker_deleted "$WORKER_DELETED" \
            '{worker_name:$worker,worker_deleted:$worker_deleted,deleted_object_keys:$deleted,remaining_object_keys:$remaining,verified_empty_prefix:$prefix,production_catalog_writes:false}' \
            > ../../control/cleanup.json
          exit "$FAILED"
      - name: Publish signed smoke evidence after verified cleanup
        env:
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          python scripts/global_v2_hosted.py publish-worker-smoke-evidence \
            --contract control/contract.json --runtime control/runtime.json \
            --request control/request.json --preview control/preview.json \
            --health control/health.json --places-query control/places-query.json \
            --address-query control/address-query.json \
            --smoke-requests control/smoke-requests.json \
            --cleanup control/cleanup.json --slice-completion control/slice-completion.json \
            --output control/worker-smoke.json
      - name: Summarize immutable non-promotion evidence
        if: always()
        run: |
          {
            echo "## Global v2 families-only result"
            echo
            echo "- Slice: $(jq -r '.slice_version' control/slice-completion.json 2>/dev/null || echo unavailable)"
            echo "- Whole-slice verification passes: 1"
            echo "- Slice marker create-only and last: yes"
            echo "- Preview Worker and preview objects removed: $(jq -r '.cleanup_verified' control/worker-smoke.json 2>/dev/null || echo false)"
            echo "- Production catalog writes: 0"
            echo "- Promotion performed: no"
            echo "- Estimated all-phase runner minutes: ${{ needs.aggregate-plan.outputs.estimated_total_runner_minutes }}"
            echo "- Conservative estimated cost USD: ${{ needs.aggregate-plan.outputs.estimated_total_cost_usd }}"
            echo "- Maximum concurrency: ${{ inputs.max_parallel }}"
            echo "- Prior retained runner minutes: ${{ inputs.prior_runner_minutes }}"
            echo "- Further resume: fresh workflow_dispatch only; update prior minutes and regenerate the limit-bound confirmation"
          } >> "$GITHUB_STEP_SUMMARY"
