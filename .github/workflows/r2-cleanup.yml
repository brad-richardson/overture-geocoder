name: R2 One-Time Cleanup

# Targeted purge of accumulated debris in geocoder-shards, retargeted 2026-07
# after a full bucket audit (981.76 GiB). Five independently dispatchable
# phases, each deleting only an explicit allowlist:
#
#   1. abandoned id-index staging/ under two kept versions      112.67 GiB
#   2. one orphaned bucket-root global-v2 staging prefix          55.08 GiB
#   3. one failed, never-catalogued version prefix               260.77 GiB
#   4. the address map objects under a global-v2 evidence run     23.62 GiB
#   5. catalog prune + delete of one aged-out version            129.12 GiB
#
# Phases 1-4 never touch catalog.json. Only phase 5 goes through the
# catalog-first flow: bucket-side backup, prune_catalog.py allowlist with the
# retention floor, readback compare, live-worker probe, cache-TTL wait, delete.
#
# PROTECTED_PREFIXES is asserted against every computed target before any
# delete in any phase. 2026-07-18.0 is a frozen unpromoted construction-v1
# core (PENDING_WORK.md forbids cleanup against it), 2026-07-13.0 is the live
# latest, 2026-07-02.3 is the id-index-bearing rollback, backups/ holds the
# catalog backups this workflow itself writes.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CLEANUP to confirm deletion'
        required: true
      phases:
        description: 'Space-separated phases to run, e.g. "1 2 3" or "4" or "5"'
        required: true
      dry_run:
        description: 'Run every delete with --dryrun (deletes nothing)'
        type: boolean
        default: false
      global_v2_orphan_prefix:
        description: 'Phase 2 only: full staging/global-v2/<64-hex>/ prefix to delete entirely'
        required: false
        default: ''
      global_v2_evidence_prefix:
        description: 'Phase 4 only: full staging/global-v2/<64-hex>/ prefix whose immutable/map/addresses/objects/ subtree is deleted (manifests/reports/inventory are kept)'
        required: false
        default: ''

# Never interleave catalog pruning with a rebuild finalizer's compare/publish/
# rollback sequence.
concurrency:
  group: r2-production-catalog
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  BUCKET: geocoder-shards
  # When true every delete runs with --dryrun and removes nothing
  DRY_RUN: ${{ github.event.inputs.dry_run }}
  # Phase 1: kept versions whose staging/ (pipeline-only data) is deleted.
  # finalize_rebuild.py excludes staging/ from the release exact-set, so these
  # versions stay servable; {version}/collection.json is asserted afterwards.
  STAGING_ONLY: "2026-07-02.0 2026-07-02.2"
  # Phase 3: orphan prefixes never referenced by the catalog (failed build)
  ORPHAN_PREFIXES: "2026-07-17.0"
  # Phase 5: versions removed from the catalog and then fully deleted
  PRUNE_VERSIONS: "2026-07-02.1"
  # Phase 4: the only subtree phase 4 may ever delete, relative to the prefix
  ADDRESSES_SUBTREE: "immutable/map/addresses/objects/"
  # Never deletable by any phase, at any depth, in either direction
  PROTECTED_PREFIXES: "2026-07-13.0 2026-07-18.0 2026-07-02.3 backups"

jobs:
  # A mistyped confirm value must be a red run, not a green no-op: the
  # job-level gate on `cleanup` silently skips (and reports success), so the
  # typo is caught here, in an ungated job, before anything else starts.
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Fail loudly on a mistyped confirmation
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "CLEANUP" ]; then
            echo "::error::confirm must be exactly 'CLEANUP' (got '$CONFIRM'); nothing ran"
            exit 1
          fi
          echo "confirmation accepted"

  cleanup:
    runs-on: ubuntu-latest
    needs: confirm
    if: github.event.inputs.confirm == 'CLEANUP'
    steps:
      - uses: actions/checkout@v7

      - name: Announce dry-run mode
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          PHASES: ${{ github.event.inputs.phases }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            banner="**DRY RUN** - every delete runs with \`--dryrun\`; nothing is removed."
          else
            banner="**LIVE RUN** - deletes are real."
          fi
          {
            echo "# R2 cleanup: $banner"
            echo ""
            echo "Phases requested: \`$PHASES\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$banner"

      - name: Validate inputs and compute deletion targets
        id: plan
        env:
          PHASES: ${{ github.event.inputs.phases }}
          GLOBAL_V2_ORPHAN_PREFIX: ${{ github.event.inputs.global_v2_orphan_prefix }}
          GLOBAL_V2_EVIDENCE_PREFIX: ${{ github.event.inputs.global_v2_evidence_prefix }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"

          case "$PHASES" in
            ""|*[!12345[:space:]]*) echo "::error::phases must be space-separated digits 1-5"; exit 1;;
          esac

          for phase in 1 2 3 4 5; do
            selected=false
            for want in $PHASES; do
              [ "$want" = "$phase" ] && selected=true
            done
            echo "phase$phase=$selected" >> "$GITHUB_OUTPUT"
            echo "phase $phase selected=$selected"
          done
          selected() {
            for want in $PHASES; do [ "$want" = "$1" ] && return 0; done
            return 1
          }

          # A bucket-root global-v2 prefix must be a complete, fully-qualified
          # 64-hex digest prefix. A bare "staging/", a truncated digest, or a
          # missing trailing slash is refused outright - those would delete
          # unrelated pipelines' data.
          check_global_v2() {
            local label="$1" value="$2"
            # A multi-line dispatch value would pass the per-line grep on its
            # first line and smuggle the remaining lines into the target file as
            # extra targets. Reject any embedded newline, tab or other
            # whitespace before anything else looks at the value.
            case "$value" in
              *$'\n'*|*$'\r'*|*$'\t'*|*" "*)
                echo "::error::$label must be a single line with no whitespace"
                exit 1;;
            esac
            if [ -z "$value" ]; then
              echo "::error::$label is required for the selected phase."
              echo "Candidate prefixes under staging/global-v2/ (supply one verbatim):"
              aws s3 ls "s3://$BUCKET/staging/global-v2/" \
                --endpoint-url "$ENDPOINT" --region auto || true
              exit 1
            fi
            if ! printf '%s' "$value" \
                 | grep -Eq '^staging/global-v2/[0-9a-f]{64}/$'; then
              echo "::error::$label must match ^staging/global-v2/[0-9a-f]{64}/$ (got '$value')"
              exit 1
            fi
            # Belt and braces: the regex already excludes these, but a bare
            # staging prefix is the one mistake that would be catastrophic.
            case "$value" in
              staging/|staging|staging/global-v2/|staging/global-v2)
                echo "::error::$label refuses bare staging prefix '$value'"; exit 1;;
            esac
            # The prefix must actually exist before we plan a delete against it.
            aws s3 ls "s3://$BUCKET/$value" --endpoint-url "$ENDPOINT" --region auto \
              >/dev/null || { echo "::error::$label does not exist: $value"; exit 1; }
          }

          # Shared delete helper, sourced by every phase so dry-run handling and
          # the audit trail are identical in all of them.
          cat > /tmp/r2-rm.sh <<'SH'
          # Requires ENDPOINT, BUCKET and DRY_RUN in the environment.
          S3() { aws "$@" --endpoint-url "$ENDPOINT" --region auto; }
          RM() {
            local target="$1"
            echo "=== $target (dry_run=${DRY_RUN:-false}) ===" >> /tmp/deleted-keys.log
            if [ "${DRY_RUN:-false}" = "true" ]; then
              # --dryrun lists exactly what a real run would remove.
              S3 s3 rm "s3://$BUCKET/$target" --recursive --dryrun | tee -a /tmp/deleted-keys.log
            else
              # No --only-show-errors: every deleted key goes to the audit log
              # artifact, while the console gets a per-target key count so the
              # run log stays readable.
              local keys
              keys=$(S3 s3 rm "s3://$BUCKET/$target" --recursive \
                       | tee -a /tmp/deleted-keys.log | grep -c '^delete:' || true)
              echo "deleted $keys keys under $target"
            fi
          }
          SH

          : > /tmp/deleted-keys.log
          : > /tmp/delete-targets.txt
          if selected 1; then
            for version in $STAGING_ONLY; do
              echo "1|$version/staging/" >> /tmp/delete-targets.txt
            done
          fi
          if selected 2; then
            check_global_v2 global_v2_orphan_prefix "$GLOBAL_V2_ORPHAN_PREFIX"
            echo "2|$GLOBAL_V2_ORPHAN_PREFIX" >> /tmp/delete-targets.txt
          fi
          if selected 3; then
            for version in $ORPHAN_PREFIXES; do
              echo "3|$version/" >> /tmp/delete-targets.txt
            done
          fi
          if selected 4; then
            check_global_v2 global_v2_evidence_prefix "$GLOBAL_V2_EVIDENCE_PREFIX"
            # Evidence-preserving: only the addresses object subtree, never the
            # prefix itself. manifests/, reports/ and inventory/ are retained.
            echo "4|${GLOBAL_V2_EVIDENCE_PREFIX}${ADDRESSES_SUBTREE}" >> /tmp/delete-targets.txt
          fi
          if selected 5; then
            for version in $PRUNE_VERSIONS; do
              echo "5|$version/" >> /tmp/delete-targets.txt
            done
          fi

          if [ ! -s /tmp/delete-targets.txt ]; then
            echo "::error::no deletion targets computed"; exit 1
          fi
          echo "== computed deletion targets =="
          cat /tmp/delete-targets.txt

      - name: Assert no target intersects a protected prefix
        # Runs before ANY delete in EVERY phase. Every phase below deletes only
        # lines from this same file, so this guard covers exactly what is
        # deleted - nothing can be deleted that was not checked here.
        run: |
          set -euo pipefail
          python3 - "$PROTECTED_PREFIXES" /tmp/delete-targets.txt <<'PY'
          import sys

          protected = [p.strip("/") for p in sys.argv[1].split() if p.strip("/")]
          assert protected, "PROTECTED_PREFIXES must be non-empty"

          # Never deletable as a target in its own right, at any depth: these
          # would take out an entire pipeline root or the catalog itself.
          DENIED = {"staging", "staging/global-v2", "catalog.json"}

          bad = []
          with open(sys.argv[2]) as src:
              targets = [line.strip().split("|", 1) for line in src if line.strip()]
          assert targets, "no targets to check"

          for phase, target in targets:
              # Normalize whitespace *first*: "2026-07-13.0 /" would otherwise
              # compare unequal to the protected prefix and slip through.
              if target != target.strip() or any(c.isspace() for c in target):
                  bad.append((phase, target, "target contains whitespace"))
                  continue
              norm = target.strip().strip("/")
              if not norm or "/" not in target:
                  bad.append((phase, target, "unqualified target"))
                  continue
              # Exact-match deny, plus a catalog.json at any depth. No phase
              # deletes a catalog; phase 5 rewrites the root one in place.
              if norm in DENIED or norm.split("/")[-1] == "catalog.json":
                  bad.append((phase, target, f"denied target {norm!r}"))
                  continue
              if target.startswith("/") or ".." in target.split("/"):
                  bad.append((phase, target, "malformed target"))
                  continue
              for prot in protected:
                  # Intersection in either direction: the target is inside a
                  # protected prefix, or it is an ancestor of one.
                  if norm == prot or norm.startswith(prot + "/") \
                     or prot.startswith(norm + "/"):
                      bad.append((phase, target, f"intersects protected {prot}/"))

          for phase, target, why in bad:
              print(f"::error::phase {phase} target {target!r}: {why}")
          if bad:
              raise SystemExit(1)
          print(f"{len(targets)} targets clear of protected prefixes: {protected}")
          PY

      - name: Pre-run live worker probe and inventory
        run: |
          set -euo pipefail
          ENDPOINT="https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          for path in "/health" "/search?q=boston" "/reverse?lat=42.36&lon=-71.06" \
                      "/id/08b2a100-d664-7fff-0200-a44bcea04b76"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://geocoder.bradr.dev$path")
            echo "$path -> $code"
            case "$code" in 200|404) ;; *) echo "::error::live check failed: $path"; exit 1;; esac
          done

          echo ""
          echo "== Versions referenced by catalog.json (pre-run) =="
          aws s3 cp "s3://$BUCKET/catalog.json" - --endpoint-url "$ENDPOINT" --region auto \
            | python3 -c "
          import json, sys
          for link in json.load(sys.stdin).get('links', []):
              if link.get('rel') == 'child':
                  print(f\"  {link['href']}  latest={link.get('latest', False)}\")
          "

          echo ""
          echo "== Per-prefix inventory (pre-run) =="
          for prefix in $(aws s3 ls "s3://$BUCKET/" --endpoint-url "$ENDPOINT" --region auto \
                          | awk '/PRE/ {print $2}'); do
            summary=$(aws s3 ls "s3://$BUCKET/$prefix" --recursive --summarize \
                        --endpoint-url "$ENDPOINT" --region auto | tail -2)
            objects=$(echo "$summary" | awk '/Total Objects/ {print $3}')
            bytes=$(echo "$summary" | awk '/Total Size/ {print $3}')
            gib=$(python3 -c "print(f'{$bytes/2**30:.2f}')")
            echo "$prefix  objects=$objects  size=${gib}GiB"
          done

      - name: Phase 1 - delete abandoned staging under kept versions
        if: steps.plan.outputs.phase1 == 'true'
        run: |
          set -euo pipefail
          # exported for the sourced helper below
          export ENDPOINT="https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          # shellcheck source=/dev/null
          source /tmp/r2-rm.sh
          # Deletes only phase-1 lines from the guarded target file. The version
          # itself must survive: finalize_rebuild.py excludes staging/ from the
          # release exact-set, so collection.json must still be there after.
          while IFS='|' read -r phase target; do
            [ "$phase" = "1" ] || continue
            case "$target" in */staging/) ;; *) echo "::error::not a staging target: $target"; exit 1;; esac
            echo "Deleting s3://$BUCKET/$target ..."
            RM "$target"
            version="${target%/staging/}"
            S3 s3 ls "s3://$BUCKET/$version/collection.json" >/dev/null \
              || { echo "::error::$version/collection.json missing after staging delete"; exit 1; }
            echo "$version/collection.json still present"
          done < /tmp/delete-targets.txt

      - name: Phase 2 - delete orphaned global-v2 staging prefix
        if: steps.plan.outputs.phase2 == 'true'
        run: |
          set -euo pipefail
          # exported for the sourced helper below
          export ENDPOINT="https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          # shellcheck source=/dev/null
          source /tmp/r2-rm.sh
          # Whole-prefix mode: the producing pipeline was deleted in PR #154 and
          # nothing references this digest.
          while IFS='|' read -r phase target; do
            [ "$phase" = "2" ] || continue
            printf '%s' "$target" | grep -Eq '^staging/global-v2/[0-9a-f]{64}/$' \
              || { echo "::error::phase 2 target failed re-validation: $target"; exit 1; }
            echo "Deleting s3://$BUCKET/$target ..."
            RM "$target"
          done < /tmp/delete-targets.txt

      - name: Phase 3 - delete unreferenced orphan version prefixes
        if: steps.plan.outputs.phase3 == 'true'
        run: |
          set -euo pipefail
          # exported for the sourced helper below
          export ENDPOINT="https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          # shellcheck source=/dev/null
          source /tmp/r2-rm.sh
          S3 s3 cp "s3://$BUCKET/catalog.json" /tmp/catalog-live.json
          while IFS='|' read -r phase target; do
            [ "$phase" = "3" ] || continue
            version="${target%/}"
            # Exact child link-target comparison against the *live* catalog, not
            # a substring grep. Exits non-zero if still referenced.
            python3 scripts/prune_catalog.py assert-unreferenced \
              --catalog /tmp/catalog-live.json --version "$version"
            echo "Deleting s3://$BUCKET/$target ..."
            RM "$target"
          done < /tmp/delete-targets.txt

      - name: Phase 4 - delete global-v2 address map objects only
        if: steps.plan.outputs.phase4 == 'true'
        run: |
          set -euo pipefail
          # exported for the sourced helper below
          export ENDPOINT="https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          # shellcheck source=/dev/null
          source /tmp/r2-rm.sh
          # Evidence-preserving mode: the objects subtree only. The 2026-07-22
          # checkpoint asks that manifests/, reports/ and inventory/ be retained
          # as benchmark evidence, so they are asserted present afterwards.
          while IFS='|' read -r phase target; do
            [ "$phase" = "4" ] || continue
            case "$target" in
              staging/global-v2/*/"$ADDRESSES_SUBTREE") ;;
              *) echo "::error::phase 4 may only delete $ADDRESSES_SUBTREE: $target"; exit 1;;
            esac
            printf '%s' "${target%"$ADDRESSES_SUBTREE"}" \
              | grep -Eq '^staging/global-v2/[0-9a-f]{64}/$' \
              || { echo "::error::phase 4 target failed re-validation: $target"; exit 1; }
            echo "Deleting s3://$BUCKET/$target ..."
            RM "$target"
            base="${target%"$ADDRESSES_SUBTREE"}"
            for keep in manifests reports inventory; do
              count=$(S3 s3 ls "s3://$BUCKET/${base}immutable/$keep/" --recursive \
                        | grep -c . || true)
              [ "$count" -gt 0 ] \
                || { echo "::error::evidence lost: ${base}immutable/$keep/ is empty"; exit 1; }
              echo "retained ${base}immutable/$keep/  objects=$count"
            done
          done < /tmp/delete-targets.txt

      - name: Prune catalog and verify
        if: steps.plan.outputs.phase5 == 'true'
        run: |
          set -euo pipefail
          # exported for the sourced helper below
          export ENDPOINT="https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          # shellcheck source=/dev/null
          source /tmp/r2-rm.sh

          S3 s3 cp "s3://$BUCKET/catalog.json" /tmp/catalog.json
          # Keep a timestamped backup in the bucket before editing
          S3 s3 cp /tmp/catalog.json "s3://$BUCKET/backups/catalog-$(date -u +%Y%m%dT%H%M%S).json"

          # Shared prune_catalog.py enforces the retention floor (>= the worker's
          # MAX_VERSION_ATTEMPTS fallback depth) and refuses to drop the latest
          # link. Same implementation the rebuild finalizer's retention prune
          # uses; the allowlist mode removes exactly the requested versions.
          # Only reached when phase 5 is selected, so --prune is never empty.
          python3 scripts/prune_catalog.py allowlist \
            --catalog /tmp/catalog.json --prune "$PRUNE_VERSIONS" --floor 4 \
            --output /tmp/catalog-new.json

          if python3 -c "
          import json
          a = json.load(open('/tmp/catalog.json'))
          b = json.load(open('/tmp/catalog-new.json'))
          raise SystemExit(0 if a == b else 1)
          "; then
            echo "catalog already clean, nothing to prune"
          else
            S3 s3 cp /tmp/catalog-new.json "s3://$BUCKET/catalog.json" \
              --content-type application/json
            # Readback must match what we wrote
            S3 s3 cp "s3://$BUCKET/catalog.json" /tmp/catalog-readback.json
            python3 -c "
          import json
          a = json.load(open('/tmp/catalog-new.json'))
          b = json.load(open('/tmp/catalog-readback.json'))
          assert a == b, 'catalog readback mismatch'
          print('catalog updated and verified')
          "
          fi

      - name: Verify live worker before deleting
        if: steps.plan.outputs.phase5 == 'true'
        run: |
          set -euo pipefail
          for path in "/health" "/search?q=boston" "/reverse?lat=42.36&lon=-71.06"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://geocoder.bradr.dev$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::live check failed: $path"; exit 1; }
          done

      - name: Wait out worker catalog cache TTL
        if: steps.plan.outputs.phase5 == 'true'
        # A worker can still serve the pre-prune catalog for up to
        # CATALOG_CACHE_TTL (300s, crates/geocoder-worker/src/stac/cache.rs)
        # plus the in-isolate text memo TTL (TEXT_MEMO_TTL_MS, 60s) and fall
        # back onto a version we are about to delete. Wait out that combined
        # worst-case staleness (360s + margin) after publishing the pruned
        # catalog, before any deletion.
        run: sleep 390

      - name: Phase 5 - delete pruned version prefixes
        if: steps.plan.outputs.phase5 == 'true'
        run: |
          set -euo pipefail
          # exported for the sourced helper below
          export ENDPOINT="https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          # shellcheck source=/dev/null
          source /tmp/r2-rm.sh
          S3 s3 cp "s3://$BUCKET/catalog.json" /tmp/catalog-live.json
          while IFS='|' read -r phase target; do
            [ "$phase" = "5" ] || continue
            version="${target%/}"
            # Guard: never delete anything the live catalog still references.
            python3 scripts/prune_catalog.py assert-unreferenced \
              --catalog /tmp/catalog-live.json --version "$version"
            echo "Deleting s3://$BUCKET/$target ..."
            RM "$target"
          done < /tmp/delete-targets.txt

      - name: Post-run live worker probe and inventory
        if: always() && steps.plan.outcome == 'success'
        run: |
          set -euo pipefail
          ENDPOINT="https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          for path in "/health" "/search?q=boston" "/reverse?lat=42.36&lon=-71.06" \
                      "/id/08b2a100-d664-7fff-0200-a44bcea04b76"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://geocoder.bradr.dev$path")
            echo "$path -> $code"
            case "$code" in 200|404) ;; *) echo "::error::live check failed: $path"; exit 1;; esac
          done

          echo ""
          echo "== Protected prefixes still present =="
          for prefix in $PROTECTED_PREFIXES; do
            count=$(aws s3 ls "s3://$BUCKET/$prefix/" --recursive \
                      --endpoint-url "$ENDPOINT" --region auto | grep -c . || true)
            echo "$prefix/  objects=$count"
            if [ "$count" -eq 0 ]; then
              # backups/ may legitimately be empty before the first phase-5 run;
              # a protected *version* prefix going empty is a hard failure.
              case "$prefix" in
                backups) echo "::warning::backups/ is empty";;
                *) echo "::error::protected prefix $prefix/ is empty"; exit 1;;
              esac
            fi
          done

          echo ""
          echo "== Remaining per-prefix inventory (post-run) =="
          for prefix in $(aws s3 ls "s3://$BUCKET/" --endpoint-url "$ENDPOINT" --region auto \
                          | awk '/PRE/ {print $2}'); do
            summary=$(aws s3 ls "s3://$BUCKET/$prefix" --recursive --summarize \
                        --endpoint-url "$ENDPOINT" --region auto | tail -2)
            objects=$(echo "$summary" | awk '/Total Objects/ {print $3}')
            bytes=$(echo "$summary" | awk '/Total Size/ {print $3}')
            gib=$(python3 -c "print(f'{$bytes/2**30:.2f}')")
            echo "$prefix  objects=$objects  size=${gib}GiB"
          done

      - name: Summarize the delete audit trail
        if: always() && steps.plan.outcome == 'success'
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## Deleted keys per target (dry_run=${DRY_RUN:-false})"
            echo ""
            echo '```'
            awk '/^=== /{if (name) print name" -> "n" keys"; name=$2; n=0; next}
                 /delete: s3:/{n++}
                 END{if (name) print name" -> "n" keys"}' /tmp/deleted-keys.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          wc -l /tmp/deleted-keys.log

      - name: Upload the delete audit log
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: r2-cleanup-deleted-keys
          path: /tmp/deleted-keys.log
          if-no-files-found: warn
