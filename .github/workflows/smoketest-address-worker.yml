name: Smoke Test Address Worker Page Reader

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoketest-address-worker
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  SMOKE_VERSION: smoketest-address

jobs:
  smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up Rust and Worker build
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install smoke tools
        run: |
          npm install -g wrangler
          cargo install worker-build --version '^0.7'

      - name: Pre-clean fixed smoke prefix
        run: |
          set -euo pipefail
          wrangler delete --config crates/geocoder-worker/wrangler.address-smoke.toml \
            --force >/dev/null 2>&1 || true
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          aws s3 rm "s3://geocoder-shards/${SMOKE_VERSION}/" --recursive \
            --only-show-errors \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto
          REMAINING=$(aws s3api list-objects-v2 \
            --bucket geocoder-shards --prefix "${SMOKE_VERSION}/" --max-keys 1 \
            --query KeyCount --output text \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto)
          test "$REMAINING" = "0"

      - name: Build deterministic address page fixture
        run: |
          python scripts/prepare_address_worker_smoke.py \
            --output-dir /tmp/address-worker-smoke
          cat /tmp/address-worker-smoke/report.json

      - name: Upload and verify isolated R2 fixture
        run: |
          set -euo pipefail
          for name in useful_gzip.bin useful_gzip.idx; do
            wrangler r2 object put "geocoder-shards/${SMOKE_VERSION}/${name}" \
              --file "/tmp/address-worker-smoke/${name}" --remote
            wrangler r2 object get "geocoder-shards/${SMOKE_VERSION}/${name}" \
              --remote --pipe > "/tmp/readback-${name}"
            cmp "/tmp/address-worker-smoke/${name}" "/tmp/readback-${name}"
          done

      - name: Deploy isolated address preview Worker
        working-directory: crates/geocoder-worker
        run: |
          set -euo pipefail
          DEPLOY_LOG=$(mktemp)
          wrangler deploy --config wrangler.address-smoke.toml 2>&1 | tee "$DEPLOY_LOG"
          PREVIEW_URL=$(grep -oE 'https://[^[:space:]]+\.workers\.dev' "$DEPLOY_LOG" | tail -1)
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Wait for preview propagation without touching R2
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "${PREVIEW_URL}/" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Preview Worker did not become reachable"
          exit 1

      - name: Measure cold and warm indexed range reads
        run: |
          set -euo pipefail
          : > /tmp/address-worker-timings.jsonl
          for attempt in 1 2 3 4 5 6; do
            BODY=$(mktemp)
            HEADERS=$(mktemp)
            TIME_TOTAL=$(curl --fail --silent --show-error \
              --dump-header "$HEADERS" --output "$BODY" \
              --write-out '%{time_total}' \
              "${PREVIEW_URL}/__address-page-spike")
            jq -e '
              .schema == "overture-address-worker-spike-v1"
              and .candidate_count == 137
              and .first.street == "Main Street"
              and .first.address_levels == ["MA", "Middlesex", "Stoneham"]
              and .last_id == "00000000-0000-0000-0000-000000000089"
            ' "$BODY"
            SERVER_TIMING=$(awk 'BEGIN{IGNORECASE=1} /^server-timing:/ {sub(/\r$/, ""); print substr($0, index($0,$2)); exit}' "$HEADERS")
            jq -cn --argjson attempt "$attempt" --argjson time_total "$TIME_TOTAL" \
              --arg server_timing "$SERVER_TIMING" \
              '{attempt:$attempt,time_total_seconds:$time_total,server_timing:$server_timing}' \
              >> /tmp/address-worker-timings.jsonl
          done
          jq -s '{schema:"overture-address-worker-latency-spike-v1", samples:.}' \
            /tmp/address-worker-timings.jsonl | tee /tmp/address-worker-latency.json

      - name: Summarize measurement
        if: always()
        run: |
          {
            echo "## Address Worker page-reader smoke"
            echo
            echo '```json'
            test -f /tmp/address-worker-smoke/report.json && cat /tmp/address-worker-smoke/report.json
            test -f /tmp/address-worker-latency.json && cat /tmp/address-worker-latency.json
            echo '```'
            echo
            echo "The fixture uses a fixed isolated prefix and preview Worker; cleanup is mandatory and no catalog or production state is written."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete preview Worker and fixed-prefix objects
        if: always()
        run: |
          set +e
          FAILED=0
          wrangler delete --config crates/geocoder-worker/wrangler.address-smoke.toml --force
          if [ "$?" -ne 0 ]; then FAILED=1; fi
          WORKER_API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/geocoder-address-smoke"
          WORKER_STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$WORKER_API")
          if [ "$WORKER_STATUS" != "404" ]; then
            echo "::error::Address smoke Worker still exists or could not be verified (HTTP ${WORKER_STATUS})"
            FAILED=1
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 rm "s3://geocoder-shards/${SMOKE_VERSION}/" --recursive \
            --only-show-errors --endpoint-url "$ENDPOINT" --region auto
          REMAINING=$(aws s3api list-objects-v2 \
            --bucket geocoder-shards --prefix "${SMOKE_VERSION}/" --max-keys 1 \
            --query KeyCount --output text --endpoint-url "$ENDPOINT" --region auto)
          if [ "$REMAINING" != "0" ]; then
            echo "::error::Address smoke cleanup left R2 objects"
            FAILED=1
          fi
          exit "$FAILED"
