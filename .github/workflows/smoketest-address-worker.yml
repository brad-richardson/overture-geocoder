name: Smoke Test Address Worker Page Reader

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoketest-address-worker
  cancel-in-progress: true

env:
  SMOKE_VERSION: smoketest-address-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up Rust and Worker build
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install smoke tools
        run: |
          npm install -g wrangler@4.111.0
          cargo install worker-build --version 0.7.5 --locked
          python -m pip install --only-binary=:all: --require-hashes \
            -r .github/requirements-hosted-rowgroup.txt

      - name: Pre-clean fixed smoke prefix
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          WORKER_API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/geocoder-address-smoke"
          curl --silent --show-error --request DELETE \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /dev/null "$WORKER_API" || true
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          aws s3 rm "s3://geocoder-shards/${SMOKE_VERSION}/" --recursive \
            --only-show-errors \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto
          REMAINING=$(aws s3api list-objects-v2 \
            --bucket geocoder-shards --prefix "${SMOKE_VERSION}/" --max-keys 1 \
            --query KeyCount --output text \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto)
          test "$REMAINING" = "0"

      - name: Build representative current-release address shard
        run: |
          set -euo pipefail
          mkdir -p /tmp/address-worker-smoke
          /usr/bin/time -v python scripts/experiment_hosted_rowgroups.py \
            --release 2026-06-17.0 --family addresses \
            --inventory-report benchmarks/address-rowgroup-inventory-report.json \
            --task-index 48 \
            --output /tmp/address-worker-smoke/projected.parquet \
            --json-out /tmp/address-worker-smoke/projection-report.json \
            --target-rowgroup-uncompressed-bytes 350000000 \
            --max-rows 4000000 --max-groups 72 --max-output-bytes 500000000
          /usr/bin/time -v python scripts/experiment_address_reduce.py \
            --input /tmp/address-worker-smoke/projected.parquet \
            --output /tmp/address-worker-smoke/reduced.aidx \
            --json-out /tmp/address-worker-smoke/reduce-report.json \
            --work-dir /tmp --max-rows 4000000 --fragment-rows 128000 \
            --sparse-stride 256 --max-artifact-bytes 1000000000 \
            --max-workspace-bytes 12000000000
          /usr/bin/time -v python scripts/experiment_address_compression.py \
            --input /tmp/address-worker-smoke/reduced.aidx \
            --output-dir /tmp/address-worker-smoke \
            --json-out /tmp/address-worker-smoke/report.json \
            --page-rows 256 --planning-rows 473576753 \
            --max-input-bytes 1000000000 --max-output-bytes 1000000000 \
            --max-workspace-bytes 6000000000 --max-page-bytes 8388608 \
            --max-page-rows 10000
          LOOKUP_QUERY=$(jq -r '
            .oracle.verification_groups | max_by(.count) | .key |
            map(@uri) | map("k=" + .) | join("&")
          ' /tmp/address-worker-smoke/report.json)
          EXPECTED_COUNT=$(jq -r '.oracle.verification_groups | max_by(.count) | .count' \
            /tmp/address-worker-smoke/report.json)
          EXPECTED_DIGEST=$(jq -r '.oracle.verification_groups | max_by(.count) | .id_sha256' \
            /tmp/address-worker-smoke/report.json)
          test -n "$LOOKUP_QUERY"
          test "$EXPECTED_COUNT" -gt 0
          echo "LOOKUP_QUERY=$LOOKUP_QUERY" >> "$GITHUB_ENV"
          echo "EXPECTED_COUNT=$EXPECTED_COUNT" >> "$GITHUB_ENV"
          echo "EXPECTED_DIGEST=$EXPECTED_DIGEST" >> "$GITHUB_ENV"

      - name: Upload and verify isolated R2 fixture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in useful_gzip.bin useful_gzip.idx; do
            wrangler r2 object put "geocoder-shards/${SMOKE_VERSION}/${name}" \
              --file "/tmp/address-worker-smoke/${name}" --remote
            wrangler r2 object get "geocoder-shards/${SMOKE_VERSION}/${name}" \
              --remote --pipe > "/tmp/readback-${name}"
            cmp "/tmp/address-worker-smoke/${name}" "/tmp/readback-${name}"
          done

      - name: Deploy isolated address preview Worker
        working-directory: crates/geocoder-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DEPLOY_LOG=$(mktemp)
          wrangler deploy --config wrangler.address-smoke.toml \
            --var ENVIRONMENT:address-smoke \
            --var "ADDRESS_SPIKE_PREFIX:${SMOKE_VERSION}" \
            2>&1 | tee "$DEPLOY_LOG"
          PREVIEW_URL=$(grep -oE 'https://[^[:space:]]+\.workers\.dev' "$DEPLOY_LOG" | tail -1)
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Wait for preview propagation without touching R2
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "${PREVIEW_URL}/" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Preview Worker did not become reachable"
          exit 1

      - name: Measure cold and warm indexed range reads
        run: |
          set -euo pipefail
          : > /tmp/address-worker-timings.jsonl
          for attempt in 1 2 3 4 5 6; do
            BODY=$(mktemp)
            HEADERS=$(mktemp)
            HTTP_STATUS=""
            TIME_TOTAL=""
            # A newly deployed workers.dev script can briefly alternate with a
            # previous/missing version while propagating between edge hosts.
            # Ignore only that transient 404; the first successful response is
            # still the cold R2 sample and every successful body remains strict.
            for propagation_attempt in $(seq 1 12); do
              read -r HTTP_STATUS TIME_TOTAL < <(curl --silent --show-error \
                --dump-header "$HEADERS" --output "$BODY" \
                --write-out '%{http_code} %{time_total}\n' \
                "${PREVIEW_URL}/__address-page-spike?${LOOKUP_QUERY}")
              if [ "$HTTP_STATUS" = "200" ]; then
                break
              fi
              if [ "$HTTP_STATUS" != "404" ]; then
                echo "::error::Address page spike returned HTTP ${HTTP_STATUS}"
                cat "$BODY"
                exit 1
              fi
              sleep 2
            done
            test "$HTTP_STATUS" = "200"
            jq -e '
              .schema == "overture-address-worker-spike-v2"
              and .candidate_count == (env.EXPECTED_COUNT | tonumber)
              and (.ids | length) == .candidate_count
              and .first.source_object_index >= 0
              and .index_bytes > 0
              and .stored_page_bytes > 0
              and .decoded_page_bytes > 0
              and .materialized_page_bytes > 0
              and .read_metrics.logical_ranges == 3
            ' "$BODY"
            python - "$BODY" "$EXPECTED_DIGEST" <<'PY'
          import hashlib
          import json
          import sys
          import uuid

          body = json.load(open(sys.argv[1]))
          digest = hashlib.sha256()
          for value in body["ids"]:
              digest.update(uuid.UUID(value).bytes)
          if digest.hexdigest() != sys.argv[2]:
              raise SystemExit("Worker candidate IDs differ from producer oracle")
          PY
            SERVER_TIMING=$(awk 'BEGIN{IGNORECASE=1} /^server-timing:/ {sub(/\r$/, ""); print substr($0, index($0,$2)); exit}' "$HEADERS")
            jq -cn --argjson attempt "$attempt" --argjson time_total "$TIME_TOTAL" \
              --arg server_timing "$SERVER_TIMING" \
              '{attempt:$attempt,time_total_seconds:$time_total,server_timing:$server_timing}' \
              >> /tmp/address-worker-timings.jsonl
          done
          jq -e '.candidate_count == 0 and .ids == []' <(
            curl --fail --silent --show-error \
              "${PREVIEW_URL}/__address-page-spike?k=zzzz&k=&k=&k=&k=&k=&k=&k="
          )
          jq -s '{schema:"overture-address-worker-latency-spike-v1", samples:.}' \
            /tmp/address-worker-timings.jsonl | tee /tmp/address-worker-latency.json

      - name: Summarize measurement
        if: always()
        run: |
          {
            echo "## Address Worker page-reader smoke"
            echo
            echo '```json'
            test -f /tmp/address-worker-smoke/projection-report.json && cat /tmp/address-worker-smoke/projection-report.json
            test -f /tmp/address-worker-smoke/reduce-report.json && cat /tmp/address-worker-smoke/reduce-report.json
            test -f /tmp/address-worker-smoke/report.json && cat /tmp/address-worker-smoke/report.json
            test -f /tmp/address-worker-latency.json && cat /tmp/address-worker-latency.json
            echo '```'
            echo
            echo "The representative shard uses a run-isolated prefix and preview Worker; cleanup is mandatory and no catalog or production state is written."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete preview Worker and fixed-prefix objects
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set +e
          FAILED=0
          WORKER_API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/geocoder-address-smoke"
          DELETE_STATUS=$(curl --silent --show-error --request DELETE \
            --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$WORKER_API")
          if [ "$DELETE_STATUS" != "200" ] && [ "$DELETE_STATUS" != "404" ]; then
            echo "::error::Address smoke Worker delete failed (HTTP ${DELETE_STATUS})"
            FAILED=1
          fi
          WORKER_STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$WORKER_API")
          if [ "$WORKER_STATUS" != "404" ]; then
            echo "::error::Address smoke Worker still exists or could not be verified (HTTP ${WORKER_STATUS})"
            FAILED=1
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 rm "s3://geocoder-shards/${SMOKE_VERSION}/" --recursive \
            --only-show-errors --endpoint-url "$ENDPOINT" --region auto
          REMAINING=$(aws s3api list-objects-v2 \
            --bucket geocoder-shards --prefix "${SMOKE_VERSION}/" --max-keys 1 \
            --query KeyCount --output text --endpoint-url "$ENDPOINT" --region auto)
          if [ "$REMAINING" != "0" ]; then
            echo "::error::Address smoke cleanup left R2 objects"
            FAILED=1
          fi
          exit "$FAILED"
