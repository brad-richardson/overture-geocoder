name: Deploy Rust Worker

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: 
      - completed
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # Pinned so the deploy is reproducible and the build cache key is meaningful.
  WORKER_BUILD_VERSION: "0.8.5"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run != null && github.event.workflow_run.conclusion == 'success') }}
    concurrency:
      group: deploy-rust-worker-production
      cancel-in-progress: false
    steps:
      - name: Check out the CI-tested commit
        uses: actions/checkout@v7
        with:
          # workflow_run executes in the default-branch context, so github.sha
          # is not necessarily the commit that passed CI. A manual dispatch
          # has no workflow_run payload and should use its selected ref's SHA.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      # The wasm32 build was recompiled from scratch on every deploy. Cargo's
      # fingerprinting still decides what to rebuild, and the post-deploy smoke
      # checks below verify the artifact that actually reached production, so a
      # warm target directory cannot let a stale binary through unnoticed.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          key: wasm32

      - name: Install LLVM and Clang
        # ubuntu-latest ships clang and llvm preinstalled, so this was ~40s of
        # apt work per deploy for tools that were already present. Install only
        # when they are genuinely missing rather than dropping the step, so a
        # future runner image that omits them still deploys.
        run: |
          if command -v clang >/dev/null && command -v llvm-ar >/dev/null; then
            echo "clang $(clang --version | head -1) and llvm already present; skipping apt"
          else
            sudo apt-get update
            sudo apt-get install -y llvm clang
          fi

      # worker-build was compiled from source on every deploy (~98s of CPU).
      # Pin it so the cache key is meaningful -- and so a deploy is reproducible
      # rather than silently picking up whatever version crates.io last
      # published -- and only build on a cache miss.
      - name: Cache worker-build
        id: cache-worker-build
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-${{ runner.os }}-${{ env.WORKER_BUILD_VERSION }}

      - name: Install worker-build
        # Pinned because an unpinned `cargo install` broke a preview build
        # once already (#243). The pin is WORKER_BUILD_VERSION = 0.8.5, which
        # is what the 2026-08-04 production deploy actually installed and
        # built successfully against `worker = "0.7"` -- verified from that
        # run's log. Do not "restore" a '^0.7' pin on the theory that
        # worker-build 0.8 requires worker >=0.8: that would move the
        # production deploy off the only combination proven to work here.
        if: steps.cache-worker-build.outputs.cache-hit != 'true'
        run: cargo install worker-build --locked --version "${WORKER_BUILD_VERSION}"

      - name: Build and Deploy Worker
        working-directory: crates/geocoder-worker
        run: |
          npm install wrangler@4.118.0
          npx wrangler deploy

      - name: Post-deploy verification
        env:
          BASE_URL: https://geocoder.bradr.dev
        run: |
          set -uo pipefail

          # Repeatedly hit the route-independent root before checking data
          # behavior. A single request can miss a bad runtime isolate or a
          # partially unhealthy rollout; fifteen clean starts makes that
          # failure mode visible while keeping three attempts under 60 req/min.
          run_startup_checks() {
            local probe
            for probe in $(seq 1 15); do
              curl -fsS --max-time 15 "$BASE_URL/" >/dev/null || {
                echo "  FAIL / startup probe $probe/15: request error"
                return 1
              }
            done
            echo "  OK   / (15 consecutive startup probes)"
          }

          # One pass of the four functional checks against the live worker.
          # Returns 0 only when every check passes.
          run_checks() {
            local health health_version search reverse data_version gers_id id_json

            health=$(curl -fsS --max-time 15 "$BASE_URL/health") || {
              echo "  FAIL /health: request error"; return 1; }
            echo "$health" | jq -e '.status == "ok"' >/dev/null || {
              echo "  FAIL /health: status not ok -> $health"; return 1; }
            health_version=$(echo "$health" | jq -er '.version | select(type == "string" and length > 0)') || {
              echo "  FAIL /health: missing data version -> $health"; return 1; }
            echo "  OK   /health (data $health_version)"

            search=$(curl -fsS --max-time 15 "$BASE_URL/search?q=berlin&limit=1") || {
              echo "  FAIL /search: request error"; return 1; }
            echo "$search" | jq -e '
              (.results | length) >= 1
              and .results[0].country == "DE"
              and (.results[0].lat | type == "number")
              and (.results[0].lon | type == "number")
              and (.results[0].lat >= 51 and .results[0].lat <= 54)
              and (.results[0].lon >= 12 and .results[0].lon <= 15)
            ' >/dev/null || {
              echo "  FAIL /search: expected DE near Berlin (52.5,13.4) -> $search"; return 1; }
            echo "  OK   /search"

            reverse=$(curl -fsS --max-time 15 "$BASE_URL/reverse?lat=42.3601&lon=-71.0589") || {
              echo "  FAIL /reverse: request error"; return 1; }
            data_version=$(echo "$reverse" | jq -er '.data_version | select(type == "string" and length > 0)') || {
              echo "  FAIL /reverse: missing data_version -> $reverse"; return 1; }
            if [ "$data_version" != "$health_version" ]; then
              echo "  FAIL /reverse: data version $data_version does not match /health $health_version -> $reverse"
              return 1
            fi

            if [ "$data_version" = "2026-07-02.3" ]; then
              # This legacy shard predates locality ingestion. Keep the
              # exception exact and still require the expected US hierarchy;
              # unrelated country/county fallbacks must fail the deployment.
              echo "$reverse" | jq -e '
                .subtype == "county"
                and (.primary_name // "" | test("Suffolk"; "i"))
                and (.hierarchy | length >= 2)
                and any(.hierarchy[]; .subtype == "county" and (.name // "" | test("Suffolk"; "i")))
                and any(.hierarchy[];
                  .subtype == "country"
                  and (.name // "" | test("United States|(^|, )US$|^USA$"; "i"))
                )
              ' >/dev/null || {
                echo "  FAIL /reverse: expected legacy Suffolk county with country hierarchy for $data_version -> $reverse"
                return 1
              }
              echo "  OK   /reverse (legacy Suffolk county; data $data_version)"
            else
              echo "$reverse" | jq -e '
                (.subtype == "locality" or .hierarchy[0].subtype == "locality")
                and (.primary_name // "" | test("Boston"; "i"))
                and (.hierarchy | length >= 2)
                and any(.hierarchy[];
                  .subtype == "country"
                  and (.name // "" | test("United States|(^|, )US$|^USA$"; "i"))
                )
              ' >/dev/null || {
                echo "  FAIL /reverse: expected Boston locality with country hierarchy for $data_version -> $reverse"
                return 1
              }
              echo "  OK   /reverse (Boston locality; data $data_version)"
            fi

            # Derive the ID from the search result so we never hardcode a GERS
            # ID that can churn between releases.
            gers_id=$(echo "$search" | jq -r '.results[0].gers_id // empty')
            if [ -z "$gers_id" ]; then
              echo "  FAIL /id: no gers_id in /search response"; return 1; fi
            id_json=$(curl -fsS --max-time 15 "$BASE_URL/id/$gers_id") || {
              echo "  FAIL /id/$gers_id: request error"; return 1; }
            echo "$id_json" | jq -e '
              .bbox
              and (.bbox.xmin | type == "number")
              and (.bbox.xmax | type == "number")
              and (.bbox.ymin | type == "number")
              and (.bbox.ymax | type == "number")
              and (.bbox.xmin < .bbox.xmax)
              and (.bbox.ymin < .bbox.ymax)
              and .bbox.xmin >= -180 and .bbox.xmax <= 180
              and .bbox.ymin >= -90 and .bbox.ymax <= 90
            ' >/dev/null || {
              echo "  FAIL /id/$gers_id: bbox sanity check failed -> $id_json"; return 1; }
            echo "  OK   /id ($gers_id)"

            return 0
          }

          # Retry a few times so brief deploy propagation doesn't fail the run.
          for attempt in 1 2 3; do
            echo "Post-deploy checks, attempt $attempt/3:"
            if run_startup_checks && run_checks; then
              echo "All post-deploy checks passed."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 10s..."
              sleep 10
            fi
          done

          echo "Post-deploy checks failed after 3 attempts." >&2
          exit 1
