name: Smoke Test R2 Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/smoketest-r2-pipeline.yml'
      - '.github/workflows/rebuild-r2-shards.yml'
  workflow_dispatch:

# Smoke tests share the fixed "smoketest" R2 version prefix: two concurrent
# runs (e.g. back-to-back pushes touching scripts/) would read each other's
# staging markers and skip phases, or race one run's cleanup against the
# other's build. Queue instead.
concurrency:
  group: smoketest-r2-pipeline
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  # Fixed version prefix for smoke tests (never collides with real date-based versions)
  SMOKE_VERSION: smoketest

jobs:
  smoketest:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install DuckDB CLI
        run: |
          curl -L -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-aarch64.zip
          unzip duckdb.zip
          sudo mv duckdb /usr/local/bin/

      - name: Install Python dependencies
        run: pip install duckdb

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install -g wrangler

      # Stale staging markers from a previous run would make the ID phases
      # below silently skip (they're marker-resumable), turning the smoke
      # test into a no-op. Start from a clean slate.
      - name: Pre-clean stale smoketest data
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          aws s3 rm "s3://geocoder-shards/${SMOKE_VERSION}/" --recursive \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto | tail -1 || true

      # --- Shard pipeline (forward + reverse for a tiny country) ---

      - name: Download divisions data
        run: ./scripts/download_divisions.sh

      - name: Build forward shards (MC only, skip HEAD)
        run: python scripts/build_shards.py --version $SMOKE_VERSION --countries MC --skip-head

      - name: Build reverse shards (MC only, skip HEAD)
        run: python scripts/build_shards.py --version $SMOKE_VERSION --countries MC --skip-head --reverse

      - name: Upload test shards to R2
        run: |
          # Upload collection metadata
          wrangler r2 object put "geocoder-shards/${SMOKE_VERSION}/collection.json" \
            --file "shards/${SMOKE_VERSION}/collection.json" --remote
          wrangler r2 object put "geocoder-shards/${SMOKE_VERSION}/reverse-collection.json" \
            --file "shards/${SMOKE_VERSION}/reverse-collection.json" --remote

          # Upload shard databases
          for f in shards/${SMOKE_VERSION}/shards/*.db; do
            name=$(basename "$f")
            wrangler r2 object put "geocoder-shards/${SMOKE_VERSION}/shards/${name}" \
              --file "$f" --remote
          done
          for f in shards/${SMOKE_VERSION}/reverse/*.db; do
            name=$(basename "$f")
            wrangler r2 object put "geocoder-shards/${SMOKE_VERSION}/reverse/${name}" \
              --file "$f" --remote
          done

      - name: Verify shard uploads
        run: |
          FAILED=0
          for key in \
            "${SMOKE_VERSION}/collection.json" \
            "${SMOKE_VERSION}/shards/MC.db" \
            "${SMOKE_VERSION}/reverse-collection.json" \
            "${SMOKE_VERSION}/reverse/MC.db"
          do
            if wrangler r2 object get "geocoder-shards/${key}" --remote --pipe > /dev/null 2>&1; then
              echo "  ok: ${key}"
            else
              echo "  FAIL: ${key}"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Shard smoke test verification failed"
            exit 1
          fi
          echo "Shard verification passed."

      # --- ID index pipeline (registry + release, smoke test) ---

      - name: Stage registry (smoke test)
        run: |
          python scripts/build_id_index.py \
            --phase stage-registry \
            --version $SMOKE_VERSION \
            --prefix-len 3 \
            --smoke-test \
            --workers 2

      - name: Stage base (smoke test)
        run: |
          python scripts/build_id_index.py \
            --phase stage-base \
            --version $SMOKE_VERSION \
            --prefix-len 3 \
            --smoke-test \
            --workers 2

      - name: Build ID shards (smoke test)
        run: |
          python scripts/build_id_index.py \
            --phase build \
            --version $SMOKE_VERSION \
            --prefix-len 3 \
            --smoke-test \
            --workers 2

      - name: Build ID metadata (smoke test)
        run: |
          python scripts/build_id_index.py \
            --phase metadata \
            --version $SMOKE_VERSION \
            --prefix-len 3 \
            --smoke-test

      - name: Verify ID index uploads
        run: |
          if wrangler r2 object get "geocoder-shards/${SMOKE_VERSION}/id-collection.json" --remote --pipe > /dev/null 2>&1; then
            echo "  ok: ${SMOKE_VERSION}/id-collection.json"
          else
            echo "::error::${SMOKE_VERSION}/id-collection.json NOT FOUND"
            exit 1
          fi
          echo "ID index verification passed."

      # --- Cleanup: remove all smoketest objects from R2 ---

      - name: Cleanup test data from R2
        if: always()
        # NOTE: `wrangler r2 object list` no longer exists — the old
        # wrangler-based cleanup silently deleted nothing for months and
        # stale markers made every later smoke test skip its ID phases.
        run: |
          echo "Cleaning up smoke test data from R2..."
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          # Non-fatal: a transient R2 error here must not fail an otherwise
          # green run (default pipefail would). Stale leftovers are removed
          # by the pre-clean step at the start of the next run.
          aws s3 rm "s3://geocoder-shards/${SMOKE_VERSION}/" --recursive \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto | wc -l | xargs -I{} echo "Deleted {} objects from R2." \
            || echo "::warning::R2 cleanup failed; the next run's pre-clean step will remove leftovers."

      - name: Summary
        if: always()
        run: |
          echo "## R2 Pipeline Smoke Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Country:** MC (Monaco)" >> $GITHUB_STEP_SUMMARY
          echo "**ID index limit:** 50 records" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
