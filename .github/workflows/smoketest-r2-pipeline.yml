name: Smoke Test R2 Shards

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_shards.py'
      - 'scripts/download_divisions.sh'
      - 'scripts/download_divisions_smoke.py'
      - 'scripts/monaco_smoke_contract.json'
      - 'scripts/verify_monaco_export.py'
      - 'scripts/verify_monaco_evidence.py'
      - 'scripts/verify_shard_smoke_readback.py'
      - 'scripts/download_divisions_area.sql'
      - 'scripts/download_divisions_global.sql'
      - 'scripts/stac.py'
      - '.github/workflows/rebuild-r2-shards.yml'
      - '.github/workflows/smoketest-r2-pipeline.yml'
  workflow_dispatch:

# This smoke uses a fixed, shard-family-only R2 prefix. Cancel an older shard
# run before its replacement starts so their pre-clean/build/cleanup phases
# cannot overlap. The ID smoke has a different prefix and concurrency group.
concurrency:
  group: smoketest-r2-shards
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  # Fixed family-specific prefix (never collides with real date-based versions)
  SMOKE_VERSION: smoketest-shards

jobs:
  smoketest:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install DuckDB CLI
        run: |
          # Keep the CLI and Python package aligned with the production build.
          curl -L -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.1/duckdb_cli-linux-arm64.zip
          unzip duckdb.zip
          sudo mv duckdb /usr/local/bin/
          duckdb --version

      - name: Install Python dependencies
        run: pip install duckdb==1.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install -g wrangler

      # A prior interrupted run may leave objects under the fixed family
      # prefix. Start from a clean slate so verification tests this run.
      - name: Pre-clean stale smoketest data
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          aws s3 rm "s3://geocoder-shards/${SMOKE_VERSION}/" --recursive \
            --only-show-errors \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto
          REMAINING=$(aws s3api list-objects-v2 \
            --bucket geocoder-shards \
            --prefix "${SMOKE_VERSION}/" \
            --max-keys 1 \
            --query 'KeyCount' \
            --output text \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto)
          if [ "$REMAINING" != "0" ]; then
            echo "::error::Pre-clean left objects under ${SMOKE_VERSION}/"
            exit 1
          fi

      - name: Discover Overture release once
        run: |
          RELEASE=$(python3 scripts/stac.py | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+' | head -1)
          if [ -z "$RELEASE" ]; then
            echo "::error::Failed to discover latest Overture release from STAC"
            exit 1
          fi
          echo "OVERTURE_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "Overture release: $RELEASE"

      - name: Download Monaco divisions subset
        run: ./scripts/download_divisions.sh --smoke-monaco "$OVERTURE_RELEASE"

      - name: Verify pinned Monaco equivalence evidence is current
        run: python scripts/verify_monaco_evidence.py --check docs/plans/2026-07-12-monaco-subset-evidence.json

      - name: Verify extraction pushdown and runtime gates
        run: |
          jq -e '
            .country_code == "MC"
            and .timings_seconds.total < 60
            and (0 < .scan_profiles.division.metadata_eligible_row_groups)
            and (.scan_profiles.division.metadata_eligible_row_groups < .scan_profiles.division.total_row_groups)
            and (0 < .scan_profiles.division_area.metadata_eligible_row_groups)
            and (.scan_profiles.division_area.metadata_eligible_row_groups < .scan_profiles.division_area.total_row_groups)
            and .scan_profiles.division.plan_has_country_filter
            and .scan_profiles.division.plan_has_bbox_filter
            and .scan_profiles.division_area.plan_has_bbox_filter
            and (.scan_profiles.division_area.profiled_predicate == "actual rendered country-or-division_id ownership predicate plus bbox")
          ' exports/monaco-export-profile.json
          cat exports/monaco-export-profile.json

      - name: Upload Monaco extraction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monaco-extraction-evidence
          path: |
            exports/monaco-export-profile.json
            exports/monaco-division-scan-plan.json
            exports/monaco-division-scan-profile.json
            exports/monaco-division-area-scan-plan.json
            exports/monaco-division-area-scan-profile.json
          if-no-files-found: warn

      - name: Build forward shards (MC only, skip HEAD)
        run: python scripts/build_shards.py --version $SMOKE_VERSION --countries MC --skip-head

      - name: Build reverse shards (MC only, skip HEAD)
        run: python scripts/build_shards.py --version $SMOKE_VERSION --countries MC --skip-head --reverse

      - name: Upload test shards to R2
        run: |
          # Data objects are published before metadata can reference them.
          # In particular router.db must exist before collection.json exposes
          # its router record to a reader.
          test -f "shards/${SMOKE_VERSION}/router.db"
          jq -e '.router.href == "./router.db"' \
            "shards/${SMOKE_VERSION}/collection.json" >/dev/null
          for f in shards/${SMOKE_VERSION}/shards/*.db; do
            name=$(basename "$f")
            wrangler r2 object put "geocoder-shards/${SMOKE_VERSION}/shards/${name}" \
              --file "$f" --remote
          done
          for f in shards/${SMOKE_VERSION}/reverse/*.db; do
            name=$(basename "$f")
            wrangler r2 object put "geocoder-shards/${SMOKE_VERSION}/reverse/${name}" \
              --file "$f" --remote
          done
          wrangler r2 object put "geocoder-shards/${SMOKE_VERSION}/router.db" \
            --file "shards/${SMOKE_VERSION}/router.db" --remote

          wrangler r2 object put "geocoder-shards/${SMOKE_VERSION}/collection.json" \
            --file "shards/${SMOKE_VERSION}/collection.json" --remote
          wrangler r2 object put "geocoder-shards/${SMOKE_VERSION}/reverse-collection.json" \
            --file "shards/${SMOKE_VERSION}/reverse-collection.json" --remote

      - name: Verify and query fresh R2 readbacks
        run: |
          READBACK=$(mktemp -d)
          wrangler r2 object get "geocoder-shards/${SMOKE_VERSION}/collection.json" \
            --remote --file "$READBACK/collection.json"
          wrangler r2 object get "geocoder-shards/${SMOKE_VERSION}/reverse-collection.json" \
            --remote --file "$READBACK/reverse-collection.json"
          jq -e '.items.MC.href == "./shards/MC.db"' \
            "$READBACK/collection.json" >/dev/null
          jq -e '.items.MC.href == "./reverse/MC.db"' \
            "$READBACK/reverse-collection.json" >/dev/null
          wrangler r2 object get "geocoder-shards/${SMOKE_VERSION}/shards/MC.db" \
            --remote --file "$READBACK/MC.db"
          wrangler r2 object get "geocoder-shards/${SMOKE_VERSION}/reverse/MC.db" \
            --remote --file "$READBACK/reverse-MC.db"
          wrangler r2 object get "geocoder-shards/${SMOKE_VERSION}/router.db" \
            --remote --file "$READBACK/router.db"
          python scripts/verify_shard_smoke_readback.py \
            --collection "$READBACK/collection.json" \
            --reverse-collection "$READBACK/reverse-collection.json" \
            --forward-db "$READBACK/MC.db" \
            --reverse-db "$READBACK/reverse-MC.db" \
            --router-db "$READBACK/router.db"

      - name: Cleanup test data from R2
        if: always()
        # NOTE: `wrangler r2 object list` no longer exists — the old
        # wrangler-based cleanup silently deleted nothing for months and
        # left test objects behind. Use the paginated S3 client instead.
        run: |
          echo "Cleaning up smoke test data from R2..."
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          # Non-fatal: a transient R2 error here must not fail an otherwise
          # green run (default pipefail would). Stale leftovers are removed
          # by the pre-clean step at the start of the next run.
          aws s3 rm "s3://geocoder-shards/${SMOKE_VERSION}/" --recursive \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto | wc -l | xargs -I{} echo "Deleted {} objects from R2." \
            || echo "::warning::R2 cleanup failed; the next run's pre-clean step will remove leftovers."

      - name: Summary
        if: always()
        run: |
          echo "## Forward/Reverse R2 Shard Smoke Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Country:** MC (Monaco)" >> $GITHUB_STEP_SUMMARY
          echo "**Overture release:** ${OVERTURE_RELEASE}" >> $GITHUB_STEP_SUMMARY
          echo "**R2 prefix:** ${SMOKE_VERSION}" >> $GITHUB_STEP_SUMMARY
          if [ -f exports/monaco-export-profile.json ]; then
            echo "**Extraction:** $(jq -r '.timings_seconds.total')s; division metadata-eligible row groups $(jq -r '.scan_profiles.division.metadata_eligible_row_groups')/$(jq -r '.scan_profiles.division.total_row_groups'); area metadata-eligible row groups $(jq -r '.scan_profiles.division_area.metadata_eligible_row_groups')/$(jq -r '.scan_profiles.division_area.total_row_groups')" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
