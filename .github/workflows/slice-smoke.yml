name: Construction v1 slice smoke

# The construction-v1 execute data plane had ZERO automated coverage: the
# workflow's dry-run mode runs planning arithmetic only, so three consecutive
# planet dispatches each died in their first minutes on a one-line defect a
# dry-run cannot see. See item 5 of
# docs/plans/2026-07-24-construction-v1-follow-ups.md.
#
# This runs the REAL construction-v1 data plane on real Overture slices -- S3
# projection, transform binary, store writes, reduce, head, finalize -- for BOTH
# families, plus an import check of every hosted entrypoint module under only the
# hash-pinned dependency set:
#
#   slice          five phases over Monaco Places, ~13s of harness time (~20s
#                  including the inventory).
#   address-slice  every address phase over a Seattle slice, ~10s. Before it
#                  existed the address family had NO data-plane coverage at all:
#                  its projector, transform, proof binary, genesis plan,
#                  selective reducer and finalize adapter ran only on fixtures.
#
# After its slice run, each job also encodes and verifies reverse `.plrx`
# shards from the per-record artifacts (reverse R1-c,
# scripts/reverse_r1_slice_v1.py), so `reverse-encode-v1`/`reverse-verify-v1`
# run on real data on every change to them.
#
# What this actually covers, per defect, stated honestly:
#   #149 (cargo manifest path)  -> the build step below; byte-identical command.
#   #150 (missing psutil)       -> the SLICE job (either family). psutil is
#                                  imported inside run_bounded, so only executing
#                                  the map phase reaches it. hosted-imports does
#                                  NOT catch it.
#   #148 (admit matrix key)     -> NEITHER job. The admission gate, its request
#                                  regeneration, and matrix generation are not
#                                  run here; only tests/test_construction_v1_-
#                                  workflow_contract.py covers that surface.
# hosted-imports covers top-level import failures only: a syntax error or a
# module-level import of a dependency missing from the pinned set.
#
# Both slice jobs also exercise the R2 STAGING transport for the intermediate
# store, with a filesystem backend: every phase runs with its own EMPTY local
# store and hydrates by key from the run-scoped staging prefix, which is the
# shape the hosted jobs now run (construction-v1.yml carries markers and JSON
# only). `map_staged_objects_published` and `finalize_staged_objects_hydrated`
# are asserted non-zero below, so a change that quietly reverted to a shared
# local store -- and therefore proved nothing about transport -- is a red build.
#
# It needs NO credentials: the Overture release parquet is read anonymously from
# the public us-west-2 bucket, finalize publishes to a filesystem remote, and the
# staging backend is a directory.
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "crates/geocoder-construction/**"
      - "crates/Cargo.toml"
      - "crates/Cargo.lock"
      - "benchmarks/places-construction-v1-evidence-spec-v4.json"
      - ".github/requirements-hosted-rowgroup.txt"
      - ".github/workflows/slice-smoke.yml"
      # The hosted workflow is the SOURCE the import check derives its module
      # set from, so a new script invoked there must retrigger this job.
      - ".github/workflows/construction-v1.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "crates/geocoder-construction/**"
      - "crates/Cargo.toml"
      - "crates/Cargo.lock"
      - "benchmarks/places-construction-v1-evidence-spec-v4.json"
      - ".github/requirements-hosted-rowgroup.txt"
      - ".github/workflows/slice-smoke.yml"
      # The hosted workflow is the SOURCE the import check derives its module
      # set from, so a new script invoked there must retrigger this job.
      - ".github/workflows/construction-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slice-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  # Pinned deliberately. The slice inventory is built from real row-group
  # statistics of a specific release, and the task index the harness runs is a
  # property of that release's row-group layout, so a floating "latest" would
  # make this job's subject change under it. Bump this together with the
  # inventory/task assumptions when the planet release moves.
  SLICE_RELEASE: "2026-07-22.0"
  # Monaco: small enough to run in seconds, dense enough that the combiner,
  # multi-partition reduce, and sharded head all actually do work.
  SLICE_BBOX: "7.36 43.71 7.47 43.78"
  SLICE_TASK_INDEX: "33"
  # Seattle addresses. Pinned for the same reason and with the same drift gate:
  # the task index is a property of the release's row-group layout. The box sits
  # east of longitude -122.34375, which IS a level-8 cell boundary, so the
  # covering row group straddles it and the slice spans cells c328 and c329 in
  # two different shuffle buckets -- the only cross-cell fixture in the repo.
  ADDRESS_SLICE_BBOX: "-122.34 47.59 -122.30 47.63"
  ADDRESS_SLICE_TASK_INDEX: "54"

jobs:
  hosted-imports:
    name: Hosted entrypoints import under pinned deps
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Set up the exact hosted Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"
      - name: Install ONLY the hash-pinned hosted dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"
      - name: Import every hosted entrypoint module
        run: python scripts/check_hosted_imports.py

  slice:
    name: Monaco slice, all five phases on real Overture data
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Set up the exact hosted Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"
      - name: Install the hash-pinned hosted dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"

      # Same command the hosted map/reduce/head jobs run. The harness looks for
      # the binaries at crates/target/release, so the release profile is required.
      - name: Build the construction binaries
        run: cargo build --manifest-path crates/Cargo.toml -p geocoder-construction --bins --release

      - name: Build the Monaco slice inventory from real row-group statistics
        run: |
          set -euo pipefail
          mkdir -p slice
          # Anonymous public read of the Overture release parquet footers; no
          # credentials, no data download (bbox stats live in the footer).
          # shellcheck disable=SC2086
          python scripts/build_slice_inventory_v1.py \
            --release "$SLICE_RELEASE" --bbox $SLICE_BBOX \
            --schema-profile taxonomy \
            --output slice/inventory.json | tee slice/inventory-report.json
          jq -e '.schema_profile == "taxonomy"' slice/inventory-report.json
          TASK="$(jq -r '.task_index' slice/inventory-report.json)"
          if [ "$TASK" != "$SLICE_TASK_INDEX" ]; then
            echo "The bbox now lands on map task $TASK, not the pinned $SLICE_TASK_INDEX." >&2
            echo "Release $SLICE_RELEASE row-group layout changed; update SLICE_TASK_INDEX." >&2
            exit 1
          fi

      - name: Run all five construction-v1 phases on the slice
        run: |
          set -uo pipefail
          # The harness is ~13 seconds, so a transient S3 read is cheaper to
          # absorb by rerunning it than by plumbing retries into the projector.
          # Each attempt gets a FRESH work dir: the store is create-only and a
          # half-written one would mask the real failure. Each attempt also gets
          # its OWN log, and every log is uploaded, because a retry that silently
          # overwrote attempt 1 would hide an INTERMITTENT defect -- exactly the
          # class this job exists to catch -- behind a green check.
          for ATTEMPT in 1 2; do
            WORK="slice/work"
            [ "$ATTEMPT" = 1 ] || WORK="slice/work-attempt-${ATTEMPT}"
            LOG="slice/run-attempt-${ATTEMPT}.log"
            echo "::group::slice attempt ${ATTEMPT} (work=${WORK})"
            python scripts/run_slice_construction_v1.py \
              --inventory slice/inventory.json \
              --task-index "$SLICE_TASK_INDEX" \
              --release "$SLICE_RELEASE" \
              --work "$WORK" 2>&1 | tee "$LOG"
            STATUS=$?
            echo "::endgroup::"
            # Copy whatever phase reports exist, pass OR fail: they are the
            # diagnostics, and they are needed most on the failing path.
            for FILE in "$WORK"/*.json; do
              [ -f "$FILE" ] || continue
              cp -f "$FILE" "slice/attempt-${ATTEMPT}-$(basename "$FILE")"
            done
            if [ "$STATUS" -ne 0 ]; then
              echo "Slice attempt ${ATTEMPT} failed with status ${STATUS} (see the phase output above)." >&2
              continue
            fi
            if [ "$ATTEMPT" != 1 ]; then
              # Loud, and it survives into the run summary. A pass-on-retry is a
              # finding, not a clean build.
              echo "::warning title=Slice smoke passed only on retry::Attempt 1 FAILED and attempt 2 passed. Treat this as an intermittent data-plane defect until proven to be an S3 transport failure; see slice/run-attempt-1.log in the slice-smoke-evidence artifact."
              echo "SLICE_RETRIED=true" >> "$GITHUB_ENV"
            fi
            # `serving_objects == partitions + head_populated_shards +
            # head_manifest_objects` is the exact published serving set for places:
            # one routed `.plrv` per reduce partition, one `.plhd` per populated head
            # shard, and the head routing manifest that maps shard ids to those
            # content-addressed shard objects. It is asserted as
            # an EQUALITY because finalize used to publish head shards, positions
            # packs and two manifests while dropping every single `.plrv` -- and
            # `objects`, `reconciles` and `positions_objects` were all non-zero, so
            # nothing here would have noticed.
            #
            # `plan_staged_peak_resident_bytes < plan_staged_bytes_hydrated` is the
            # assertable form of "the plan phase batches and EVICTS". It used to
            # hydrate its whole pack fan-in eagerly, which at planet scale is the
            # entire ~34 GB term store on the one job run 30113308268 died on;
            # eager hydration makes peak == total, so this is the tripwire.
            #
            # The same pair on `finalize_*` is the same tripwire for the same defect
            # in the LAST phase, where it is most expensive: finalize used to build
            # its whole exact set as a list of `store.path(...)` results, hydrating
            # every published object before the first upload and releasing none. At
            # planet scale that is 13-18 GB of disk, and the publisher then held all
            # of the same bytes in RAM at once as well. It now hydrates, verifies,
            # uploads and EVICTS one object at a time, so a regression to eager
            # hydration makes peak == total and fails here.
            #
            # `head_staged_objects_released > 0` is the SAME tripwire for the head
            # phase, whose `[store.path(k) for k in candidates]` hydrated every map
            # task's candidate pack before DuckDB read the first one and released
            # none. It is asserted as `> 0` and NOT as `peak < total`, deliberately:
            # this slice's head fan-in is ONE pack, so peak equals total however
            # promptly the merge evicts, and a strict inequality would be
            # unsatisfiable rather than strict. The strict multi-task bound (peak
            # stays at head_merge_fan_in packs while many are merged) is asserted in
            # tests/test_places_construction_v1.py::
            # test_head_merge_releases_candidate_packs_and_bounds_peak_resident.
            #
            # Every staging assertion goes through `| numbers`, which is what makes
            # it FAIL CLOSED. Bare comparisons have two holes in jq's cross-type
            # ordering, both verified: a MISSING key makes a residency comparison
            # pass, because `null < number` is true; and a STRING-valued count passes
            # `> 0`, because numbers sort below strings. Either one turns a dropped
            # or renamed summary key into a silently green bound -- the exact failure
            # mode these asserts exist to prevent. `| numbers` yields empty for
            # anything that is not a JSON number, so `jq -e` exits non-zero instead
            # of comparing. Same shape as the finalize gate in construction-v1.yml.
            #
            # `reconciles` alone is NOT evidence the run produced anything: it is
            # now a real validator result for both families, but an EMPTY run
            # reconciles too. Assert real counts, from
            # FILES the harness wrote (the last line of a merged stdout/stderr
            # stream is not a reliable machine surface), and require the two
            # artifact classes that carry the data to be non-empty.
            jq -e '
              .reconciles == true
              and .records > 0
              and .partitions > 0
              and .head_shard_count > 0
              and .head_populated_shards > 0
              and .head_total_records > 0
              and (.store_bytes_by_class["map/places-v1"] > 0)
              and (.store_bytes_by_class["serve/places-v1"] > 0)
              and .positions_objects > 0
              and .positions_records > 0
              and (.staging_prefix | test("^staging/global-v2/[0-9a-f]{64}/construction-v1/places$"))
              and (.map_staged_objects_published | numbers) > 0
              and (.finalize_staged_objects_hydrated | numbers) > 0
              and (.finalize_staged_objects_released | numbers) > 0
              and ((.finalize_staged_peak_resident_bytes | numbers) < (.finalize_staged_bytes_hydrated | numbers))
              and (.plan_staged_bytes_hydrated | numbers) > 0
              and (.plan_staged_objects_released | numbers) > 0
              and ((.plan_staged_peak_resident_bytes | numbers) < (.plan_staged_bytes_hydrated | numbers))
              and ((.reduce_staged_peak_resident_bytes | numbers) <= (.reduce_staged_bytes_hydrated | numbers))
              and (.head_staged_bytes_hydrated | numbers) > 0
              and (.head_staged_objects_released | numbers) > 0
              and ((.head_staged_peak_resident_bytes | numbers) <= (.head_staged_bytes_hydrated | numbers))
              and .serving_object_key == "routed_object"
              and .reduction_serving_objects == .partitions
              and (.head_manifest_objects | numbers) == 1
              and (.serving_objects
                   == .partitions + .head_populated_shards
                      + (.head_manifest_objects | numbers))
            ' "${WORK}/summary.json" >/dev/null || {
              echo "The slice ran but its summary does not prove it produced data:" >&2
              cat "${WORK}/summary.json" >&2 || echo "(no summary.json written)" >&2
              echo "This is a data-plane defect, not flakiness." >&2
              exit 1
            }
            jq -e '.populated_shards > 0 and .total_records > 0 and .shard_count > 0' \
              "${WORK}/head.json" >/dev/null || {
              echo "run-head produced an empty head; a zero-record head passes every other check." >&2
              exit 1
            }
            cp -f "${WORK}/summary.json" slice/summary.json
            # The reverse step below consumes this attempt's completed work tree.
            echo "SLICE_WORK=$WORK" >> "$GITHUB_ENV"
            exit 0
          done
          echo "The Monaco slice failed twice; this is a real data-plane failure or a sustained S3 outage." >&2
          exit 1

      # ITEM 1, zero-copy promotion. Promotion used to server-side CopyObject
      # every forward serving object between two content-addressed prefixes that
      # differ only by prefix -- 21,279 objects and 158.68 GiB on the 2026-07-31
      # promotion. Finalize can now publish them straight into the release
      # namespace instead. The claim that makes that safe is that PROMOTION'S
      # OUTPUT DOES NOT CHANGE, and this is the cheapest rung that can falsify it
      # on real Overture data rather than on a synthetic fixture: the same Monaco
      # slice, published both ways, promoted both ways, documents compared.
      - name: Promote the slice both ways and prove the published documents match
        run: |
          set -euo pipefail
          WORK="$(realpath "$SLICE_WORK")"
          VERSION=slice-2026-01-01.0
          SLICE_ROOT="$(jq -er '.namespaces.slice' "$WORK/contract.json")"
          MARKERS_ROOT="$(jq -er '.namespaces.markers' "$WORK/contract.json")"

          # (a) The construction layout, which is what a dispatch with an empty
          #     release_slice_version still produces. Promotion copies.
          python scripts/promote_construction_slice.py plan \
            --source "local:$WORK/remote" --family places \
            --slice-root "places=$SLICE_ROOT" --markers-root "places=$MARKERS_ROOT" \
            --reductions-dir "places=$WORK/reductions" \
            --version "$VERSION" --release "$SLICE_RELEASE" \
            --producer-commit "$GITHUB_SHA" --output slice/promote-copy.json
          python scripts/promote_construction_slice.py execute \
            --plan slice/promote-copy.json --source "local:$WORK/remote" \
            --destination "local:$PWD/slice/promote-copy-dest"
          python scripts/promote_construction_slice.py verify \
            --plan slice/promote-copy.json --destination "local:$PWD/slice/promote-copy-dest"

          # (b) The release layout: the SAME five phases on the SAME data, with
          #     finalize publishing the serving objects at their final keys.
          #     Source and destination are one tree because in the promotion
          #     workflow they are one bucket.
          python scripts/run_slice_construction_v1.py \
            --inventory slice/inventory.json \
            --task-index "$SLICE_TASK_INDEX" \
            --release "$SLICE_RELEASE" \
            --work slice/work-zero-copy \
            --release-slice-version "$VERSION" > slice/zero-copy-run.log 2>&1
          ZW="$(realpath slice/work-zero-copy)"
          python scripts/promote_construction_slice.py plan \
            --source "local:$ZW/remote" --family places \
            --slice-root "places=$(jq -er '.namespaces.slice' "$ZW/contract.json")" \
            --markers-root "places=$(jq -er '.namespaces.markers' "$ZW/contract.json")" \
            --reductions-dir "places=$ZW/reductions" \
            --version "$VERSION" --release "$SLICE_RELEASE" \
            --producer-commit "$GITHUB_SHA" --output slice/promote-zero-copy.json
          python scripts/promote_construction_slice.py execute \
            --plan slice/promote-zero-copy.json --source "local:$ZW/remote" \
            --destination "local:$ZW/remote"
          python scripts/promote_construction_slice.py verify \
            --plan slice/promote-zero-copy.json --destination "local:$ZW/remote"

          # The serving objects must NOT be in the construction namespace under
          # the release layout, and the per-record packs must still be.
          test ! -d "$ZW/remote/${SLICE_ROOT%/}/families/places/objects"
          test -d "$ZW/remote/${SLICE_ROOT%/}/families/places/positions"
          test -f "$ZW/remote/$VERSION/claims/places.json"

          # The assertion this step exists for. `copied_objects` moves; every
          # published document stays byte-identical.
          jq -es '
            (.[0].families.places) as $copy
            | (.[1].families.places) as $zero
            | $copy.forward_layout == "construction-copy"
            and $zero.forward_layout == "release-prepositioned"
            and $copy.totals.copied_objects > 0
            and $zero.totals.copied_objects == 0
            and $zero.totals.forward_prepositioned_objects == $copy.totals.copied_objects
            and $zero.totals.bytes == $copy.totals.bytes
            and $zero.family_manifest_sha256 == $copy.family_manifest_sha256
            and $zero.routing_sha256 == $copy.routing_sha256
          ' slice/promote-copy.json slice/promote-zero-copy.json >/dev/null || {
            echo "Zero-copy promotion does not publish the same documents as the copy path." >&2
            jq -S '.families.places.totals, {fm: .families.places.family_manifest_sha256, routing: .families.places.routing_sha256}' \
              slice/promote-copy.json slice/promote-zero-copy.json >&2
            exit 1
          }
          echo "Zero-copy promotion: $(jq -c '.families.places.totals' slice/promote-zero-copy.json)"
          echo "Copy path:           $(jq -c '.families.places.totals' slice/promote-copy.json)"

      - name: Encode and verify reverse shards from the positions artifact
        run: |
          set -euo pipefail
          # Reverse R1-c: one `.plrx` shard per populated level-8 cell, encoded
          # from the SAME work tree the slice run left behind -- no re-map, no
          # credentials. `reverse-encode-v1`/`reverse-verify-v1` come from the
          # construction-binaries build step above (`--bins` covers them). The
          # driver sizes every shard from the pack DIRECTORIES (never the
          # data), cross-checks each shard against the Python oracle, and the
          # completeness equality asserted below is the R1 form of the
          # finalizer invariant: shard records == positions artifact records
          # == transform admitted rows.
          python scripts/reverse_r1_slice_v1.py \
            --work "$SLICE_WORK" --family places --output slice/reverse
          # The map task carries whole row groups, so the positions artifact
          # spans the task's FOUR cells even though the Monaco bbox itself sits
          # inside be85 (which holds one of the two dense shards). Pinned as an
          # exact set, like the task index: a release layout change surfaces as
          # cell-set drift here instead of silently weakening the fixture.
          #
          # `mean_record_bytes` is gated against the MEASURED R1-b encoder
          # model -- 112 B/record for places, INCLUDING the 16-byte source
          # locator, not the design doc's 96 B. Real Monaco text fields run
          # ~6% shorter than the synthetic model rows (measured 105.0 B on
          # 2026-07-22.0), so the band is 10% of the model: wide enough for
          # real-data drift, tight enough that a dropped field or added
          # padding still trips it.
          jq -e '
            .schema == "overture-reverse-r1-slice-summary-v1"
            and .family == "places"
            and .shards == 4
            and .cells == ["be84", "be85", "bf84", "bf85"]
            and .records > 0
            and .records == .artifact_records
            and .artifact_records == .admitted_rows
            and .model_record_bytes == 112
            and (.mean_record_bytes | numbers) >= .model_record_bytes * 0.90
            and (.mean_record_bytes | numbers) <= .model_record_bytes * 1.10
            and (.per_cell | length) == .shards
          ' slice/reverse/summary.json >/dev/null || {
            echo "The reverse encode ran but its summary does not prove the shards are complete:" >&2
            cat slice/reverse/summary.json >&2 || echo "(no reverse summary written)" >&2
            echo "If only the cell set changed, release $SLICE_RELEASE row-group layout moved; update the pinned cells together with SLICE_TASK_INDEX." >&2
            exit 1
          }
          cp -f slice/reverse/summary.json slice/reverse-summary.json

      - name: Summarize the slice run
        if: always()
        run: |
          {
            echo "## Construction v1 slice smoke"
            echo
            echo "- Release: \`$SLICE_RELEASE\` | bbox: \`$SLICE_BBOX\` | map task: \`$SLICE_TASK_INDEX\`"
            if [ "${SLICE_RETRIED:-false}" = true ]; then
              echo "- **Attempt 1 FAILED; this run passed only on attempt 2.** Not a clean build — see \`slice/run-attempt-1.log\`."
            fi
            if [ -f slice/summary.json ]; then
              echo
              echo "\`\`\`json"
              jq -S '.' slice/summary.json
              echo "\`\`\`"
            fi
            if [ -f slice/reverse-summary.json ]; then
              echo
              echo "### Reverse R1 shards"
              echo
              echo "\`\`\`json"
              jq -S '.' slice/reverse-summary.json
              echo "\`\`\`"
            fi
            for LOG in slice/run-attempt-*.log; do
              [ -f "$LOG" ] || continue
              echo
              echo "<details><summary>$LOG</summary>"
              echo
              echo '```'
              cat "$LOG"
              echo '```'
              echo
              echo "</details>"
            done
            if ! ls slice/run-attempt-*.log >/dev/null 2>&1; then
              echo "- The slice run produced no log; see the failing step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish every attempt's inventory, reports, and logs for diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: slice-smoke-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            slice/*.json
            slice/run-attempt-*.log

  address-slice:
    # A SEPARATE job rather than a matrix over the places one, deliberately: the
    # two families assert on different keys (addresses have no global head and no
    # shuffle-bucket reduce ownership; places have no `map/address` store class),
    # and folding them into one parameterised block would have meant editing the
    # places assertions -- the exact class of silent change that the integration
    # of this branch was reviewed for. The retry/log/evidence discipline is
    # deliberately identical.
    #
    # Until this job existed the address family had NO data-plane coverage at all:
    # its projector, transform, proof binary, genesis plan, selective reducer and
    # finalize adapter were exercised only by fixtures.
    name: Seattle address slice, all phases on real Overture data
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Set up the exact hosted Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"
      - name: Install the hash-pinned hosted dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-hosted-rowgroup.txt"

      # Same command the hosted map/reduce jobs run. The harness looks for the
      # binaries at crates/target/release, so the release profile is required.
      - name: Build the construction binaries
        run: cargo build --manifest-path crates/Cargo.toml -p geocoder-construction --bins --release

      - name: Build the Seattle address slice inventory from real row-group statistics
        run: |
          set -euo pipefail
          mkdir -p slice
          # Anonymous public read of the Overture release parquet footers; no
          # credentials, no data download (bbox stats live in the footer).
          # shellcheck disable=SC2086
          python scripts/build_slice_inventory_v1.py --family addresses \
            --release "$SLICE_RELEASE" --bbox $ADDRESS_SLICE_BBOX \
            --output slice/address-inventory.json | tee slice/address-inventory-report.json
          TASK="$(jq -r '.task_index' slice/address-inventory-report.json)"
          if [ "$TASK" != "$ADDRESS_SLICE_TASK_INDEX" ]; then
            echo "The bbox now lands on map task $TASK, not the pinned $ADDRESS_SLICE_TASK_INDEX." >&2
            echo "Release $SLICE_RELEASE row-group layout changed; update ADDRESS_SLICE_TASK_INDEX." >&2
            exit 1
          fi
          # The slice's whole value as a spatial fixture is that it spans two
          # level-8 cells. A layout change that kept the task index but moved the
          # cell boundary out of the row group would silently reduce it to a
          # single-cell slice, so the row group and its object are pinned too.
          jq -e '.object_index == 8 and .row_group == 108 and .task_records == 104928' \
            slice/address-inventory-report.json >/dev/null || {
            echo "The address slice no longer resolves to object 8 / row group 108 / 104,928 rows." >&2
            cat slice/address-inventory-report.json >&2
            exit 1
          }

      - name: Run every address construction-v1 phase on the slice
        run: |
          set -uo pipefail
          # Same two-attempt policy and rationale as the places job: a transient
          # anonymous S3 read is cheaper to absorb by rerunning than by plumbing
          # retries into the projector, each attempt gets a FRESH work dir because
          # the store is create-only, and every attempt's log is uploaded so a
          # pass-on-retry cannot hide an intermittent data-plane defect.
          for ATTEMPT in 1 2; do
            WORK="slice/address-work"
            [ "$ATTEMPT" = 1 ] || WORK="slice/address-work-attempt-${ATTEMPT}"
            LOG="slice/address-run-attempt-${ATTEMPT}.log"
            echo "::group::address slice attempt ${ATTEMPT} (work=${WORK})"
            python scripts/run_slice_construction_v1.py --family addresses \
              --inventory slice/address-inventory.json \
              --task-index "$ADDRESS_SLICE_TASK_INDEX" \
              --release "$SLICE_RELEASE" \
              --work "$WORK" 2>&1 | tee "$LOG"
            STATUS=$?
            echo "::endgroup::"
            for FILE in "$WORK"/*.json; do
              [ -f "$FILE" ] || continue
              cp -f "$FILE" "slice/address-attempt-${ATTEMPT}-$(basename "$FILE")"
            done
            if [ "$STATUS" -ne 0 ]; then
              echo "Address slice attempt ${ATTEMPT} failed with status ${STATUS} (see the phase output above)." >&2
              continue
            fi
            if [ "$ATTEMPT" != 1 ]; then
              echo "::warning title=Address slice smoke passed only on retry::Attempt 1 FAILED and attempt 2 passed. Treat this as an intermittent data-plane defect until proven to be an S3 transport failure; see slice/address-run-attempt-1.log in the slice-smoke-address-evidence artifact."
              echo "ADDRESS_SLICE_RETRIED=true" >> "$GITHUB_ENV"
            fi
            # The address serving key stays `artifact` -- that reducer has always
            # recorded it, and it is the key whose absence on the PLACES side hid
            # the missing routed objects. `serving_objects == partitions` (no head
            # shards, and `head_manifest_objects == 0` because there is no head
            # phase) is the address family's exact published serving set. The
            # manifest term is written out rather than dropped so both families
            # assert the SAME equality.
            #
            # `plan_staged_bytes_hydrated == 0` is not a bug: the ADDRESS genesis
            # plan is built from marker JSON alone, so the plan phase reads no pack
            # bodies at all. `reduce_staged_bytes_hydrated > 0` is where the address
            # family's transport cost lives, and it is asserted rather than hidden.
            #
            # `reduce_staged_objects_released > 0` is the tripwire for the defect that
            # made `reduce_staged_peak_resident_bytes == reduce_staged_bytes_hydrated`
            # exactly: the address reducer never called the staged store's `release()`
            # at all, so a job finished holding every pack it had opened. Zero
            # releases is that regression, and nothing else here can see it.
            #
            # It is asserted as `> 0` and NOT as `peak < total`, deliberately. This
            # slice's whole forward map output is ONE 10.9 MB pack, so peak EQUALS
            # total however promptly the reducer evicts -- a strict inequality here
            # would be unsatisfiable rather than strict. The strict bound (peak stays
            # at one pack while many are reduced) is asserted in
            # tests/test_address_construction_v1.py::
            # test_reduce_partition_releases_packs_and_bounds_peak_resident, and
            # measured on a planet-shaped slice in
            # docs/plans/construction-v1-state.md.
            #
            # A GREEN address slice therefore means "the transport moves address map
            # output durably and the reducer's resident input is bounded", NOT "an
            # address planet build has been executed" -- none has, for either family.
            #
            # The `finalize_*` peak/released pair is asserted for BOTH families, for
            # the same reason and against the same defect (finalize hydrated its
            # whole published set before the first upload and released none of it).
            # Unlike the reduce bound above, this one is a real bound on the address
            # side too: finalize's fan-in is the published set, and it is now read
            # one object at a time regardless of family.
            #
            # Unlike places, `reconciles` for addresses is a REAL check
            # (validate_complete_reduction over the genesis plan), but it still
            # says nothing about volume, so assert counts the same way. The
            # address family has no global head, so its head_* keys are asserted at
            # ZERO -- hydrated and released alike -- rather than skipped, so a head
            # phase silently doing work on the address path would fail here. The
            # places job asserts the same two keys non-zero. That is also why the
            # reduce-ownership key is asserted instead:
            # it proves the run went through the batch dispatch, not the legacy
            # one-job-per-partition path.
            #
            # The per-address records artifact gets THREE independent assertions,
            # because each covers a different way it can silently go missing:
            # address_records_* prove map EMITTED it complete (rows == admitted, two
            # cells so the spatial fixture is still spatial); positions_* prove
            # finalize PUBLISHED it durably, which is the whole point -- an emitted
            # but unpublished artifact expires with the 7-day map artifact retention
            # and satisfies every other assertion here.
            jq -e '
              .family == "addresses"
              and .reconciles == true
              and .records > 0
              and .partitions > 0
              and .admitted_rows > 0
              and .map_packs > 0
              and .reduce_ownership == "partition-batch"
              and .reduce_job_count > 0
              and (.store_bytes_by_class["map/address"] > 0)
              and (.store_bytes_by_class["reduce/address"] > 0)
              and .address_records_rows == .admitted_rows
              and .address_records_packs > 0
              and .address_records_bytes > 0
              and .address_records_null_island == 0
              and (.address_records_cells | length) == 2
              and .positions_objects > 0
              and .positions_records == .admitted_rows
              and .positions_bytes > 0
              and (.staging_prefix | test("^staging/global-v2/[0-9a-f]{64}/construction-v1/addresses$"))
              and (.map_staged_objects_published | numbers) > 0
              and (.finalize_staged_objects_hydrated | numbers) > 0
              and (.finalize_staged_objects_released | numbers) > 0
              and ((.finalize_staged_peak_resident_bytes | numbers) < (.finalize_staged_bytes_hydrated | numbers))
              and (.plan_staged_bytes_hydrated | numbers) == 0
              and (.reduce_staged_bytes_hydrated | numbers) > 0
              and (.reduce_staged_objects_released | numbers) > 0
              and ((.reduce_staged_peak_resident_bytes | numbers) <= (.reduce_staged_bytes_hydrated | numbers))
              and (.head_staged_bytes_hydrated | numbers) == 0
              and (.head_staged_objects_released | numbers) == 0
              and .serving_object_key == "artifact"
              and (.head_manifest_objects | numbers) == 0
              and .serving_objects == .partitions + (.head_manifest_objects | numbers)
            ' "${WORK}/summary.json" >/dev/null || {
              echo "The address slice ran but its summary does not prove it produced data:" >&2
              cat "${WORK}/summary.json" >&2 || echo "(no summary.json written)" >&2
              echo "This is a data-plane defect, not flakiness." >&2
              exit 1
            }
            # Addresses have no head phase, so run-head must report exactly that
            # rather than an empty head that looks like a successful one.
            jq -e '.family == "addresses" and .head == null' "${WORK}/head.json" >/dev/null || {
              echo "run-head did not report the documented address no-op." >&2
              cat "${WORK}/head.json" >&2
              exit 1
            }
            cp -f "${WORK}/summary.json" slice/address-summary.json
            # The reverse step below consumes this attempt's completed work tree.
            echo "ADDRESS_SLICE_WORK=$WORK" >> "$GITHUB_ENV"
            exit 0
          done
          echo "The Seattle address slice failed twice; this is a real data-plane failure or a sustained S3 outage." >&2
          exit 1

      - name: Encode and verify reverse shards from the address records artifact
        run: |
          set -euo pipefail
          # Reverse R1-c for the address family, same driver and same
          # invariants as the places job: shards sized from the record-pack
          # directories, verified by `reverse-verify-v1` and the Python
          # oracle, and the completeness equality shard records == records
          # artifact == transform admitted rows. Exactly the two cells the
          # slice exists to span (c328/c329, the level-8 boundary at
          # longitude -122.34375): one shard each, pinned as an exact set so a
          # layout change cannot silently reduce this to a single-cell
          # fixture. The address model is the measured 84 B/record after
          # repeated strings moved into shard dictionaries. Real Seattle rows
          # can run shorter, so only the model identity is pinned here -- the
          # places job carries the mean-size band.
          python scripts/reverse_r1_slice_v1.py \
            --work "$ADDRESS_SLICE_WORK" --family addresses --output slice/address-reverse
          jq -e '
            .schema == "overture-reverse-r1-slice-summary-v1"
            and .family == "addresses"
            and .shards == 2
            and .cells == ["c328", "c329"]
            and .records > 0
            and .records == .artifact_records
            and .artifact_records == .admitted_rows
            and .model_record_bytes == 84
            and (.mean_record_bytes | numbers) > 0
            and (.per_cell | length) == .shards
          ' slice/address-reverse/summary.json >/dev/null || {
            echo "The address reverse encode ran but its summary does not prove the shards are complete:" >&2
            cat slice/address-reverse/summary.json >&2 || echo "(no reverse summary written)" >&2
            echo "If only the cell set changed, release $SLICE_RELEASE row-group layout moved; update the pinned cells together with ADDRESS_SLICE_TASK_INDEX." >&2
            exit 1
          }
          cp -f slice/address-reverse/summary.json slice/address-reverse-summary.json

      - name: Summarize the address slice run
        if: always()
        run: |
          {
            echo "## Construction v1 address slice smoke"
            echo
            echo "- Release: \`$SLICE_RELEASE\` | bbox: \`$ADDRESS_SLICE_BBOX\` | map task: \`$ADDRESS_SLICE_TASK_INDEX\`"
            if [ "${ADDRESS_SLICE_RETRIED:-false}" = true ]; then
              echo "- **Attempt 1 FAILED; this run passed only on attempt 2.** Not a clean build — see \`slice/address-run-attempt-1.log\`."
            fi
            if [ -f slice/address-summary.json ]; then
              echo
              echo "\`\`\`json"
              jq -S '.' slice/address-summary.json
              echo "\`\`\`"
            fi
            if [ -f slice/address-reverse-summary.json ]; then
              echo
              echo "### Reverse R1 shards"
              echo
              echo "\`\`\`json"
              jq -S '.' slice/address-reverse-summary.json
              echo "\`\`\`"
            fi
            for LOG in slice/address-run-attempt-*.log; do
              [ -f "$LOG" ] || continue
              echo
              echo "<details><summary>$LOG</summary>"
              echo
              echo '```'
              cat "$LOG"
              echo '```'
              echo
              echo "</details>"
            done
            if ! ls slice/address-run-attempt-*.log >/dev/null 2>&1; then
              echo "- The address slice run produced no log; see the failing step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish every attempt's inventory, reports, and logs for diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: slice-smoke-address-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            slice/*.json
            slice/address-run-attempt-*.log
