[pytest]
testpaths = tests

# Run the suite across all available cores.
#
# The suite is CPU-bound -- it is real transform/plan/encode work, not I/O
# waits -- and it is parallel-safe: no test mutates os.environ, no test writes
# to a shared absolute path (every "/tmp/..." string in tests/ is an assertion
# about workflow YAML text, not a filesystem write), and the only two chdirs
# are monkeypatch.chdir(tmp_path), which is per-test and auto-reverted.
#
# `--dist worksteal` rather than the default `load`: the suite's cost is
# concentrated in a few multi-second tests, so a static up-front split leaves
# workers idle while one grinds. Measured on this 20-core box, whole suite,
# warm cache, one run each:
#
#     no xdist                155 s
#     -n auto --dist load      45 s
#     -n auto --dist loadfile   47 s
#     -n auto --dist worksteal  26 s
#
# worksteal does mean tests from one module can land on different workers, so a
# module-scoped fixture may be built more than once. That is already priced in
# above -- rebalancing wins by more than the duplicated setup costs.
#
# Overrides: `-n0` (or `-p no:xdist`) restores serial execution, which you want
# for `--pdb`, live `-s` output, or reading an ordered failure log.
addopts = -n auto --dist worksteal

# NOTE: no marker filter is applied here, deliberately. `pytest tests/` and CI
# both run the ENTIRE suite; `slow` is descriptive metadata for local triage
# only (`-m "not slow"`), never a gate. Nothing that guards a frozen contract,
# an evidence hash, a spec pin or a fail-closed gate may be excluded from a
# default run, and the way that is guaranteed is that the default excludes
# nothing at all.
markers =
    slow: takes multiple seconds on its own. Informational; nothing filters on
        it by default. `-m "not slow"` is a local triage shortcut, not a gate.
