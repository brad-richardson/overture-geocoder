<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overture Geocoder</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <!-- PMTiles Protocol -->
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0a0a0a;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .control-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 20px;
      width: 360px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo h1 {
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 4px;
    }

    .tab {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .tab:hover {
      color: rgba(255, 255, 255, 0.8);
    }

    .tab.active {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
    }

    .search-container {
      position: relative;
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      padding-left: 44px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: #3b82f6;
      background: rgba(255, 255, 255, 0.1);
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.4);
      pointer-events: none;
    }

    .coords-container {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .coord-input-group {
      flex: 1;
    }

    .coord-label {
      display: block;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .coord-input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .coord-input:focus {
      border-color: #3b82f6;
      background: rgba(255, 255, 255, 0.1);
    }

    .id-container {
      margin-bottom: 12px;
    }

    .id-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 12px;
      outline: none;
      transition: all 0.2s;
    }

    .id-input:focus {
      border-color: #3b82f6;
      background: rgba(255, 255, 255, 0.1);
    }

    .id-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .search-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .search-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .search-btn:active {
      transform: translateY(0);
    }

    .search-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .hint {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .results {
      margin-top: 16px;
    }

    .results-header {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .result-item {
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .result-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .result-actions {
      display: flex;
      margin-top: 10px;
    }

    .id-lookup-btn {
      padding: 6px 10px;
      background: rgba(59, 130, 246, 0.16);
      border: 1px solid rgba(96, 165, 250, 0.35);
      border-radius: 6px;
      color: #bfdbfe;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }

    .id-lookup-btn:hover,
    .id-lookup-btn:focus-visible {
      background: rgba(59, 130, 246, 0.28);
      border-color: rgba(96, 165, 250, 0.65);
      outline: none;
    }

    .id-details {
      display: grid;
      gap: 8px;
      margin-top: 10px;
      font-size: 12px;
    }

    .id-detail {
      display: grid;
      grid-template-columns: minmax(90px, auto) 1fr;
      gap: 8px;
      align-items: start;
    }

    .id-detail-label {
      color: rgba(255, 255, 255, 0.5);
    }

    .id-detail-value {
      color: rgba(255, 255, 255, 0.85);
      font-family: 'SF Mono', Monaco, monospace;
      overflow-wrap: anywhere;
    }

    .result-name {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #fff;
    }

    .result-meta {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .result-type {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      background: rgba(99, 102, 241, 0.2);
      border-radius: 4px;
      font-size: 11px;
      color: #a5b4fc;
      text-transform: capitalize;
    }

    .result-coords {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 11px;
    }

    .hierarchy {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .hierarchy-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      padding: 2px 0;
    }

    .hierarchy-item::before {
      content: '›';
      color: rgba(255, 255, 255, 0.3);
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: rgba(255, 255, 255, 0.5);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      padding: 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 13px;
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
    }

    .maplibregl-popup {
      max-width: 280px;
    }

    .maplibregl-popup-content {
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .maplibregl-popup-close-button {
      color: rgba(255, 255, 255, 0.6);
      font-size: 18px;
      padding: 4px 8px;
    }

    .maplibregl-popup-close-button:hover {
      color: #fff;
      background: transparent;
    }

    .maplibregl-popup-tip {
      border-top-color: rgba(10, 10, 10, 0.95);
    }

    .popup-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .popup-type {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(99, 102, 241, 0.2);
      border-radius: 4px;
      font-size: 11px;
      color: #a5b4fc;
      text-transform: capitalize;
      margin-bottom: 6px;
    }

    .popup-coords {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
    }

    .info-panel {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .info-panel a {
      color: #818cf8;
      text-decoration: none;
    }

    .info-panel a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .control-panel {
        left: 8px;
        right: 8px;
        width: auto;
        max-height: 50vh;
      }

      .info-panel {
        right: 8px;
        left: 8px;
        bottom: 8px;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="control-panel">
    <div class="logo">
      <div class="logo-icon">O</div>
      <h1>Overture Geocoder</h1>
    </div>

    <div class="tabs" role="tablist" aria-label="API tester">
      <button class="tab active" id="forward-tab" data-tab="forward" role="tab" aria-selected="true" aria-controls="forward-panel" tabindex="0">Forward</button>
      <button class="tab" id="reverse-tab" data-tab="reverse" role="tab" aria-selected="false" aria-controls="reverse-panel" tabindex="-1">Reverse</button>
      <button class="tab" id="id-tab" data-tab="id" role="tab" aria-selected="false" aria-controls="id-panel" tabindex="-1">ID</button>
    </div>

    <div id="forward-panel" role="tabpanel" aria-labelledby="forward-tab">
      <div class="search-container">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="search-input" id="search-input" placeholder="Search for a place..." autocomplete="off" aria-label="Search for a place">
      </div>
      <div class="hint">
        <span>Press Enter or click Search</span>
      </div>
      <button class="search-btn" id="search-btn">Search</button>
    </div>

    <div id="reverse-panel" role="tabpanel" aria-labelledby="reverse-tab" hidden>
      <div class="coords-container">
        <div class="coord-input-group">
          <label class="coord-label" for="lat-input">Latitude</label>
          <input type="number" class="coord-input" id="lat-input" placeholder="42.3601" step="any" aria-describedby="coords-hint">
        </div>
        <div class="coord-input-group">
          <label class="coord-label" for="lon-input">Longitude</label>
          <input type="number" class="coord-input" id="lon-input" placeholder="-71.0589" step="any" aria-describedby="coords-hint">
        </div>
      </div>
      <div class="hint" id="coords-hint">
        <span>Click on map or enter coordinates</span>
      </div>
      <button class="search-btn" id="reverse-btn">Lookup Location</button>
    </div>

    <div id="id-panel" role="tabpanel" aria-labelledby="id-tab" hidden>
      <div class="id-container">
        <label class="coord-label" for="id-input">GERS ID</label>
        <input type="text" class="id-input" id="id-input" placeholder="08b2a100-d664-7fff-0200-a44bcea04b76" autocomplete="off" spellcheck="false" aria-describedby="id-hint">
      </div>
      <div class="hint" id="id-hint">
        <span>Paste an ID or send one here from a geocoding result</span>
      </div>
      <button class="search-btn" id="id-btn">Lookup ID</button>
    </div>

    <div id="results" class="results" aria-live="polite" aria-atomic="true"></div>
  </div>

  <div class="info-panel">
    Powered by <a href="https://overturemaps.org" target="_blank" rel="noopener noreferrer">Overture Maps</a>
    &bull;
    Data &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors
    &bull;
    <a href="https://github.com/brad-richardson/overture-geocoder" target="_blank" rel="noopener noreferrer">GitHub</a>
  </div>

  <script type="module">
    import { OvertureGeocoder } from 'https://esm.sh/@bradrichardson/overture-geocoder@0.2.2';

    // Configuration Constants
    const DEFAULT_API_URL = 'https://geocoder.bradr.dev';
    const SEARCH_LIMIT = 10;
    const MAP_PADDING = 100;
    const FIT_MAX_ZOOM = 14;
    const REVERSE_RESULT_ZOOM = 12;
    const ID_REQUEST_TIMEOUT_MS = 30000;
    const DEFAULT_CENTER = [-71.0589, 42.3601]; // Boston
    const DEFAULT_ZOOM = 10;

    // Allow API URL override via query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const API_BASE_URL = urlParams.get('api') || DEFAULT_API_URL;

    // PMTiles URLs from Overture Maps
    const PMTILES_SOURCES = {
      base: 'https://d3c1b7bog2u1nn.cloudfront.net/2025-12-17/base.pmtiles',
      buildings: 'https://d3c1b7bog2u1nn.cloudfront.net/2025-12-17/buildings.pmtiles',
      transportation: 'https://d3c1b7bog2u1nn.cloudfront.net/2025-12-17/transportation.pmtiles',
      divisions: 'https://d3c1b7bog2u1nn.cloudfront.net/2025-12-17/divisions.pmtiles'
    };

    // Register PMTiles protocol
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol('pmtiles', protocol.tile);

    // Initialize map
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
        sources: {
          'overture-base': {
            type: 'vector',
            url: `pmtiles://${PMTILES_SOURCES.base}`
          },
          'overture-buildings': {
            type: 'vector',
            url: `pmtiles://${PMTILES_SOURCES.buildings}`
          },
          'overture-transportation': {
            type: 'vector',
            url: `pmtiles://${PMTILES_SOURCES.transportation}`
          },
          'overture-divisions': {
            type: 'vector',
            url: `pmtiles://${PMTILES_SOURCES.divisions}`
          }
        },
        layers: [
          // Background (ocean)
          {
            id: 'background',
            type: 'background',
            paint: {
              'background-color': '#a3c7df'
            }
          },
          // Land
          {
            id: 'land',
            type: 'fill',
            source: 'overture-base',
            'source-layer': 'land',
            paint: {
              'fill-color': '#f5f3ed'
            }
          },
          // Water (after land so lakes/rivers show)
          {
            id: 'water',
            type: 'fill',
            source: 'overture-base',
            'source-layer': 'water',
            paint: {
              'fill-color': '#a3c7df'
            }
          },
          // Land use
          {
            id: 'landuse',
            type: 'fill',
            source: 'overture-base',
            'source-layer': 'land_use',
            paint: {
              'fill-color': [
                'match',
                ['get', 'subtype'],
                'park', '#c8e6c8',
                'forest', '#b8d4b8',
                'residential', '#f0ece4',
                'commercial', '#f5e8dc',
                'industrial', '#e8e4d8',
                '#ebe8e0'
              ],
              'fill-opacity': 0.7
            }
          },
          // Transportation - minor roads
          {
            id: 'roads-minor',
            type: 'line',
            source: 'overture-transportation',
            'source-layer': 'segment',
            filter: ['in', ['get', 'class'], ['literal', ['residential', 'service', 'track', 'path']]],
            paint: {
              'line-color': '#ffffff',
              'line-width': [
                'interpolate', ['linear'], ['zoom'],
                12, 0.5,
                16, 2
              ]
            },
            minzoom: 12
          },
          // Transportation - major roads
          {
            id: 'roads-major',
            type: 'line',
            source: 'overture-transportation',
            'source-layer': 'segment',
            filter: ['in', ['get', 'class'], ['literal', ['primary', 'secondary', 'tertiary']]],
            paint: {
              'line-color': '#e8dcc0',
              'line-width': [
                'interpolate', ['linear'], ['zoom'],
                8, 0.5,
                14, 3,
                18, 8
              ]
            },
            minzoom: 8
          },
          // Transportation - highways
          {
            id: 'roads-highway',
            type: 'line',
            source: 'overture-transportation',
            'source-layer': 'segment',
            filter: ['in', ['get', 'class'], ['literal', ['motorway', 'trunk']]],
            paint: {
              'line-color': '#d4a0a0',
              'line-width': [
                'interpolate', ['linear'], ['zoom'],
                5, 0.5,
                10, 2,
                16, 6
              ]
            },
            minzoom: 5
          },
          // Buildings
          {
            id: 'buildings',
            type: 'fill',
            source: 'overture-buildings',
            'source-layer': 'building',
            paint: {
              'fill-color': '#d4ccc0',
              'fill-opacity': 0.8
            },
            minzoom: 13
          },
          // Building outlines
          {
            id: 'buildings-outline',
            type: 'line',
            source: 'overture-buildings',
            'source-layer': 'building',
            paint: {
              'line-color': '#b8a898',
              'line-width': 0.5
            },
            minzoom: 15
          },
          // Country boundaries
          {
            id: 'country-boundaries',
            type: 'line',
            source: 'overture-divisions',
            'source-layer': 'division_boundary',
            filter: ['==', ['get', 'subtype'], 'country'],
            paint: {
              'line-color': '#707080',
              'line-width': [
                'interpolate', ['linear'], ['zoom'],
                1, 0.5,
                4, 1.5,
                8, 2
              ]
            },
            minzoom: 1
          },
          // Region/state boundaries
          {
            id: 'region-boundaries',
            type: 'line',
            source: 'overture-divisions',
            'source-layer': 'division_boundary',
            filter: ['==', ['get', 'subtype'], 'region'],
            paint: {
              'line-color': '#9090a0',
              'line-width': 1,
              'line-dasharray': [4, 2]
            },
            minzoom: 3
          },
          // Major city labels (100k+ population) - show at low zoom
          {
            id: 'major-city-labels',
            type: 'symbol',
            source: 'overture-divisions',
            'source-layer': 'division',
            filter: ['all',
              ['==', ['get', 'subtype'], 'locality'],
              ['>=', ['coalesce', ['get', 'population'], 0], 100000]
            ],
            minzoom: 4,
            layout: {
              'text-field': ['get', '@name'],
              'text-font': ['Noto Sans Bold'],
              'text-size': [
                'interpolate', ['linear'], ['zoom'],
                3, 11,
                6, 14,
                10, 16
              ],
              'text-anchor': 'center',
              'text-max-width': 8,
              'text-allow-overlap': false,
              'text-padding': 2,
              'symbol-sort-key': ['*', -1, ['coalesce', ['get', 'population'], 0]]
            },
            paint: {
              'text-color': '#404050',
              'text-halo-color': '#ffffff',
              'text-halo-width': 1.5
            }
          },
          // City labels (smaller cities) - show at higher zoom
          {
            id: 'city-labels',
            type: 'symbol',
            source: 'overture-divisions',
            'source-layer': 'division',
            filter: ['all',
              ['==', ['get', 'subtype'], 'locality'],
              ['>=', ['coalesce', ['get', 'population'], 0], 1000],
              ['<', ['coalesce', ['get', 'population'], 0], 100000]
            ],
            minzoom: 9,
            layout: {
              'text-field': ['get', '@name'],
              'text-font': ['Noto Sans Bold'],
              'text-size': [
                'interpolate', ['linear'], ['zoom'],
                7, 10,
                10, 12,
                14, 14
              ],
              'text-anchor': 'center',
              'text-max-width': 8,
              'text-allow-overlap': false,
              'text-padding': 2,
              'symbol-sort-key': ['*', -1, ['coalesce', ['get', 'population'], 0]]
            },
            paint: {
              'text-color': '#404050',
              'text-halo-color': '#ffffff',
              'text-halo-width': 1.5
            }
          },
          // Country labels
          {
            id: 'country-labels',
            type: 'symbol',
            source: 'overture-divisions',
            'source-layer': 'division',
            filter: ['==', ['get', 'subtype'], 'country'],
            minzoom: 1,
            maxzoom: 6,
            layout: {
              'text-field': ['get', '@name'],
              'text-font': ['Noto Sans Bold'],
              'text-size': [
                'interpolate', ['linear'], ['zoom'],
                1, 10,
                3, 14,
                6, 16
              ],
              'text-transform': 'uppercase',
              'text-letter-spacing': 0.15,
              'text-anchor': 'center',
              'text-max-width': 12
            },
            paint: {
              'text-color': '#606070',
              'text-halo-color': '#ffffff',
              'text-halo-width': 2,
              'text-opacity': [
                'interpolate', ['linear'], ['zoom'],
                4, 1,
                6, 0.5
              ]
            }
          },
          // State/region labels
          {
            id: 'state-labels',
            type: 'symbol',
            source: 'overture-divisions',
            'source-layer': 'division',
            filter: ['==', ['get', 'subtype'], 'region'],
            minzoom: 2,
            maxzoom: 10,
            layout: {
              'text-field': ['get', '@name'],
              'text-font': ['Noto Sans Bold'],
              'text-size': [
                'interpolate', ['linear'], ['zoom'],
                2, 8,
                4, 11,
                6, 14,
                10, 12
              ],
              'text-transform': 'uppercase',
              'text-letter-spacing': 0.1,
              'text-anchor': 'center',
              'text-max-width': 10
            },
            paint: {
              'text-color': '#606070',
              'text-halo-color': '#ffffff',
              'text-halo-width': 2,
              'text-opacity': [
                'interpolate', ['linear'], ['zoom'],
                8, 1,
                10, 0.6
              ]
            }
          }
        ]
      },
      center: DEFAULT_CENTER,
      zoom: DEFAULT_ZOOM,
      maxZoom: 18
    });

    // Add navigation controls
    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    // State
    let currentTab = 'forward';
    let markers = [];
    let popup = null;
    let activeRequest = null;
    let requestSequence = 0;

    // DOM Elements
    const tabs = document.querySelectorAll('.tab');
    const forwardPanel = document.getElementById('forward-panel');
    const reversePanel = document.getElementById('reverse-panel');
    const idPanel = document.getElementById('id-panel');
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const latInput = document.getElementById('lat-input');
    const lonInput = document.getElementById('lon-input');
    const reverseBtn = document.getElementById('reverse-btn');
    const idInput = document.getElementById('id-input');
    const idBtn = document.getElementById('id-btn');
    const resultsContainer = document.getElementById('results');

    // Inject "Verify Geometry" toggle into reverse panel
    const verifyToggleHtml = `
      <div style="margin: 12px 0; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="verify-geometry" checked>
        <label for="verify-geometry" style="font-size: 13px; color: rgba(255,255,255,0.8); cursor: pointer;">
          Verify Point in Polygon
        </label>
      </div>
      <div style="font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 12px; margin-left: 20px;">
        Fetches full geometry from Overture S3 to verify exact containment.
      </div>
    `;
    const coordsHint = document.getElementById('coords-hint');
    coordsHint.insertAdjacentHTML('afterend', verifyToggleHtml);
    const verifyGeometryCheckbox = document.getElementById('verify-geometry');

    // Update cursor style based on mode
    function updateCursor() {
      map.getCanvas().style.cursor = currentTab === 'reverse' ? 'crosshair' : '';
    }

    function cancelActiveRequest() {
      if (!activeRequest) return;
      activeRequest.controller.abort();
      activeRequest.button.disabled = false;
      activeRequest = null;
    }

    function combineSignals(primary, secondary) {
      const signals = [primary, secondary].filter(Boolean);
      if (signals.length === 1) return signals[0];
      if (typeof AbortSignal.any === 'function') return AbortSignal.any(signals);

      const controller = new AbortController();
      const abort = () => controller.abort();
      if (signals.some(signal => signal.aborted)) {
        controller.abort();
      } else {
        signals.forEach(signal => signal.addEventListener('abort', abort, { once: true }));
      }
      return controller.signal;
    }

    function beginRequest(button) {
      cancelActiveRequest();

      const controller = new AbortController();
      const requestId = ++requestSequence;
      const requestFetch = (input, init = {}) => {
        const signal = combineSignals(init.signal, controller.signal);
        return fetch(input, { ...init, signal });
      };
      const client = new OvertureGeocoder({
        baseUrl: API_BASE_URL,
        fetch: requestFetch
      });

      button.disabled = true;
      activeRequest = { controller, requestId, button };
      return { client, controller, requestFetch, requestId, button };
    }

    function isCurrentRequest(request) {
      return activeRequest?.requestId === request.requestId && !request.controller.signal.aborted;
    }

    function finishRequest(request) {
      if (activeRequest?.requestId !== request.requestId) return;
      request.button.disabled = false;
      activeRequest = null;
    }

    function selectTab(tabName, { preserveResults = false } = {}) {
      currentTab = tabName;
      tabs.forEach(tab => {
        const selected = tab.dataset.tab === tabName;
        tab.classList.toggle('active', selected);
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });

      forwardPanel.hidden = tabName !== 'forward';
      reversePanel.hidden = tabName !== 'reverse';
      idPanel.hidden = tabName !== 'id';

      cancelActiveRequest();
      if (!preserveResults) {
        clearResults();
        clearMarkers();
      }
      updateCursor();
    }

    // Tab switching
    tabs.forEach(tab => {
      tab.addEventListener('click', () => selectTab(tab.dataset.tab));
      tab.addEventListener('keydown', event => {
        const currentIndex = Array.from(tabs).indexOf(tab);
        let nextIndex;
        if (event.key === 'ArrowRight') nextIndex = (currentIndex + 1) % tabs.length;
        if (event.key === 'ArrowLeft') nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
        if (event.key === 'Home') nextIndex = 0;
        if (event.key === 'End') nextIndex = tabs.length - 1;
        if (nextIndex === undefined) return;

        event.preventDefault();
        const nextTab = tabs[nextIndex];
        selectTab(nextTab.dataset.tab);
        nextTab.focus();
      });
    });

    // Forward geocoding
    async function forwardGeocode(query) {
      const request = beginRequest(searchBtn);
      showLoading();
      clearMarkers();

      try {
        const results = await request.client.search(query, {
          limit: SEARCH_LIMIT
        });

        if (!isCurrentRequest(request)) return;

        displayForwardResults(results);

        if (results.length > 0) {
          addMarkers(results);
          fitBounds(results);
        }
      } catch (error) {
        if (!isCurrentRequest(request)) return;
        showError(error.message);
      } finally {
        finishRequest(request);
      }
    }

    // Reverse geocoding
    async function reverseGeocode(lat, lon) {
      const request = beginRequest(reverseBtn);
      showLoading();
      clearMarkers();

      try {
        const verify = verifyGeometryCheckbox.checked;
        const results = await request.client.reverse(lat, lon, {
          verifyGeometry: verify
        });

        if (!isCurrentRequest(request)) return;

        displayReverseResults(results, lat, lon);

        // Add marker for the searched location
        addClickMarker(lat, lon);

        if (results.length > 0) {
          // Zoom to show the results
          const bounds = new maplibregl.LngLatBounds();
          bounds.extend([lon, lat]);
          results.forEach(r => {
            // Use boundingbox from result [minX, minY, maxX, maxY]
            if (r.boundingbox) {
                bounds.extend([r.boundingbox[0], r.boundingbox[1]]);
                bounds.extend([r.boundingbox[2], r.boundingbox[3]]);
            } else {
                bounds.extend([r.lon, r.lat]);
            }
          });
          map.fitBounds(bounds, { padding: MAP_PADDING, maxZoom: FIT_MAX_ZOOM });
        }
      } catch (error) {
        if (!isCurrentRequest(request)) return;
        showError(error.message);
      } finally {
        finishRequest(request);
      }
    }

    async function lookupId(gersId) {
      const request = beginRequest(idBtn);
      const timeoutController = new AbortController();
      const timeoutId = setTimeout(() => timeoutController.abort(), ID_REQUEST_TIMEOUT_MS);
      showLoading('Looking up ID...');
      clearMarkers();

      try {
        const url = `${API_BASE_URL.replace(/\/$/, '')}/id/${encodeURIComponent(gersId)}`;
        const response = await request.requestFetch(url, {
          method: 'GET',
          headers: { Accept: 'application/json' },
          signal: timeoutController.signal
        });
        if (!isCurrentRequest(request)) return;

        if (response.status === 404) {
          resultsContainer.innerHTML = '<div class="empty-state">GERS ID not found</div>';
          return;
        }
        if (!response.ok) {
          throw new Error(`ID lookup failed: ${response.status} ${response.statusText}`);
        }

        const result = await response.json();
        if (!isCurrentRequest(request)) return;

        displayIdResult(result);
        fitIdBounds(result.bbox);
      } catch (error) {
        if (!isCurrentRequest(request)) return;
        if (timeoutController.signal.aborted) {
          showError('ID lookup timed out. Please try again.');
        } else {
          showError(error.message);
        }
      } finally {
        clearTimeout(timeoutId);
        finishRequest(request);
      }
    }

    function lookupResultId(gersId) {
      if (!gersId) return;
      idInput.value = gersId;
      selectTab('id', { preserveResults: true });
      lookupId(gersId);
    }

    // Display forward geocoding results
    function displayForwardResults(results) {
      if (results.length === 0) {
        resultsContainer.innerHTML = '<div class="empty-state">No results found</div>';
        return;
      }

      let html = '<div class="results-header">Results</div>';

      results.forEach((result, index) => {
        html += `
          <div class="result-item" data-index="${index}" data-lat="${result.lat}" data-lon="${result.lon}">
            <div class="result-name">${escapeHtml(result.primary_name)}</div>
            <div class="result-meta">
              <span class="result-type">${escapeHtml(result.type || 'place')}</span>
              <span class="result-coords">${result.lat.toFixed(5)}, ${result.lon.toFixed(5)}</span>
            </div>
            ${result.gers_id ? `
              <div class="result-actions">
                <button type="button" class="id-lookup-btn" data-id-index="${index}">Test ID API</button>
              </div>
            ` : ''}
          </div>
        `;
      });

      resultsContainer.innerHTML = html;

      // Add click handlers
      document.querySelectorAll('.result-item').forEach(item => {
        item.addEventListener('click', () => {
          const lat = parseFloat(item.dataset.lat);
          const lon = parseFloat(item.dataset.lon);
          map.flyTo({ center: [lon, lat], zoom: FIT_MAX_ZOOM });

          // Show popup
          if (popup) popup.remove();
          const result = results[parseInt(item.dataset.index)];
          popup = new maplibregl.Popup()
            .setLngLat([lon, lat])
            .setHTML(`
              <div class="popup-title">${escapeHtml(result.primary_name)}</div>
              <div class="popup-type">${escapeHtml(result.type || 'place')}</div>
              <div class="popup-coords">${lat.toFixed(5)}, ${lon.toFixed(5)}</div>
            `)
            .addTo(map);
        });
      });

      bindIdLookupButtons(results);
    }

    // Display reverse geocoding results
    function displayReverseResults(results, searchLat, searchLon) {
      if (results.length === 0) {
        resultsContainer.innerHTML = '<div class="empty-state">No results found at this location</div>';
        return;
      }

      let html = '<div class="results-header">Location Hierarchy</div>';

      results.forEach((result, index) => {
        const confidenceClass = result.confidence === 'exact' ? 'text-green-400' : 'text-yellow-400';
        const confidenceLabel = result.confidence === 'exact' ? '✓ Verified' : '⚠ BBox Only';
        const confidenceColor = result.confidence === 'exact' ? '#4ade80' : '#facc15';

        html += `
          <div class="result-item" data-index="${index}" data-lat="${result.lat}" data-lon="${result.lon}">
            <div class="result-name">${escapeHtml(result.primary_name)}</div>
            <div class="result-meta">
              <span class="result-type">${escapeHtml(result.subtype)}</span>
              <span class="result-coords" style="color: ${confidenceColor}; font-weight: bold;">${confidenceLabel}</span>
              <span class="result-coords">${result.distance_km.toFixed(2)} km</span>
            </div>
            ${result.hierarchy ? `
              <div class="hierarchy">
                ${result.hierarchy.map(h => `
                  <div class="hierarchy-item">${escapeHtml(h.name)} (${escapeHtml(h.subtype)})</div>
                `).join('')}
              </div>
            ` : ''}
            ${result.gers_id ? `
              <div class="result-actions">
                <button type="button" class="id-lookup-btn" data-id-index="${index}">Test ID API</button>
              </div>
            ` : ''}
          </div>
        `;
      });

      resultsContainer.innerHTML = html;

      // Add click handlers
      document.querySelectorAll('.result-item').forEach(item => {
        item.addEventListener('click', () => {
          const lat = parseFloat(item.dataset.lat);
          const lon = parseFloat(item.dataset.lon);
          map.flyTo({ center: [lon, lat], zoom: REVERSE_RESULT_ZOOM });
        });
      });

      bindIdLookupButtons(results);
    }

    function bindIdLookupButtons(results) {
      document.querySelectorAll('.id-lookup-btn').forEach(button => {
        button.addEventListener('click', event => {
          event.stopPropagation();
          const result = results[Number(button.dataset.idIndex)];
          lookupResultId(result?.gers_id);
        });
      });
    }

    function displayIdResult(result) {
      const bbox = result.bbox || {};
      const details = [
        ['ID', result.id],
        ['Data version', result.data_version],
        ['Bounds', formatBbox(bbox)],
        ['Theme / type', [result.theme, result.feature_type].filter(Boolean).join(' / ')],
        ['Current release', formatBoolean(result.exists_in_current_release)],
        ['Registry member', formatBoolean(result.registry_member)],
        ['Last seen', result.last_seen_release],
        ['Source file', result.filename],
        ['Overture path', result.overture_path]
      ].filter(([, value]) => value !== undefined && value !== null && value !== '');

      resultsContainer.innerHTML = `
        <div class="results-header">ID Lookup Result</div>
        <div class="result-item">
          <div class="result-name">${escapeHtml(result.id)}</div>
          <div class="id-details">
            ${details.map(([label, value]) => `
              <div class="id-detail">
                <span class="id-detail-label">${escapeHtml(label)}</span>
                <span class="id-detail-value">${escapeHtml(value)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function formatBoolean(value) {
      if (value === undefined || value === null) return null;
      return value ? 'yes' : 'no';
    }

    function formatBbox(bbox) {
      const values = [bbox.xmin, bbox.ymin, bbox.xmax, bbox.ymax];
      if (!values.every(Number.isFinite)) return null;
      return values.map(value => value.toFixed(6)).join(', ');
    }

    function fitIdBounds(bbox) {
      if (!bbox) return;
      const values = [bbox.xmin, bbox.ymin, bbox.xmax, bbox.ymax];
      if (!values.every(Number.isFinite)) return;

      const bounds = new maplibregl.LngLatBounds(
        [bbox.xmin, bbox.ymin],
        [bbox.xmax, bbox.ymax]
      );
      map.fitBounds(bounds, { padding: MAP_PADDING, maxZoom: FIT_MAX_ZOOM });
    }

    // Add markers for results
    function addMarkers(results) {
      results.forEach((result, index) => {
        const el = document.createElement('div');
        el.className = 'marker';
        el.setAttribute('role', 'button');
        el.setAttribute('tabindex', '0');
        el.setAttribute('aria-label', `Result ${index + 1}: ${result.primary_name}`);
        el.style.cssText = `
          width: 24px;
          height: 24px;
          background: linear-gradient(135deg, #3b82f6, #6366f1);
          border-radius: 50%;
          border: 2px solid #fff;
          box-shadow: 0 2px 8px rgba(0,0,0,0.4);
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #fff;
          font-size: 11px;
          font-weight: 600;
        `;
        el.textContent = index + 1;

        const marker = new maplibregl.Marker({ element: el })
          .setLngLat([result.lon, result.lat])
          .addTo(map);

        const showMarkerPopup = () => {
          if (popup) popup.remove();
          popup = new maplibregl.Popup()
            .setLngLat([result.lon, result.lat])
            .setHTML(`
              <div class="popup-title">${escapeHtml(result.primary_name)}</div>
              <div class="popup-type">${escapeHtml(result.type || result.subtype || 'place')}</div>
              <div class="popup-coords">${result.lat.toFixed(5)}, ${result.lon.toFixed(5)}</div>
            `)
            .addTo(map);
        };

        el.addEventListener('click', showMarkerPopup);
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            showMarkerPopup();
          }
        });

        markers.push(marker);
      });
    }

    // Add click marker for reverse geocoding
    function addClickMarker(lat, lon) {
      const el = document.createElement('div');
      el.style.cssText = `
        width: 20px;
        height: 20px;
        background: #ef4444;
        border-radius: 50%;
        border: 3px solid #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      `;

      const marker = new maplibregl.Marker({ element: el })
        .setLngLat([lon, lat])
        .addTo(map);

      markers.push(marker);
    }

    // Fit map bounds to results
    function fitBounds(results) {
      if (results.length === 0) return;

      const bounds = new maplibregl.LngLatBounds();
      results.forEach(r => {
        // Use boundingbox from result [minX, minY, maxX, maxY] if available
        if (r.boundingbox) {
            bounds.extend([r.boundingbox[0], r.boundingbox[1]]);
            bounds.extend([r.boundingbox[2], r.boundingbox[3]]);
        } else {
            bounds.extend([r.lon, r.lat]);
        }
      });

      map.fitBounds(bounds, { padding: MAP_PADDING, maxZoom: FIT_MAX_ZOOM });
    }

    // Clear markers
    function clearMarkers() {
      markers.forEach(m => m.remove());
      markers = [];
      if (popup) {
        popup.remove();
        popup = null;
      }
    }

    // Clear results
    function clearResults() {
      resultsContainer.innerHTML = '';
    }

    // Show loading state
    function showLoading(message = 'Searching...') {
      resultsContainer.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <span>${escapeHtml(message)}</span>
        </div>
      `;
    }

    // Show error
    function showError(message) {
      resultsContainer.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
    }

    // Escape HTML
    function escapeHtml(value) {
      if (value === undefined || value === null) return '';
      return String(value).replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[c]);
    }

    // Event listeners
    searchBtn.addEventListener('click', () => {
      const query = searchInput.value.trim();
      if (query) {
        forwardGeocode(query);
      }
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const query = searchInput.value.trim();
        if (query) {
          forwardGeocode(query);
        }
      }
    });

    reverseBtn.addEventListener('click', () => {
      const lat = parseFloat(latInput.value);
      const lon = parseFloat(lonInput.value);
      if (Number.isFinite(lat) && Number.isFinite(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
        reverseGeocode(lat, lon);
      } else {
        showError('Enter a latitude from -90 to 90 and a longitude from -180 to 180.');
      }
    });

    idBtn.addEventListener('click', () => {
      const gersId = idInput.value.trim();
      if (gersId.length >= 2 && gersId.length <= 64) {
        lookupId(gersId);
      } else {
        showError('Enter a GERS ID between 2 and 64 characters.');
      }
    });

    idInput.addEventListener('keydown', event => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      idBtn.click();
    });

    // Map click for reverse geocoding
    map.on('click', (e) => {
      if (currentTab === 'reverse') {
        const { lat, lng } = e.lngLat;
        latInput.value = lat.toFixed(6);
        lonInput.value = lng.toFixed(6);
        reverseGeocode(lat, lng);
      }
    });

    // Update cursor on map load and when entering the map canvas
    const canvas = map.getCanvas();
    canvas.addEventListener('mouseenter', updateCursor);
    map.on('load', updateCursor);
  </script>
</body>
