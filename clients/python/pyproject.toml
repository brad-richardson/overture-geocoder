[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overture-geocoder"
version = "0.2.0"
description = "Forward and reverse geocoder using Overture Maps data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Brad Richardson" }
]
keywords = ["geocoding", "overture", "maps", "nominatim"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
geometry = [
    "overturemaps>=0.8.0",
    "shapely>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-httpx>=0.30.0",
    "respx>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/brad-richardson/overture-geocoder"
Repository = "https://github.com/brad-richardson/overture-geocoder"

[tool.hatch.build.targets.wheel]
packages = ["overture_geocoder"]

# Anchor this package's own pytest rootdir. Without a [tool.pytest.ini_options]
# table here, pytest's ini discovery walks up out of clients/python and adopts
# the repository-root pytest.ini -- so the client suite would silently inherit
# the pipeline suite's settings, including `-n auto`, even though the client's
# dev extra does not install pytest-xdist. This table stops that walk.
[tool.pytest.ini_options]
testpaths = ["tests"]
