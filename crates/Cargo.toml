[workspace]
resolver = "2"
members = [
    "geocoder-construction",
    "geocoder-core",
    "geocoder-cli",
    "geocoder-worker",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/brad-richardson/overture-geocoder"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# SQLite - supports both native and wasm32-unknown-unknown (0.38+)
rusqlite = { version = "0.38", features = ["bundled", "serialize", "functions"] }

# Async runtime (for CLI)
tokio = { version = "1.0", features = ["full"] }

# Testing
pretty_assertions = "1.4"
