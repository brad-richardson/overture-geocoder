[package]
name = "geocoder-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cloudflare Worker for Overture geocoding"

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Isolated smoke-only address page route (`/__address-page-spike`) that reads a
# raw R2 prefix supplied by the address smoke deploy. The reader machinery it
# exercised (address page decode, range reader, gzip) is now compiled into every
# build so the production `/address` route can reuse it; this feature only gates
# the raw-prefix smoke ROUTE, not the shared read path.
address-spike = []
# Experimental smoke-only compact Places payload reader.
places-spike = []

[dependencies]
# Cloudflare Workers
worker = "0.7"

# Core geocoder with rusqlite (supports wasm32 in 0.38+)
geocoder-core = { path = "../geocoder-core" }
rusqlite = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

# Async
futures = "0.3"

# Parquet reading (snappy only, minimal features for wasm32)
parquet = { version = "54", default-features = false, features = ["snap"] }
bytes = "1"
# gzip decode for the address page reader. The production `/address` route
# reads the same range-readable address pages as the smoke spike, so this is a
# non-optional dependency; the `rust_backend` (miniz_oxide) build compiles to
# wasm32-unknown-unknown.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# NFC normalization for the structured `/address` lookup key. Pure-Rust,
# wasm32-compatible; used to reproduce the producer's
# NFC + Unicode-whitespace-collapse + ASCII-lowercase key contract.
unicode-normalization = "0.1"

# WASM compatibility
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
