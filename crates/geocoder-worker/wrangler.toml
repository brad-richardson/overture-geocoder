name = "geocoder"
main = "build/worker/shim.mjs"
compatibility_date = "2026-05-01"

[observability]
# Workers Logs enriches custom events with request metadata, including URLs.
# Disable persistence so search text, coordinates, and ID path parameters are
# not retained. Built-in Worker request/error analytics remain available.
enabled = false

[build]
# Install ONLY when the tool is missing. `cargo install` hard-errors with
# "binary `worker-build` already exists in destination" (exit 101) whenever the
# binary is present but cargo has no record of installing it -- which is exactly
# what `deploy-rust-worker.yml`'s cache produces, because it restores
# `~/.cargo/bin/worker-build` alone and not `.crates.toml`. That broke every
# cache-hit production deploy from 2026-08-04 until 2026-08-07 and forced a
# hand-deploy of the proximity wave.
#
# `A || B && C` is `(A || B) && C`: the build runs when the tool was already
# there or was just installed, and is skipped -- non-zero -- when the install
# itself fails. Keep this exact fallback synchronized with the deploy workflow:
# worker-build 0.8.5 rejects this crate's worker 0.7.x dependency, while 0.7.5
# declares worker >=0.7.0 and builds it.
command = "command -v worker-build >/dev/null 2>&1 || cargo install -q --locked worker-build@0.7.5 && worker-build --release"

# CPU limit to prevent runaway requests
[limits]
cpu_ms = 500

# Custom domain for Cache API support
routes = [
  { pattern = "geocoder.bradr.dev", custom_domain = true }
]

[[r2_buckets]]
binding = "SHARDS_BUCKET"
bucket_name = "geocoder-shards"

# Rate limiting: 60 requests per minute per IP
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[vars]
ENVIRONMENT = "production"
ENABLE_V2_SERVING = "false"
