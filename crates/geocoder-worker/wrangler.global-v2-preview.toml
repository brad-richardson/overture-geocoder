name = "geocoder-global-v2-preview"
main = "build/worker/shim.mjs"
compatibility_date = "2026-05-01"
workers_dev = true

[observability]
enabled = true

[build]
command = "worker-build --release"

[limits]
cpu_ms = 500

[[r2_buckets]]
binding = "SHARDS_BUCKET"
bucket_name = "geocoder-shards"

[vars]
ENVIRONMENT = "preview"
ENABLE_V2_SERVING = "true"
V2_CATALOG_KEY_OVERRIDE = "smoketest-v2/placeholder/catalog.json"
EXPECTED_V2_CATALOG_KEY = "smoketest-v2/placeholder/catalog.json"
EXPECTED_GEOCODER_BUILD = "1970-01-01.0"
EXPECTED_OVERTURE_RELEASE = "1970-01-01.0"
