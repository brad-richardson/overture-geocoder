name = "geocoder-id-smoke"
main = "build/worker/shim.mjs"
compatibility_date = "2026-05-01"
workers_dev = true

[build]
command = "cargo install -q worker-build@^0.7 && worker-build --release"

[limits]
cpu_ms = 500

[[r2_buckets]]
binding = "SHARDS_BUCKET"
bucket_name = "geocoder-shards"

[vars]
ENVIRONMENT = "smoke"
CATALOG_KEY_OVERRIDE = "smoketest-id/catalog.json"
