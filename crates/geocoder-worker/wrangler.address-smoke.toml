name = "geocoder-address-smoke"
main = "build/worker/shim.mjs"
compatibility_date = "2026-05-01"
workers_dev = true

[build]
# The address page decoder is gated behind the `address-spike` cargo feature
# and ships only in this smoke build; production (wrangler.toml) omits it.
# worker-build forwards trailing args straight to `cargo build`.
command = "worker-build --release --features address-spike"

[limits]
cpu_ms = 500

[[r2_buckets]]
binding = "SHARDS_BUCKET"
bucket_name = "geocoder-shards"

[vars]
ENVIRONMENT = "address-smoke"
