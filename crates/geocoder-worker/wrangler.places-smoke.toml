name = "geocoder-places-smoke"
main = "build/worker/shim.mjs"
compatibility_date = "2026-05-01"
workers_dev = true

[build]
command = "worker-build --release --features places-spike"

[limits]
cpu_ms = 500

[[r2_buckets]]
binding = "SHARDS_BUCKET"
bucket_name = "geocoder-shards"

[vars]
ENVIRONMENT = "places-smoke"
